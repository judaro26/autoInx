        // Function to log e-consent to Firestore
        async function logEconsent(userId, email, ipAddress, tosVersion = 'v2026-02-12') {
            if (!db) return console.error("Firestore not initialized for e-consent logging.");
        
            try {
                // We store this in a sub-collection under the user so you can track

                    tosAccepted: true,
                    tosVersion: tosVersion,

                    timestamp: serverTimestamp(),
                    userAgent: navigator.userAgent,

                });
                
                console.log(`E-Consent version ${tosVersion} logged for user:`, userId);
                return true;
            } catch (error) {
                console.error("Error logging e-consent:", error);
                return false;
            }
        }


        async function verifyCaptcha(token) {
            if (!token) return false;

            // Save token locally before clearing the global state
            const currentToken = state.captchaToken;
            state.captchaToken = null; // Clear immediately to prevent accidental reuse

            try {
                const response = await fetch(CAPTCHA_VERIFY_FUNCTION, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Use the locally saved token, but this is the original code structure:
                    body: JSON.stringify({ token })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const result = await response.json();
                // The Netlify function should return { success: true/false }
                return result.success; // The server determines success

            } catch (error) {
                console.error("Error verifying reCAPTCHA:", error);
                return false;
            }
        }

        /** Converts a raw video URL into an embed object: { type: 'iframe'|'video', src } */
        function getVideoEmbed(url) {
            if (!url) return null;
            const u = url.trim();

            // YouTube watch: https://www.youtube.com/watch?v=ID
            const ytWatch = u.match(/youtube\.com\/watch\?(?:.*&)?v=([\w-]+)/);
            if (ytWatch) return { type: 'iframe', src: `https://www.youtube.com/embed/${ytWatch[1]}?rel=0` };

            // YouTube Shorts: https://youtube.com/shorts/ID or https://www.youtube.com/shorts/ID
            const ytShorts = u.match(/youtube\.com\/shorts\/([\w-]+)/);
            if (ytShorts) return { type: 'iframe', src: `https://www.youtube.com/embed/${ytShorts[1]}?rel=0` };

            // YouTube short link: https://youtu.be/ID
            const ytShort = u.match(/youtu\.be\/([\w-]+)/);
            if (ytShort) return { type: 'iframe', src: `https://www.youtube.com/embed/${ytShort[1]}?rel=0` };

            // YouTube embed already: https://www.youtube.com/embed/ID
            if (u.includes('youtube.com/embed/')) return { type: 'iframe', src: u };

            // Vimeo: https://vimeo.com/ID
            const vimeo = u.match(/vimeo\.com\/(\d+)/);
            if (vimeo) return { type: 'iframe', src: `https://player.vimeo.com/video/${vimeo[1]}` };

            // Google Drive: cannot be iframed (CSP blocks it) — show external link instead
            const gdrive = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
            if (gdrive) return { type: 'link', src: `https://drive.google.com/file/d/${gdrive[1]}/view`, label: '▶ Watch on Google Drive' };

            // Google Vids: no public embed endpoint exists — show external link instead
            const gvids = u.match(/docs\.google\.com\/videos\/d\/([\w-]+)/);
            if (gvids) return { type: 'link', src: `https://docs.google.com/videos/d/${gvids[1]}/view`, label: '▶ Watch on Google Vids' };

            // Direct video file
            if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)) return { type: 'video', src: u };

            return null;
        }

        // --- RENDER CHAT WIDGET (MODIFIED) ---
        // Returns true if current time is within the configured chat hours
        function isWhatsAppHours() {
            const sched = state.chatSchedule;
            if (!sched || !sched.enableTime || !sched.disableTime) return true; // no config → always on

            const now        = new Date();
            const dayOfWeek  = now.getDay(); // 0=Sun … 6=Sat
            const activeDays = Array.isArray(sched.activeDays) ? sched.activeDays : [1,2,3,4,5];

            if (!activeDays.includes(dayOfWeek)) return false;

            // Parse "HH:MM" times
            const [onH,  onM]  = sched.enableTime.split(':').map(Number);
            const [offH, offM] = sched.disableTime.split(':').map(Number);
            const nowMins  = now.getHours() * 60 + now.getMinutes();
            const onMins   = onH  * 60 + onM;
            const offMins  = offH * 60 + offM;

            // Handle overnight ranges (e.g. 20:00 – 02:00)
            if (onMins <= offMins) return nowMins >= onMins && nowMins < offMins;
            return nowMins >= onMins || nowMins < offMins;
        }

        async function submitEmailSignup() {
            const input  = document.getElementById('footerEmailInput');
            const result = document.getElementById('footerEmailResult');
            const isSp   = currentLang === 'es';
            const email  = (input?.value || '').trim();

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                if (result) { result.textContent = isSp ? 'Por favor ingresa un correo válido.' : 'Please enter a valid email.'; result.style.color='#dc2626'; result.classList.remove('hidden'); }
                return;
            }

            const btn = document.querySelector('#footerEmailSignupWrap button');
            if (btn) btn.disabled = true;

            try {
                // Save to Firestore email_subscribers collection
                const { collection: col, addDoc: aDoc, serverTimestamp: sTs, query: q, where: w, getDocs: gDocs } =
                    await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                // Check if already subscribed
                const existing = await gDocs(q(col(db, 'email_subscribers'), w('email', '==', email)));
                if (!existing.empty) {
                    if (result) { result.textContent = isSp ? '✅ Ya estás suscrito.' : '✅ You are already subscribed!'; result.style.color='#16a34a'; result.classList.remove('hidden'); }
                    if (input) input.value = '';
                    return;
                }

                await aDoc(col(db, 'email_subscribers'), {
                    email,
                    source:       'footer_signup',
                    lang:         currentLang,
                    subscribedAt: sTs(),
                    active:       true,
                });

                window._gtag('event', 'sign_up', { method: 'email_newsletter' });

                if (result) { result.textContent = isSp ? '✅ ¡Suscrito! Te avisaremos cuando lleguen piezas nuevas.' : '✅ Subscribed! We will notify you when new parts arrive.'; result.style.color='#16a34a'; result.classList.remove('hidden'); }
                if (input) input.value = '';
            } catch (err) {
                console.error('Email signup error:', err);
                if (result) { result.textContent = isSp ? 'Error. Intenta de nuevo.' : 'Error. Please try again.'; result.style.color='#dc2626'; result.classList.remove('hidden'); }
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function submitChatEscalation() {
            const email  = (document.getElementById('chatEscEmail')?.value || '').trim();
            const msg    = (document.getElementById('chatEscMsg')?.value   || '').trim();
            const result = document.getElementById('chatEscResult');
            const isSp   = currentLang === 'es';

            if (!email || !msg) {
                if (result) { result.textContent = isSp ? 'Por favor completa todos los campos.' : 'Please fill in all fields.'; result.style.color='#dc2626'; result.classList.remove('hidden'); }
                return;
            }

            const history = _aiChatHistory.map(m => (m.role==='user'?'Customer: ':'Bot: ') + m.content).join('\n');
            const btn = document.querySelector('#chatEscalationForm button');
            if (btn) btn.disabled = true;

            try {
                await fetch('/.netlify/functions/sendSupportEmail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from:        email,
                        subject:     isSp ? 'Consulta de soporte - AutoInx' : 'Support inquiry - AutoInx',
                        message:     msg,
                        chatHistory: history || '—',

                if (result) { result.textContent = isSp ? '✅ ¡Mensaje enviado! Te respondemos pronto.' : '✅ Message sent! We will get back to you soon.'; result.style.color='#16a34a'; result.classList.remove('hidden'); }
                if (document.getElementById('chatEscEmail')) document.getElementById('chatEscEmail').value = '';
                if (document.getElementById('chatEscMsg'))   document.getElementById('chatEscMsg').value   = '';
            } catch {
                if (result) { result.textContent = isSp ? 'Error al enviar. Escríbenos a support@autoinx.com' : 'Send failed. Email us at support@autoinx.com'; result.style.color='#dc2626'; result.classList.remove('hidden'); }
            } finally {
                if (btn) btn.disabled = false;
            }
        }

            const isOpen = !panel.classList.contains('hidden');

        async function sendAiChatMessage() {
            const input = document.getElementById('aiChatInput');
            const sendBtn = document.getElementById('aiChatSendBtn');
            const msgContainer = document.getElementById('aiChatMessages');
            if (!input || !msgContainer) return;

            const text = input.value.trim();
            if (!text) return;

            // Add user message to UI
            _aiChatHistory.push({ role: 'user', content: text });
            input.value = '';
            if (sendBtn) sendBtn.disabled = true;
            _renderAiChatMessages(msgContainer);

            // Typing indicator
            const typingId = 'ai-typing-' + Date.now();
            msgContainer.insertAdjacentHTML('beforeend', `
                <div id="${typingId}" class="flex gap-2 items-start">
                    <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center text-xs flex-shrink-0">🔧</div>
                    <div class="bg-white rounded-xl rounded-tl-none px-3 py-2 shadow-sm">
                        <div class="flex gap-1 items-center h-5">
                            <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                            <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                            <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                        </div>
                    </div>
                </div>`);
            msgContainer.scrollTop = msgContainer.scrollHeight;

            try {
                // Build compact product list from loaded catalog — include id for cart matching
                const brand = state.branding || {};
                const storeName = brand.headerText?.en || brand.headerText || 'AutoInx';
                const products = state.items
                    .filter(i => !i.temporarilyUnavailable)
                    .map(i => ({
                        id:    i.id,
                        name:  i.name,
                        sku:   i.sku || i.id,
                        price: ((i.price || 0) / 100).toFixed(2),
                        description: (i.description || '').replace(/<[^>]*>/g, '').slice(0, 150),
                        stock: i.stock,
                    }));

                const res = await fetch('/.netlify/functions/catalogChat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages:        _aiChatHistory,
                        products,
                        storeName,
                        isBusinessHours: isWhatsAppHours(),
                    }),
                });

                const data = await res.json();
                const reply           = data.reply           || 'Sorry, I could not get a response. Please try again.';
                const recommendations = Array.isArray(data.recommendations) ? data.recommendations : [];

                // Match returned SKUs to actual state.items for Add to Cart
                const matchedItems = recommendations
                    .map(sku => state.items.find(i => (i.sku || i.id) === sku && !i.temporarilyUnavailable && (i.stock || 0) > 0))
                    .filter(Boolean);

                _aiChatHistory.push({ role: 'assistant', content: reply, _items: matchedItems });
            } catch {
                _aiChatHistory.push({ role: 'assistant', content: 'Sorry, the chat service is temporarily unavailable. Please contact us at support@autoinx.com.' });
            } finally {
                document.getElementById(typingId)?.remove();
                _renderAiChatMessages(msgContainer);
                if (sendBtn) sendBtn.disabled = false;
                input.focus();
            }
        }

        function _renderAiChatMessages(container) {
            if (!container) return;
            const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

                    <div class="md:col-span-2">
                        ${renderCartSidebar(getTotalCartPrice())}
                    </div>

            `;
        }
        // --- HELPER FUNCTIONS ---
        const formatPrice = (price) => `$${(price / 100).toFixed(2)}`;
        const getTotalCartPrice = () => Object.values(state.cart).reduce((total, entry) => total + (entry.item.price || 0) * entry.quantity, 0);
        function showMessage(type, text, duration = 4000) {
            state.message = { type, text };
            render();
            setTimeout(() => {
                state.message = null;
                render();
            }, duration);
        }

        function getFilteredAndCategorizedItems() {
            let filtered = state.items;
            const term = state.productSearchTerm.toLowerCase();
            if (term) {
                filtered = filtered.filter(item =>
                    item.name.toLowerCase().includes(term) ||
                    item.description.toLowerCase().includes(term)
                );
            }
            if (state.selectedCategoryId && state.selectedCategoryId !== 'all') {
                filtered = filtered.filter(item => item.catalogId === state.selectedCategoryId);
            }
            // Apply sort
            const sort = state.sortBy || 'default';
            if (sort === 'price_asc')  filtered = [...filtered].sort((a,b) => (a.price||0) - (b.price||0));
            if (sort === 'price_desc') filtered = [...filtered].sort((a,b) => (b.price||0) - (a.price||0));
            if (sort === 'name_asc')   filtered = [...filtered].sort((a,b) => (a.name||'').localeCompare(b.name||''));
            if (sort === 'rating')     filtered = [...filtered].sort((a,b) => {
                const ra = state.itemRatings?.[a.id]; const rb = state.itemRatings?.[b.id];
                const avgA = ra ? ra.total/ra.count : 0; const avgB = rb ? rb.total/rb.count : 0;
                return avgB - avgA;
            });
            return filtered;
        }

        function handleSortChange(e) {
            state.sortBy = e.target.value;
            render();
        }

        function handleProductSearchInput(e) {
            const inputId        = e.target.id || 'product-search-input';
            const selectionStart = e.target.selectionStart;
            const selectionEnd   = e.target.selectionEnd;
            state.productSearchTerm = e.target.value;

            // Clear AI results immediately when term changes
            if (state.productSearchTerm !== state.aiSearch.term) {
                state.aiSearch = { loading: false, results: [], message: '', term: '' };
            }

            render();

            // GA4 search event
            clearTimeout(window._searchGaTimer);
            if (state.productSearchTerm.length >= 2) {
                window._searchGaTimer = setTimeout(() => {
                    window._gtag('event', 'search', { search_term: state.productSearchTerm });
                }, 800);
            }

            // AI suggestions — debounce 700ms, min 3 chars
            clearTimeout(window._aiSearchTimer);
            if (state.productSearchTerm.trim().length >= 3) {
                state.aiSearch.loading = true;
                _updateAiSearchPanel();
                window._aiSearchTimer = setTimeout(() => {
                    triggerAiSearch(state.productSearchTerm.trim());
                }, 700);
            } else {
                clearTimeout(window._aiSearchTimer);
                state.aiSearch = { loading: false, results: [], message: '', term: '' };
            }

            // Restore focus/cursor after render
            const newInput = document.getElementById(inputId);
            if (newInput) {
                newInput.focus();
                newInput.setSelectionRange(selectionStart, selectionEnd);
            }
        }

        // Update only the AI panel without full re-render (avoids cursor loss)
        function _updateAiSearchPanel() {
            const wrapper = document.getElementById('ai-search-panel-wrapper');
            if (wrapper) {
                const ai = state.aiSearch;
                const term = state.productSearchTerm;
                if (!term || term.length < 3) { wrapper.innerHTML = ''; return; }

                if (ai.loading) {
                    const isSp = currentLang === 'es';
                    wrapper.innerHTML = '<div class="mt-2 px-3 py-2.5 bg-white border border-indigo-100 rounded-xl shadow-sm flex items-center gap-2 text-sm text-indigo-500">'
                        + '<span class="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin flex-shrink-0"></span>'
                        + '<span>' + (isSp ? 'Buscando con IA…' : 'AI is searching your catalog…') + '</span></div>';
                    return;
                }

                if (!ai.results.length && !ai.message) { wrapper.innerHTML = ''; return; }

                const isSp = currentLang === 'es';
                const fmt = cents => '$' + (cents / 100).toFixed(2);

                const cards = ai.results.map(item => {
                    const img    = item.imageUrls?.[0] || item.imageUrl || '';
                    const inCart = state.cart[item.id];
                    return '<div class="flex items-center gap-3 p-2 hover:bg-indigo-50 rounded-xl transition group">'
                        + (img ? '<img src="' + img + '" class="w-12 h-12 object-contain rounded-lg flex-shrink-0 bg-gray-50 border border-gray-100" onerror="this.style.display=\'none\'">'
                               : '<div class="w-12 h-12 bg-gray-100 rounded-lg flex-shrink-0 flex items-center justify-center text-xl">📦</div>')
                        + '<div class="flex-1 min-w-0 cursor-pointer" onclick="window.module.openItemDetailModal_byId(\'' + item.id + '\')">'
                        +   '<p class="text-sm font-semibold text-gray-800 truncate group-hover:text-indigo-700">' + item.name + '</p>'
                        +   '<p class="text-xs font-bold text-indigo-600 mt-0.5">' + fmt(item.price)
                        +   (item.stock > 0 ? ' <span class="text-green-600 font-normal">· In stock</span>' : ' <span class="text-red-500 font-normal">· Out of stock</span>') + '</p>'
                        + '</div>'
                        + '<button onclick="window.module.addToCartById(\'' + item.id + '\')"  '
                        +   'class="flex-shrink-0 text-xs px-2.5 py-1.5 rounded-lg font-bold transition whitespace-nowrap '
                        +   (inCart ? 'bg-green-100 text-green-700 hover:bg-green-200' : item.stock > 0 ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed') + '" '
                        +   (item.stock <= 0 ? 'disabled' : '') + '>'
                        +   (inCart ? '✓ ' + (isSp ? 'En carrito' : 'In cart') : isSp ? '+ Agregar' : '+ Add')
                        + '</button>'
                        + '</div>';
                }).join('');

                wrapper.innerHTML = '<div class="mt-2 bg-white border border-indigo-100 rounded-xl shadow-lg overflow-hidden">'
                    + '<div class="px-3 py-2 bg-gradient-to-r from-indigo-50 to-purple-50 border-b border-indigo-100 flex items-center justify-between">'

        let _globalConfigCache   = null;
        let _globalConfigFetching = null;

        // Check if the admin panel signalled a config change in this browser session
        // If so, clear the in-memory cache so the next fetchAndApplyGlobalConfig hits
        // the network with ?nocache=1 instead of returning stale data.
        try {
            const bust = sessionStorage.getItem('autoinx_config_bust');
            if (bust && Date.now() - parseInt(bust) < 30000) {
                // Admin saved within the last 30 seconds — skip cache this cycle
                _globalConfigCache = null;
                sessionStorage.removeItem('autoinx_config_bust');
            }
        } catch {}

        async function fetchAndApplyGlobalConfig() {
            // If already cached, apply it immediately without any network call
            if (_globalConfigCache) {
                _applyGlobalConfig(_globalConfigCache);
                return;
            }
            // If a fetch is already in flight, wait for it instead of starting another
            if (_globalConfigFetching) {
                await _globalConfigFetching;
                return;
            }
            _globalConfigFetching = (async () => {
                try {
                    // Use ?nocache=1 if this is a post-save refresh (bust signal was set)
                    const bust = (() => { try { return !!sessionStorage.getItem('autoinx_config_bust_active'); } catch { return false; } })();
                    const url  = bust ? GET_PUBLIC_CONFIG_FUNCTION + '?nocache=1' : GET_PUBLIC_CONFIG_FUNCTION;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Failed to fetch global config.');
                    const config = await response.json();
                    _globalConfigCache = config;
                    _applyGlobalConfig(config);
                } catch (error) {
                    console.error("Error fetching global config:", error);
                    state.chatWidgetEnabled = false;
                } finally {
                    _globalConfigFetching = null;
                }
            })();
            await _globalConfigFetching;
        }

        // Haversine formula — returns distance in miles between two lat/lng points
        function haversineMiles(lat1, lon1, lat2, lon2) {
            const R  = 3958.8; // Earth radius in miles
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a  = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Fetch lat/lng + city/state for a US zip code via free Zippopotam.us API

            if (!res.ok) throw new Error('ZIP not found');
            const data = await res.json();
            const place = data.places?.[0];
            if (!place) throw new Error('No location data');
            return {

                lng:   parseFloat(place.longitude),
                city:  place['place name'] || '',
                state: place['state abbreviation'] || '',
            };

        // Called when user finishes typing their zip
        // Maps distance in miles to a shipping estimate.
        // Based on USPS/UPS Ground typical transit times from Hayward, CA 94541.
        function getDeliveryEstimate(miles) {
            if (miles === null || miles === undefined) return null;
            // Determine business days in transit
            let days, label, color;
            if (miles <= 50) {
                days  = '1';
                label = 'Next business day';
                color = 'text-green-600';
            } else if (miles <= 350) {
                days  = '1–2';
                label = '1–2 business days';
                color = 'text-green-600';
            } else if (miles <= 900) {
                days  = '2–3';
                label = '2–3 business days';
                color = 'text-blue-600';
            } else if (miles <= 1800) {
                days  = '3–4';
                label = '3–4 business days';
                color = 'text-blue-600';
            } else if (miles <= 2800) {
                days  = '4–5';
                label = '4–5 business days';
                color = 'text-indigo-600';
            } else {
                days  = '5–7';
                label = '5–7 business days';
                color = 'text-indigo-600';
            }
            // Estimate arrival date range (skip weekends)
            function addBusinessDays(date, n) {
                let d = new Date(date);
                let added = 0;
                while (added < n) {
                    d.setDate(d.getDate() + 1);
                    if (d.getDay() !== 0 && d.getDay() !== 6) added++;
                }
                return d;
            }
            const fmt = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const [minDays, maxDays] = days.split('–').map(Number);
            const now  = new Date();
            const low  = addBusinessDays(now, minDays);
            const high = maxDays ? addBusinessDays(now, maxDays) : null;
            const arrival = high && high.getTime() !== low.getTime()
                ? `${fmt(low)} – ${fmt(high)}`
                : fmt(low);

            return { label, color, arrival, days };
        }

        async function handleZipInput(zip) {
            state.customerZip       = zip.trim();
            state.shippingEstimate  = null;
            state.taxEstimate       = null;

            if (state.customerZip.length < 5) {
                state.zipCheckState   = 'idle';
                state.isLocalEligible = false;
                state.deliveryMethod  = 'ship';
                _updatePickupSection();
                return;
            }
            if (!/^\d{5}$/.test(state.customerZip)) {
                state.zipCheckState = 'error';
                _updatePickupSection();
                return;
            }

            state.zipCheckState = 'checking';
            _updatePickupSection();

            try {
                const [customer, store] = await Promise.all([
                    zipToLatLng(state.customerZip),
                    zipToLatLng(STORE_ZIP),
                ]);
                const miles = haversineMiles(customer.lat, customer.lng, store.lat, store.lng);
                state.localDistanceMiles = Math.round(miles);
                state.customerCity       = customer.city;
                state.customerState      = customer.state;
                state.isLocalEligible    = miles <= PICKUP_RADIUS_MI;
                state.zipCheckState      = state.isLocalEligible ? 'eligible' : 'ineligible';
                if (!state.isLocalEligible) state.deliveryMethod = 'ship';
            } catch {
                state.zipCheckState   = 'error';
                state.isLocalEligible = false;
                state.deliveryMethod  = 'ship';
                _updatePickupSection();
                _savePickupPreference();
                return;
            }

            // Show distance result immediately, then fetch live rates in background
            _updatePickupSection();
            _savePickupPreference();

            // Fetch real Shippo rates + tax only when cart has items
            if (Object.keys(state.cart).length > 0 && state.customerState) {
                try {
                    const { shippingResult, taxResult } = await fetchShippingAndTaxEstimate(
                        state.customerZip, state.customerCity, state.customerState
                    );
                    state.shippingEstimate = shippingResult;
                    state.taxEstimate      = taxResult;
                } catch (e) {
                    console.warn('Rate fetch failed:', e.message);
                }
                _updatePickupSection();
            }
        }

        function setReviewRating(itemId, rating) {
            _reviewRatings[itemId] = rating;
            const container = document.getElementById('star-input-' + itemId);
            const label     = document.getElementById('star-label-' + itemId);

        async function loadReviews(itemId) {
            const listEl = document.getElementById('reviews-list-' + itemId);
            if (!listEl) return;
            try {
                // Try the full indexed query first; fall back to client-side sort
                // while the composite index is still building
                let snap;
                try {
                    const q = query(
                        collection(db, REVIEWS_COLLECTION),
                        where('productId', '==', itemId),
                        where('approved',  '==', true),
                        orderBy('createdAt', 'desc')
                    );
                    snap = await getDocs(q);
                } catch (indexErr) {
                    // Index not ready yet — fetch without orderBy and sort client-side
                    const q2 = query(
                        collection(db, REVIEWS_COLLECTION),
                        where('productId', '==', itemId),
                        where('approved',  '==', true)
                    );
                    snap = await getDocs(q2);
                }
                if (snap.empty) {
                    listEl.innerHTML = '<p class="text-sm text-gray-400 italic">No reviews yet — be the first!</p>';
                    return;
                }

                // Sort client-side (no-op if index already ordered them)
                const reviews = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                const avg       = reviews.reduce((s, r) => s + (r.rating || 0), 0) / reviews.length;
                const fullStars = Math.round(avg);

                const summaryHtml = `
                <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                    <span class="text-3xl font-black text-gray-800">${avg.toFixed(1)}</span>
                    <div>
                        <div class="flex">${[1,2,3,4,5].map(n =>
                            `<span class="text-lg ${n <= fullStars ? 'text-yellow-400' : 'text-gray-200'}">★</span>`
                        ).join('')}</div>
                        <span class="text-xs text-gray-400">${reviews.length} review${reviews.length !== 1 ? 's' : ''}</span>
                    </div>
                </div>`;

                const cardsHtml = reviews.map(r => {
                    const stars  = [1,2,3,4,5].map(n =>
                        `<span class="${n <= r.rating ? 'text-yellow-400' : 'text-gray-200'}">★</span>`
                    ).join('');
                    const date   = r.createdAt?.toDate
                        ? r.createdAt.toDate().toLocaleDateString()
                        : '';
                    const name   = r.userName || r.userEmail?.split('@')[0] || 'Customer';
                    return `
                    <div class="bg-white rounded-lg border border-gray-100 p-4 shadow-sm">
                        <div class="flex items-start justify-between mb-1">
                            <div>
                                <span class="text-sm font-semibold text-gray-800">${escapeHtml(name)}</span>
                                <div class="flex text-sm mt-0.5">${stars}</div>
                            </div>
                            <span class="text-xs text-gray-400 whitespace-nowrap">${date}</span>
                        </div>
                        ${r.comment ? `<p class="text-sm text-gray-600 mt-2 leading-relaxed">${escapeHtml(r.comment)}</p>` : ''}
                    </div>`;
                }).join('');

                listEl.innerHTML = summaryHtml + cardsHtml;
            } catch (e) {
                console.error('loadReviews error:', e);
                listEl.innerHTML = '<p class="text-xs text-red-400">Could not load reviews.</p>';
            }
        }

        async function submitReview(itemId) {
            const rating  = _reviewRatings[itemId] || 0;
            const comment = document.getElementById('review-comment-' + itemId)?.value?.trim() || '';
            const msgEl   = document.getElementById('review-msg-' + itemId);
            const btn     = document.getElementById('review-submit-' + itemId);

            if (!state.userName) {
                showMessage('warning', 'Please sign in to leave a review.', 3000);
                return;
            }
            if (rating === 0) {
                if (msgEl) { msgEl.textContent = 'Please select a star rating.'; msgEl.className = 'text-xs mt-2 text-orange-600'; }
                return;
            }

            if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
            try {
                const user = auth.currentUser;
                await addDoc(collection(db, REVIEWS_COLLECTION), {
                    productId:  itemId,
                    userId:     user?.uid     || null,
                    userEmail:  user?.email   || state.userName,
                    userName:   user?.displayName || state.userName?.split('@')[0] || 'Customer',
                    rating,
                    comment,
                    approved:   false,      // requires admin approval before showing
                    createdAt:  serverTimestamp()
                });

                if (msgEl) {
                    msgEl.textContent = '✅ Thank you! Your review will appear after moderation.';
                    msgEl.className   = 'text-xs mt-2 text-green-600';
                    msgEl.classList.remove('hidden');
                }

                // Mark the most recent delivered order for this item as having a review
                if (userId && userId !== 'anonymous') {
                    try {
                        const ORDERS_COLL = 'artifacts/default-app-id/public/data/orders';
                        const ordSnap = await getDocs(query(
                            collection(db, ORDERS_COLL),
                            where('userId', '==', userId),
                            where('status', '==', 'Delivered')
                        ));
                        const match = ordSnap.docs
                            .map(d => ({ id: d.id, ...d.data() }))
                            .filter(o => (o.items || []).some(i => i.id === itemId))
                            .sort((a, b) => {
                                const da = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.timestamp || 0);
                                const db2 = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.timestamp || 0);
                                return db2 - da;
                            })[0];
                        if (match) {
                            await updateDoc(doc(db, ORDERS_COLL, match.id), {
                                reviewLeft: true,
                                reviewLeftAt: serverTimestamp(),
                                reviewedProductId: itemId,
                            });
                        }
                    } catch { /* non-critical */ }
                }

                // Reset form
                _reviewRatings[itemId] = 0;
                setReviewRating(itemId, 0);
                const commentEl = document.getElementById('review-comment-' + itemId);
                if (commentEl) commentEl.value = '';

            } catch (e) {
                console.error('submitReview error:', e);
                if (msgEl) {
                    msgEl.textContent = '❌ Could not submit review. Please try again.';
                    msgEl.className   = 'text-xs mt-2 text-red-600';
                    msgEl.classList.remove('hidden');
                }
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'Submit Review'; }
            }
        }

        function _slugify(str) {
            return (str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        function openItemDetailModal(item) {
            state.selectedItem = item;
            window._modalIdx = 0;

            // Update URL so the product page is linkable and crawlable
            const slug = _slugify(item.name);

        async function requestPasswordReset() {
            const email = prompt("Enter the email associated with your account to receive a password reset link:");

            if (!email) {
                return;
            }

            if (!email.includes('@') || email.length < 5) {
                showMessage('error', 'Please enter a valid email address.');
                return;
            }
            showMessage('info', 'Requesting password reset link...', 60000);

            const netlifyFunctionUrl = '/.netlify/functions/sendPasswordResetEmail';
            try {
                const MAX_RETRIES = 3;
                let response = null;
                for (let i = 0; i < MAX_RETRIES; i++) {
                    try {
                        response = await fetch(netlifyFunctionUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        if (response.ok) {
                            break;
                        } else if (i === MAX_RETRIES - 1) {
                            throw new Error(`Server returned status ${response.status}`);
                        }
                    } catch (fetchError) {
                        if (i === MAX_RETRIES - 1) {
                            throw fetchError;
                        }
                        const delay = Math.pow(2, i) * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        console.log(`Retrying password reset request... attempt ${i + 2}`);
                    }
                }
                const result = await response.json();
                if (response.ok) {
                    showMessage('success', `If an account exists for ${email}, a password reset link has been sent. Check your inbox!`, 8000);
                } else {
                    showMessage('error', result.error || 'Failed to request password reset. Please try again later.');
                }
            } catch (error) {
                console.error("Password reset request failed:", error);
                showMessage('error', 'Network error. Could not connect to the password reset service.');
            }
        }

        async function loadUserOrdersForReturn() {
            try {
                const user = auth.currentUser;
                if (!user) throw new Error('Not logged in');

                // Use the server-side function instead of querying Firestore directly —
                // client-side security rules block where() queries for regular users.
                const idToken = await user.getIdToken(false);
                const res     = await fetch('/.netlify/functions/getUserOrders', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${idToken}` },
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `Server error ${res.status}`);
                }

                const data = await res.json();
                const allOrders = data.orders || [];

                const ELIGIBLE_STATUSES  = new Set(['Delivered', 'Shipped', 'In Transit', 'Processing', 'Pending']);
                const CANCELLED_STATUSES = new Set(['Cancelled', 'Cancelled - Refunded', 'Refunded']);

                state.returnModal.orders = allOrders
                    .filter(o => {
                        const status = (o.status || '').trim();
                        if (CANCELLED_STATUSES.has(status)) return false;
                        const paid = o.isPaid === true
                            || (typeof o.paymentStatus === 'string' && o.paymentStatus.toLowerCase() === 'paid')
                            || ELIGIBLE_STATUSES.has(status)
                            || (o.totalCents > 0 && !CANCELLED_STATUSES.has(status));
                        return paid;
                    })
                    .sort((a, b) => {
                        const ta = new Date(a.createdAt || a.timestamp || 0).getTime();
                        const tb = new Date(b.createdAt || b.timestamp || 0).getTime();
                        return tb - ta;
                    });
        
                state.returnModal.loadingOrders = false;
                renderReturnModal();
            } catch (err) {
                state.returnModal.loadingOrders = false;
                state.returnModal.error = err.message;
                renderReturnModal();
            }
        }

                            <div class="flex items-center justify-between">
                                <div class="min-w-0">
                                    <p class="text-sm font-bold text-gray-800">#${o.orderNumber || o.id.slice(0,8)}</p>

            const step2 = () => {

                    <p class="font-bold text-indigo-800">#${o.orderNumber || o.id.slice(0,8)}</p>

                        </label>
                        <select id="returnReasonSelect"

                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">

                        </label>
                        <textarea id="returnNotesInput"
                                  oninput="window.module.setReturnNotes(this.value)"
                                  rows="3"
                                  placeholder="${isSp ? 'Describe el problema con más detalle…' : 'Describe the issue in more detail…'}"
                                  class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-400 resize-none">${rm.notes}</textarea>
                    </div>

                    <!-- Photo upload -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">
                            ${isSp ? 'Fotos del artículo' : 'Item photos'}
                            <span class="text-gray-400 font-normal">(${isSp ? `hasta ${MAX_IMAGES}` : `up to ${MAX_IMAGES}`})</span>

                        <div class="flex flex-wrap gap-2 mb-2">
                            ${imagePreviews}
                            ${canAddMore ? `
                            <label class="w-20 h-20 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition">
                                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                <span class="text-xs text-gray-400 mt-1">${isSp ? 'Agregar' : 'Add'}</span>
                                <input type="file" accept="image/*" multiple class="hidden"
                                       onchange="window.module.handleReturnImages(event)">
                            </label>` : ''}

                        <p class="text-xs text-gray-400">
                            ${isSp
                                ? `JPEG/PNG/WebP · máx ${MAX_IMAGE_MB}MB por foto`

                    </div>

                    ${rm.error ? `
                    <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700">

            };

            // ── Success screen ──────────────────────────────────────────────────────
            const success = () => `
                <div class="text-center py-8 space-y-3">
                    <div class="text-5xl">✅</div>
                    <h3 class="text-lg font-bold text-gray-800">
                        ${isSp ? '¡Solicitud enviada!' : 'Request submitted!'}
                    </h3>
                    <p class="text-sm text-gray-500 max-w-xs mx-auto">
                        ${isSp
                            ? 'Hemos recibido tu solicitud de devolución. Te contactaremos a la brevedad con los siguientes pasos.'
                            : 'We\'ve received your return request. We\'ll be in touch shortly with next steps.'}
                    </p>
                    <p class="text-xs text-gray-400">${isSp ? 'Revisa tu correo electrónico.' : 'Check your email for confirmation.'}</p>
                </div>`;

            // ── Modal chrome ────────────────────────────────────────────────────────
            const stepLabel  = isSp ? ['Seleccionar pedido', 'Detalles de devolución'] : ['Select order', 'Return details'];
            const isStep1    = rm.step === 1;
            const isSuccess  = rm.submitted;

            const footer = isSuccess ? `
                <button onclick="window.module.closeReturnModal()"
                        class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition text-sm">
                    ${isSp ? 'Cerrar' : 'Close'}
                </button>` : isStep1 ? `
                <button onclick="window.module.closeReturnModal()"
                        class="flex-1 py-2.5 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded-xl transition">
                    ${isSp ? 'Cancelar' : 'Cancel'}
                </button>
                ${rm.guestMode ? `
                <button onclick="window.module.guestReturnLookup()"
                        ${rm.guestLookingUp ? 'disabled' : ''}
                        class="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 disabled:bg-gray-200 disabled:text-gray-400 transition text-sm">
                    ${isSp ? 'Buscar pedido →' : 'Find Order →'}
                </button>` : `
                <button onclick="window.module.returnGoToStep2()"
                        ${!rm.selectedOrder ? 'disabled' : ''}
                        class="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 disabled:bg-gray-200 disabled:text-gray-400 transition text-sm">
                    ${isSp ? 'Continuar →' : 'Continue →'}
                </button>`}` : `
                <button onclick="window.module.returnGoToStep1()"
                        ${rm.uploading ? 'disabled' : ''}
                        class="flex-1 py-2.5 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded-xl transition">
                    ← ${isSp ? 'Atrás' : 'Back'}
                </button>
                <button onclick="window.module.submitReturnRequest()"
                        ${rm.uploading ? 'disabled' : ''}
                        class="flex-1 py-2.5 bg-orange-500 text-white font-bold rounded-xl hover:bg-orange-600 disabled:bg-gray-200 disabled:text-gray-400 transition text-sm">
                    ${rm.uploading
                        ? `<span class="flex items-center justify-center gap-2">
                               <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                                   <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                                   <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                               </svg>
                               ${isSp ? 'Enviando…' : 'Submitting…'}
                           </span>`
                        : (isSp ? 'Enviar solicitud' : 'Submit request')}
                </button>`;

            const modal = document.createElement('div');
            modal.id = 'returnRequestModal';
            modal.innerHTML = `
            <div class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
                 onclick="if(event.target===this)window.module.closeReturnModal()">
                <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-md max-h-[92vh] flex flex-col">

                    <!-- Header -->
                    <div class="flex items-center justify-between px-5 py-4 border-b flex-shrink-0">
                        <div>
                            <h3 class="text-base font-bold text-gray-800">
                                ↩️ ${isSp ? 'Solicitud de devolución' : 'Return Request'}
                            </h3>
                            ${!isSuccess ? `
                            <div class="flex items-center gap-2 mt-1">
                                ${[1,2].map(s => `
                                <div class="flex items-center gap-1">
                                    <div class="w-4 h-4 rounded-full text-[10px] flex items-center justify-center font-bold
                                                ${rm.step >= s ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-400'}">${s}</div>
                                    <span class="text-xs ${rm.step === s ? 'text-indigo-600 font-semibold' : 'text-gray-400'}">${stepLabel[s-1]}</span>
                                    ${s < 2 ? '<span class="text-gray-300 text-xs">›</span>' : ''}
                                </div>`).join('')}
                            </div>` : ''}
                        </div>
                        <button onclick="window.module.closeReturnModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
                    </div>

                    <!-- Body -->
                    <div class="overflow-y-auto flex-1 px-5 py-4">
                        ${isSuccess ? success() : isStep1 ? step1() : step2()}
                    </div>

                    <!-- Footer -->
                    ${!isSuccess ? `
                    <div class="flex gap-3 px-5 pb-5 pt-3 border-t flex-shrink-0">
                        ${footer}
                    </div>` : `
                    <div class="px-5 pb-5">
                        ${footer}
                    </div>`}
                </div>
            </div>`;
            document.body.appendChild(modal);
        }

        function selectReturnOrder(orderId) {
            const order = state.returnModal.orders.find(o => o.id === orderId);
            state.returnModal.selectedOrder = order || null;
            renderReturnModal();
        }

        function returnGoToStep2() {
            if (!state.returnModal.selectedOrder) return;
            state.returnModal.step = 2;
            state.returnModal.error = null;
            renderReturnModal();
        }

        function returnGoToStep1() {
            state.returnModal.step = 1;
            state.returnModal.error = null;
            renderReturnModal();
        }

        // ── Guest return helpers ──────────────────────────────────────────────────
        // Switches a logged-in user who got zero results to the manual lookup form
        function switchReturnToManual() {
            state.returnModal.guestMode = true;
            // Pre-fill their email so they just need the order number
            state.returnModal.guestEmail = auth.currentUser?.email || '';
            state.returnModal.error = null;
            renderReturnModal();
        }

        function setGuestReturnField(field, val) {
            state.returnModal[field] = val;
            // No re-render — let the user type freely
        }

        async function guestReturnLookup() {
            const rm   = state.returnModal;
            const isSp = currentLang === 'es';
            rm.error   = null;

            const orderId = (rm.guestOrderInput || '').trim();
            const email   = (rm.guestEmail      || '').trim().toLowerCase();

            if (!orderId || !email) {
                rm.error = isSp
                    ? 'Por favor ingresa el número de pedido y tu correo.'
                    : 'Please enter your order number and email.';
                renderReturnModal(); return;
            }

            rm.guestLookingUp = true;
            renderReturnModal();

            try {
                const res  = await fetch('/.netlify/functions/getOrderStatus', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, email }),
                });
                const data = await res.json();

                if (!res.ok) {
                    rm.error          = data.error || (isSp ? 'Pedido no encontrado.' : 'Order not found.');
                    rm.guestLookingUp = false;
                    renderReturnModal(); return;
                }

                const order = data.order;
                const isPaid = order.isPaid || order.paymentStatus === 'Paid';
                if (!isPaid || order.status === 'Cancelled') {
                    rm.error = isSp
                        ? 'Este pedido no es elegible para devolución (debe estar pagado y no cancelado).'
                        : 'This order is not eligible for a return (must be paid and not cancelled).';
                    rm.guestLookingUp = false;
                    renderReturnModal(); return;
                }

                rm.guestOrderData = order;
                rm.selectedOrder  = order;
                rm.guestLookingUp = false;
                rm.step           = 2;
                rm.error          = null;
                renderReturnModal();

            } catch (err) {
                rm.error          = isSp ? 'Error al verificar el pedido. Intenta de nuevo.' : 'Could not verify order. Please try again.';
                rm.guestLookingUp = false;
                renderReturnModal();
            }
        }

        function setReturnReason(val)  { state.returnModal.reason = val; }
        function setReturnNotes(val)   { state.returnModal.notes  = val; }

        function handleReturnImages(event) {
            const files = Array.from(event.target.files || []);
            const rm    = state.returnModal;
            const remaining = MAX_IMAGES - rm.images.length;

            for (const file of files.slice(0, remaining)) {
                if (!file.type.startsWith('image/')) {
                    showMessage('error', `${file.name} is not an image.`, 3000); continue;
                }
                if (file.size > MAX_IMAGE_MB * 1024 * 1024) {
                    showMessage('error', `${file.name} exceeds ${MAX_IMAGE_MB}MB.`, 3000); continue;
                }
                rm.images.push({ file, previewUrl: URL.createObjectURL(file) });
            }
            renderReturnModal();
        }

        function removeReturnImage(index) {
            const rm = state.returnModal;
            URL.revokeObjectURL(rm.images[index]?.previewUrl);
            rm.images.splice(index, 1);
            renderReturnModal();
        }

        async function submitReturnRequest() {
            const rm    = state.returnModal;
            const isSp  = currentLang === 'es';

            // Sync latest input values from DOM before submitting
            rm.reason = document.getElementById('returnReasonSelect')?.value || rm.reason;
            rm.notes  = document.getElementById('returnNotesInput')?.value   || rm.notes;

            if (!rm.selectedOrder) { rm.error = isSp ? 'Selecciona un pedido.' : 'Please select an order.'; renderReturnModal(); return; }
            if (!rm.reason)        { rm.error = isSp ? 'Selecciona un motivo.' : 'Please select a reason.';  renderReturnModal(); return; }

            rm.uploading = true;
            rm.error     = null;
            renderReturnModal();

            try {
                const order   = rm.selectedOrder;
                const user    = auth.currentUser;  // null for guests

                // Upload images to Firebase Storage
                const imageUrls = [];
                const storage   = window._storage;

                if (storage && rm.images.length > 0) {
                    // Guests upload to a guest path; authenticated users use their uid
                    const uploadPath = user
                        ? `return_images/${user.uid}`
                        : `return_images/guest_${Date.now()}`;
                    for (const img of rm.images) {
                        const path    = `${uploadPath}/${Date.now()}_${img.file.name}`;
                        const fileRef = storageRef(storage, path);
                        await uploadBytes(fileRef, img.file);
                        const url = await getDownloadURL(fileRef);
                        imageUrls.push(url);
                    }
                }

                // Resolve customer identity — authenticated user wins, fall back to guest fields
                const customerEmail = order.buyerEmail || user?.email || rm.guestEmail || null;
                const customerName  = order.buyerName  || user?.displayName || user?.email?.split('@')[0]
                                   || rm.guestEmail?.split('@')[0] || 'Guest';
                const customerId    = user?.uid || null;

                // Write return request to Firestore
                await addDoc(collection(db, RETURNS_COLLECTION), {
                    orderId:       order.id,
                    orderNumber:   order.orderNumber || order.id.slice(0,8),
                    customerName,
                    customerEmail,
                    customerId,
                    isGuestReturn: !user,
                    stripePaymentIntentId: order.stripePaymentIntentId || null,
                    stripeChargeId:        order.stripeChargeId        || null,
                    reason:        rm.reason,
                    notes:         rm.notes || '',
                    internalNotes: '',
                    imageUrls,
                    refundAmountCents: order.totalCents || 0,
                    status:        'Requested',
                    source:        'customer',
                    statusHistory: [{
                        status:     'Requested',
                        adminEmail: customerEmail || 'guest',
                        note:       user
                            ? 'Submitted by authenticated customer via storefront'
                            : 'Submitted by guest via storefront',
                        timestamp: new Date().toISOString()
                    }],
                    stripeRefundId: null,
                    createdAt:  serverTimestamp(),
                    updatedAt:  serverTimestamp()
                });

                rm.uploading  = false;
                rm.submitted  = true;
                renderReturnModal();

            } catch (err) {
                rm.uploading = false;
                rm.error     = err.message;
                renderReturnModal();
            }
        }

        // ── Search Demo Banner Animation ──────────────────────────────────────────
        let _demoTimer = null;
        let _demoDemoIdx = 0;

        function _startSearchDemo() {
            const banner = document.getElementById('search-demo-banner');
            if (!banner) return;
            clearTimeout(_demoTimer);
            _runDemoScenario();
        }

        function _runDemoScenario() {
            const isSp = currentLang === 'es';
            const demos = isSp ? [
                { query: 'filtro aceite Toyota Corolla 2018',     note: 'Busca por marca, modelo y año',       results: [] },
                { query: 'escobillas limpiaparabrisas Honda Civic', note: 'Encuentra piezas por vehículo',     results: [] },
                { query: 'cámara frontal para el auto',           note: 'O busca por tipo de accesorio',      results: [] },
            ] : [
                { query: 'oil filter 2018 Toyota Corolla',        note: 'Search by make, model and year',     results: [] },
                { query: 'wiper blades Honda Civic 2020',         note: 'Find parts by your vehicle',         results: [] },
                { query: 'dashcam wide angle',                    note: 'Or search by accessory type',        results: [] },
            ];

            const scenario = demos[_demoDemoIdx % demos.length];

            // Populate results from actual catalog (first 2 items that loosely match or first 2 available)
            const available = state.items.filter(i => !i.temporarilyUnavailable && (i.stock || 0) > 0);
            // Try fuzzy keyword match first, fall back to first 2
            const words = scenario.query.toLowerCase().split(' ').filter(w => w.length > 3);
            let matched = available.filter(i =>
                words.some(w => (i.name || '').toLowerCase().includes(w) || (i.description || '').toLowerCase().includes(w))
            ).slice(0, 2);
            if (matched.length === 0) matched = available.slice(0, 2);
            scenario.results = matched;

            const typedEl   = document.getElementById('demo-typed-text');
            const hintEl    = document.getElementById('demo-hint');
            const responseEl = document.getElementById('demo-response');
            const cardsEl   = document.getElementById('demo-cards');
            const ctaEl     = document.getElementById('demo-cta');

            if (!typedEl) return;

            // Reset
            typedEl.textContent = '';
            if (hintEl)     hintEl.textContent  = '';
            if (responseEl) responseEl.classList.add('hidden');
            if (cardsEl)    cardsEl.innerHTML   = '';
            if (ctaEl)      ctaEl.classList.add('hidden');

            // Phase 1: type the query
            let i = 0;
            const typeInterval = setInterval(() => {
                if (!document.getElementById('demo-typed-text')) { clearInterval(typeInterval); return; }
                typedEl.textContent = scenario.query.slice(0, ++i);
                if (hintEl) hintEl.textContent = i > 3 ? scenario.note : '';
                if (i >= scenario.query.length) {
                    clearInterval(typeInterval);
                    // Phase 2: show spinner briefly then results
                    _demoTimer = setTimeout(() => {
                        if (!document.getElementById('demo-response')) return;
                        if (responseEl) responseEl.classList.remove('hidden');

                        // Build result cards
                        const fmt = cents => '$' + ((cents || 0) / 100).toFixed(2);
                        if (cardsEl) {
                            cardsEl.innerHTML = scenario.results.map(item => {
                                const img = item.imageUrls?.[0] || item.imageUrl || '';
                                return '<div class="flex items-center gap-3 bg-white border border-gray-100 rounded-xl p-2.5 shadow-sm animate-fade-in">'
                                    + (img ? '<img src="' + img + '" class="w-11 h-11 object-contain rounded-lg bg-gray-50 border border-gray-100 flex-shrink-0">'
                                           : '<div class="w-11 h-11 bg-gray-100 rounded-lg flex-shrink-0 flex items-center justify-center">📦</div>')
                                    + '<div class="flex-1 min-w-0">'
                                    +   '<p class="text-sm font-semibold text-gray-800 truncate">' + item.name + '</p>'
                                    +   '<p class="text-xs font-bold text-indigo-600">' + fmt(item.price) + '</p>'
                                    + '</div>'
                                    + '<span class="text-xs bg-green-100 text-green-700 font-bold px-2 py-1 rounded-lg flex-shrink-0">'
                                    + (isSp ? 'Ver pieza' : 'View part') + '</span>'
                                    + '</div>';
                            }).join('');
                        }

                        // Phase 3: show CTA after cards appear
                        _demoTimer = setTimeout(() => {
                            if (ctaEl) ctaEl.classList.remove('hidden');
                            // Phase 4: pause then run next scenario
                            _demoTimer = setTimeout(() => {
                                _demoDemoIdx++;
                                _runDemoScenario();
                            }, 4500);
                        }, 900);
                    }, 700);
                }
            }, 55);   // typing speed: ~55ms per character
        }


        // ── Cookie Consent ──────────────────────────────────────────────────────
        function renderCookieConsent() {
            const existing = localStorage.getItem('autoinx_cookie_consent');
            if (existing) return ''; // Already decided
            const isSp = currentLang === 'es';
            return \`
            <div id="cookie-banner" class="fixed bottom-0 left-0 right-0 z-[70] bg-gray-900 text-white px-4 py-4 shadow-2xl border-t-2 border-indigo-500"
                 style="animation:slideUp .3s ease-out;">
                <style>@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}</style>
                <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-start sm:items-center gap-3 justify-between">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-white mb-0.5">
                            🍪 \${isSp ? 'Usamos cookies' : 'We use cookies'}
                        </p>
                        <p class="text-xs text-gray-400 leading-relaxed">
                            \${isSp
                                ? 'Usamos cookies esenciales para el funcionamiento del sitio, y cookies analíticas (Google Analytics, Google Ads) para mejorar tu experiencia. Puedes elegir solo las esenciales.'
                                : 'We use essential cookies to run the site, and analytics cookies (Google Analytics, Google Ads) to improve your experience. You can choose essential only.'}
                            <a href="/privacy.html" class="text-indigo-400 hover:text-indigo-300 underline ml-1">
                                \${isSp ? 'Política de privacidad' : 'Privacy policy'}
                            </a>
                        </p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="window.module.declineCookies()"
                                class="px-4 py-2 text-xs font-semibold text-gray-300 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                            \${isSp ? 'Solo esenciales' : 'Essential only'}
                        </button>
                        <button onclick="window.module.acceptCookies()"
                                class="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow-md">
                            \${isSp ? 'Aceptar todo ✓' : 'Accept all ✓'}
                        </button>
                    </div>
                </div>
            </div>\`;
        }

        function acceptCookies() {
            localStorage.setItem('autoinx_cookie_consent', 'accepted');
            document.getElementById('cookie-banner')?.remove();
            window._loadAnalytics?.();
        }

        function declineCookies() {
            localStorage.setItem('autoinx_cookie_consent', 'declined');
            document.getElementById('cookie-banner')?.remove();
            // reCAPTCHA still loads on-demand for registration — essential only
        }

        window.module = {
            setupFirebase,
            render,
            toggleView,
            addToCart,
            updateCartQuantity,
            continueToCheckout,
            handleZipInput,
            selectDeliveryMethod,
            toggleAiChat,
            sendAiChatMessage,
            addToCartFromChat,
            handleProductSearchInput,
            triggerAiSearch,
            clearAiSearch,
            dismissSearchDemoBanner,
            openItemDetailModal_byId,
            addToCartById,
            selectCategory,
            clearAllFilters,
            handleSortChange,

            submitChatEscalation,
            requestPasswordReset,
            registerUser,
            showLoginModal,
            handleStandardAuth,
            handleCaptchaSuccess,
            handleGoogleSignIn,
            closeModal,
            handleSignOut,
            setLanguage,
            openItemDetailModal,
            loadReviews,
            setReviewRating,
            submitReview,

            openChatWidget,
            // Added T&C Modal controls here
            openTosModal: () => { state.isTosModalOpen = true; render(); },
            closeTosModal: () => { state.isTosModalOpen = false; render(); },
            switchTosTab,

        };
        document.addEventListener('DOMContentLoaded', () => {
            setupFirebase();

            // ── Register PWA Service Worker ────────────────────────────────
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            }
        });
    </script>
