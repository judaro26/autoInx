# netlify.toml

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- 1. Order Confirmation (The code you shared) ---
[functions.sendOrderConfirmation]
  included_files = ["netlify/functions/sendOrderConfirmation/emailTemplates/*.html"]
  timeout = 25

# --- 2. Receipt Confirmation (Your other function) ---
[functions.sendReceiptConfirmation]
  included_files = ["netlify/functions/sendReceiptConfirmation/emailTemplates/*.html"]
  timeout = 25

# --- Existing Configurations ---
[functions.anonymousUserCron]
  schedule = "0 3 * * *"

[functions.deleteOrder]
  included_files = ["./netlify/functions/ip-data.json"]

[functions.toggleChatWidget]
  function = "toggleChatWidget"
  schedule = "0 * * * *" 

[functions.getGoogleMapsKey]
  access = "public"
