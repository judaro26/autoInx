# netlify.toml
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─── Email Functions ──────────────────────────────────────────────────────────
[functions.sendOrderConfirmation]
  included_files = ["netlify/functions/sendOrderConfirmation/emailTemplates/*.html"]
  timeout = 25

[functions.sendReceiptConfirmation]
  included_files = ["netlify/functions/sendReceiptConfirmation/emailTemplates/*.html"]
  timeout = 25

[functions.sendContactEmail]
  included_files = ["netlify/functions/sendContactEmail/emailTemplates/*.html"]
  timeout = 10

[functions.sendCustomOrderEmail]
  timeout = 15

[functions.sendCatalogEmail]
  timeout = 30

# ─── Scheduled / Cron Functions ───────────────────────────────────────────────
[functions.anonymousUserCron]
  schedule = "0 3 * * *"

[functions.toggleChatWidget]
  function = "toggleChatWidget"
  schedule = "0 * * * *"

[functions.abandonedCartReminder]
  schedule = "0 10 * * *"

[functions.autoSeasonalBanner]
  schedule = "0 6 * * *"

# Post-purchase follow-up: 7-day review request + 30-day discount code
[functions.postPurchaseFollowUp]
  schedule = "0 9 * * *"
  timeout = 60

# Low-stock alert: daily digest of items at or below 10 units
[functions.lowStockAlert]
  schedule = "0 8 * * *"
  timeout = 30

# ebayFetchFunction is intentionally NOT listed here — adding a schedule entry
# breaks it due to esbuild/scheduled-function conflict. It runs via HTTP trigger
# from the admin panel, and is polled every 30 min by ebayCronTrigger below.
[functions.ebayCronTrigger]
  schedule = "*/30 * * * *"

# ─── Shipping ─────────────────────────────────────────────────────────────────
[functions.getShippingRates]
  timeout = 30

[functions.generateShippingLabel]
  timeout = 30

[functions.packItems]
  timeout = 20

# ─── Order Status & Tracking ──────────────────────────────────────────────────
[functions.getOrderStatus]
  timeout = 10

[functions.getUserOrders]
  timeout = 15

[functions.linkUserOrders]
  timeout = 15

[functions.getExternalOrders]
  timeout = 15

# ─── Payment Confirmations ────────────────────────────────────────────────────
# Server-side approval — requires admin token, never trusts client writes
[functions.approvePaymentConfirmation]
  timeout = 10

# Guest payment confirmation submission — email-verified, no Firebase account needed
[functions.submitPaymentConfirmation]
  timeout = 10

# Guest payment proof file upload — saves to Firebase Storage, returns signed URL
# Requires: npm install busboy (in netlify/functions/package.json)
[functions.uploadPaymentProof]
  timeout = 20

[functions.deductInventory]
  timeout = 15

[functions.sendSupportEmail]
  timeout = 10

# ─── Other Functions ──────────────────────────────────────────────────────────
[functions.deleteOrder]
  included_files = ["./netlify/functions/ip-data.json"]

[functions.getGoogleMapsKey]
  access = "public"

[functions.getClientFirebaseConfig]
  access = "public"

[functions.updateAdminConfig]
  timeout = 10

[functions.getPublicConfig]
  access = "public"
  timeout = 5

[functions.validateDiscount]
  access = "public"
  timeout = 5

[functions.verifyOrderToken]
  timeout = 10

# ─── SEO ──────────────────────────────────────────────────────────────────────
[functions.sitemap]
  timeout = 10

# ─── Admin protection ─────────────────────────────────────────────────────────
# Returns 404 for /admin.html so it doesn't appear in search results or be easily
# discovered. Legitimate admins access it directly — the 404 is a deterrent,
# not a hard block (true IP whitelisting requires Netlify Enterprise or a Function).
# For stronger protection, use the adminGuard Netlify function (see below).
[[redirects]]
  from   = "/admin.html"
  to     = "/404.html"
  status = 404
  force  = false  # set to true to block ALL access; false lets direct URL still work

# ─── Redirects ────────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200
  force  = true

[[redirects]]
  from   = "/track"
  to     = "/track-order.html"
  status = 301

[[redirects]]
  from   = "/myOrders.html"
  to     = "/track-order.html"
  status = 301

[[redirects]]
  from   = "/payment-success"
  to     = "/track-order.html"
  status = 301

# ─── Headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"
