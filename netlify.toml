# netlify.toml
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─── Email Functions ──────────────────────────────────────────────────────────
[functions.sendOrderConfirmation]
  included_files = ["netlify/functions/sendOrderConfirmation/emailTemplates/*.html"]
  timeout = 25

[functions.sendReceiptConfirmation]
  included_files = ["netlify/functions/sendReceiptConfirmation/emailTemplates/*.html"]
  timeout = 25

[functions.sendContactEmail]
  included_files = ["netlify/functions/sendContactEmail/emailTemplates/*.html"]
  timeout = 10

# ─── Scheduled / Cron Functions ───────────────────────────────────────────────
[functions.anonymousUserCron]
  schedule = "0 3 * * *"

[functions.toggleChatWidget]
  function = "toggleChatWidget"
  schedule = "0 * * * *"

[functions.abandonedCartReminder]
  schedule = "0 10 * * *"

# Seasonal banner — auto-enables 2 weeks before events, disables 3 days after
[functions.autoSeasonalBanner]
  schedule = "0 6 * * *"
  node_bundler = "nft"

[functions.ebayFetchFunctions]
  schedule = "*/15 * * * *"
  timeout = 30

# ─── Shipping ─────────────────────────────────────────────────────────────────
[functions.getShippingRates]
  timeout = 30

[functions.generateShippingLabel]
  timeout = 30

# ─── Other Functions ──────────────────────────────────────────────────────────
[functions.deleteOrder]
  included_files = ["./netlify/functions/ip-data.json"]

[functions.getGoogleMapsKey]
  access = "public"
