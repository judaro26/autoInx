        // NEW FUNCTION: Exports individual order item details, which contain date/status/payment.
        function downloadIndividualItemSalesCsv() {
            resetTimer();
            const data = lastCategorySalesData.tableData;

            if (data.length === 0) {
                showMessage('error', 'No data available to download.', 5000, 'orders');
                return;
            }

            // Define CSV headers for individual items
            const headers = [
                "Category", "Order ID (Short)", "Full Order ID", "Date", "Status",
                "Payment Status", "Item Name", "Quantity", "Total Item Revenue (USD)"
            ];

            // Collect ALL individual sales records from all categories
            const csvRows = [];
            data.forEach(categoryRow => {
                categoryRow.rawOrders.forEach(orderItem => {
                    // Convert Cents back to Dollars for CSV display and use .toFixed(2)
                    const totalRevenueUSD = (orderItem.totalItemCents / 100).toFixed(2);
                    const category = `"${categoryRow.category.replace(/"/g, '""')}"`;
                    const itemName = `"${orderItem.itemName.replace(/"/g, '""')}"`;

                    // CRITICAL FIX: Use the robust helper function
                    const dateStr = toISODateString(orderItem.date);
                    // ---------------------------------------------

                    csvRows.push([
                        category,
                        orderItem.id, // Short ID
                        orderItem.fullId, // Full ID
                        dateStr,
                        orderItem.status,
                        orderItem.paymentStatus,
                        itemName,
                        orderItem.quantity,
                        totalRevenueUSD
                    ].join(','));
                });
            });

            // Combine headers and rows
            const csvString = [
                headers.join(','),
                ...csvRows
            ].join('\n');

            // Create a Blob and trigger download
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");

            const filename = `Sales_Detail_Items_${state.salesTimeFilter}_${new Date().toISOString().slice(0, 10)}.csv`;

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showMessage('success', `Exported ${csvRows.length} item records to ${filename}.`, 5000, 'orders');
            } else {
                showMessage('error', 'Browser does not support automatic CSV download.', 5000, 'orders');
            }
        }

        function getJsDate(ts) {
            if (!ts) return null;

            // Handle Firebase Timestamp object (has toDate method)
            if (ts.toDate && typeof ts.toDate === 'function') {
                try {
                    return ts.toDate();
                } catch (e) {
                    console.warn("Failed to convert Firebase Timestamp:", e);
                    return null;
                }
            }

            // Handle JavaScript Date object
            if (ts instanceof Date) {
                return isNaN(ts.getTime()) ? null : ts;
            }

            // Handle ISO string or timestamp number
            try {
                const date = new Date(ts);
                return isNaN(date.getTime()) ? null : date;
            } catch (e) {
                console.warn("Failed to parse date:", ts, e);
                return null;
            }
        }

        function toISODateString(ts) {
            const date = getJsDate(ts);

            // CRITICAL: Validate date is valid before calling toISOString()
            if (!date || isNaN(date.getTime())) {
                return 'N/A';
            }

            try {
                return date.toISOString();
            } catch (e) {
                console.warn("Failed to convert to ISO string:", date, e);
                return 'N/A';
            }
        }

        // Add a helper for consistent order date retrieval
        function getOrderDate(order) {
            // Priority order: createdAt (Firebase Timestamp) > timestamp (ISO string)
            if (order.createdAt?.toDate) {
                try {
                    return order.createdAt.toDate();
                } catch (e) {
                    console.warn("Failed to convert order.createdAt:", e);
                }
            }

            if (order.createdAt instanceof Date) {
                return isNaN(order.createdAt.getTime()) ? null : order.createdAt;
            }

            if (order.timestamp) {
                const date = new Date(order.timestamp);
                return isNaN(date.getTime()) ? null : date;
            }

            return null;
        }

        // --- GOOGLE MAPS AUTOCPMLETE LOGIC ---

        // Function to update the Order Submit button state
        function updateSubmitButtonState() {
            const submitButton = document.getElementById('submitOrderButton');
            const addressInput = document.getElementById('deliveryAddress');

            // Check if address is validated (data-validated="true") 
            const isAddressValid = addressInput?.dataset.validated === 'true';

            // Check if cart has items
            const isCartNotEmpty = Object.keys(state.adminCart).length > 0;

            if (submitButton) {
                // Button is enabled only if address is valid AND the cart is not empty
                submitButton.disabled = !(isAddressValid && isCartNotEmpty);
            }
        }


        // Function called by the dynamically loaded Google Maps script
        window.initGooglePlaces = function () {
            const input = document.getElementById('deliveryAddress');
            if (!input) return;

            // Initialize Autocomplete, restricting to addresses and selected countries
            autocomplete = new google.maps.places.Autocomplete(input, {
                types: ['address'],
                componentRestrictions: { country: ['co', 'us'] },
                fields: ['formatted_address', 'geometry']
            });

            // Set initial state
            input.dataset.validated = 'false';
            input.classList.remove('address-valid');
            input.classList.add('address-invalid'); // Start as invalid
            document.getElementById('addressErrorAdmin')?.classList.remove('hidden');

            updateSubmitButtonState(); // Initialize button state

            // Listener: When the user selects an address from the dropdown
            autocomplete.addListener('place_changed', async () => {
                const place = autocomplete.getPlace();
                if (place.geometry) {
                    input.classList.remove('address-invalid', 'border-gray-300');
                    input.classList.add('address-valid');
                    document.getElementById('addressErrorAdmin')?.classList.add('hidden');
                    input.dataset.validated = 'true';

                    // ✅ NEW: Calculate shipping and tax when address is selected
                    await window.module.calculateAdminOrderShippingTax();
                }
                updateSubmitButtonState();
            });

            // Listener: Mark as invalid if user manually types after initialization/selection
            input.addEventListener('input', () => {
                input.classList.remove('address-valid');
                input.classList.add('address-invalid');
                document.getElementById('addressErrorAdmin')?.classList.remove('hidden'); // Show error on manual input
                input.dataset.validated = 'false';
                updateSubmitButtonState(); // Update button state on manual input
            });
        };

        async function loadGoogleMapsScript() {
            // Check if the script is ALREADY loaded or is being loaded
            if (document.querySelector('script[data-maps-loaded]')) {
                if (typeof window.initGooglePlaces === 'function') {
                    window.initGooglePlaces();
                }
                return;
            }

            try {
                const response = await fetch(MAPS_KEY_FUNCTION_URL);
                if (!response.ok) throw new Error('Failed to fetch Maps API key.');

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            if (typeof text !== 'string') return String(text);

            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttribute(text) {
            if (text === null || text === undefined) return '';
            if (typeof text !== 'string') text = String(text);

            return text
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

        // Located around line 316
        function downloadCategorySalesCsv() {
            resetTimer();
            const data = lastCategorySalesData.tableData;

            if (data.length === 0) {
                showMessage('error', 'No data available to download.', 5000, 'orders');
                return;
            }

            // Define CSV headers
            const headers = ["Category", "Units Sold", "Total Revenue (USD)", "Avg. Item Price (USD)"];

            // Format the data rows
            const csvRows = data.map(row => {
                // --- FIX: Use the new 'Cents' properties and convert to Dollars for the CSV output ---
                const category = `"${row.category.replace(/"/g, '""')}"`; // Double quotes and escape internal quotes
                const unitsSold = row.unitsSold;

                // Convert Cents back to Dollars for CSV display and use .toFixed(2)
                const totalRevenueUSD = (row.totalRevenueCents / 100).toFixed(2);
                const averagePriceUSD = (row.averagePriceCents / 100).toFixed(2);
                // ------------------------------------------------------------------------------------

                return [category, unitsSold, totalRevenueUSD, averagePriceUSD].join(',');
            });

            // Combine headers and rows
            const csvString = [
                headers.join(','),
                ...csvRows
            ].join('\n');

            // Create a Blob and trigger download
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");

            const filename = `Sales_Breakdown_${state.salesTimeFilter}_${new Date().toISOString().slice(0, 10)}.csv`;

            if (link.download !== undefined) {
                // HTML5 download attribute is supported
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showMessage('success', `Exported ${data.length} categories to ${filename}.`, 5000, 'orders');
            } else {
                showMessage('error', 'Browser does not support automatic CSV download.', 5000, 'orders');
            }
        }

        function processSalesDataByCategory() {
            const categorySales = {};
            const itemMap = state.items.reduce((map, item) => {
                map[item.id] = item;
                return map;
            }, {});

            // Initialize category tracking - ADDED orders array
            const categoryMetrics = state.catalogs.reduce((metrics, cat) => {
                metrics[cat.name] = { totalRevenue: 0, unitsSold: 0, averagePrice: 0, orders: [] };
                return metrics;
            }, {});
            categoryMetrics['Uncategorized'] = { totalRevenue: 0, unitsSold: 0, averagePrice: 0, orders: [] }; // Handle uncategorized items

            getFilteredSalesOrders().forEach(order => {
                order.items.forEach(orderItem => {
                    // FIX: Get correct ID for both customer and admin orders
                    const isCustomerFormat = orderItem.item && typeof orderItem.item === 'object';
                    const itemId = isCustomerFormat ? orderItem.item.id : orderItem.id;
                    const item = itemMap[itemId];

                    if (item) {
                        const catalogId = item.catalogId || 'no_category';
                        const categoryName = state.catalogs.find(c => c.id === catalogId)?.name || 'Uncategorized';

                        // FIX: Use getSafeItemData to handle both formats
                        const itemData = getSafeItemData(orderItem);
                        const salesAmount = itemData.price * itemData.quantity;

                        categoryMetrics[categoryName].totalRevenue += salesAmount;
                        categoryMetrics[categoryName].unitsSold += itemData.quantity;

                        categoryMetrics[categoryName].orders.push({
                            id: order.id.substring(0, 5),
                            fullId: order.id,
                            date: order.createdAt,
                            status: order.status,
                            paymentStatus: order.isPaid ? 'Paid' : 'Unpaid',
                            itemName: itemData.name,
                            quantity: itemData.quantity,
                            totalItemCents: salesAmount,
                        });
                    }
                });
            });

            // Finalize data structure for charts and the new table
            const chartData = { labels: [], data: [] };
            const tableData = [];

            Object.keys(categoryMetrics).forEach(categoryName => {
                const metrics = categoryMetrics[categoryName];
                if (metrics.totalRevenue > 0) {

                    // For the CHART: Must use dollar value (cents / 100)
                    const revenueDollars = metrics.totalRevenue / 100;
                    chartData.labels.push(categoryName);
                    chartData.data.push(revenueDollars);

                    // For the TABLE: Store values as CENTS (integer) for consistency with formatPriceDisplay
                    const totalRevenueCents = metrics.totalRevenue; // <<< FIX 1: Store CENTS
                    const averagePriceCents = totalRevenueCents / metrics.unitsSold; // Avg price in CENTS per unit

                    tableData.push({
                        category: categoryName,
                        totalRevenueCents: totalRevenueCents, // <<< NEW PROPERTY NAME (CENTS)
                        unitsSold: metrics.unitsSold,
                        averagePriceCents: averagePriceCents, // <<< NEW PROPERTY NAME (CENTS)
                        // CRITICAL ADDITION: Pass the filtered orders for this category
                        rawOrders: metrics.orders.sort((a, b) => new Date(b.date) - new Date(a.date))
                    });
                }
            });

            return {
                chartData: chartData,
                tableData: tableData.sort((a, b) => b.totalRevenueCents - a.totalRevenueCents), // Sort by cents descending
            };
        }

        function processSalesDataByMonth() {
            const filteredOrders = getFilteredSalesOrders();
            const monthlySales = {};

            filteredOrders.forEach(order => {
                const dateObj = (order.createdAt instanceof Date) ? order.createdAt : new Date(order.timestamp);
                // Creates a key like "2025-11" for grouping
                const yearMonth = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;

                if (!monthlySales[yearMonth]) {
                    monthlySales[yearMonth] = 0;
                }
                monthlySales[yearMonth] += order.totalCents;
            });

            const sortedKeys = Object.keys(monthlySales).sort();
            const monthNames = sortedKeys.map(key => {
                const [year, month] = key.split('-');
                const date = new Date(year, parseInt(month) - 1);
                return date.toLocaleString('default', { month: 'short', year: 'numeric' });
            });

            return {
                labels: monthNames,
                // Data is converted from cents to dollars for Chart.js display
                data: sortedKeys.map(key => monthlySales[key] / 100),
            };
        }
        function getFilteredSalesOrders() {
            let filteredOrders = state.orders.filter(o => o.status !== 'Cancelled');
            const now = new Date();
            let cutoffDate = null;

            // Apply time filter
            switch (state.salesTimeFilter) {
                case 'lastmonth':
                    cutoffDate = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
                    break;
                case 'last6months':
                    cutoffDate = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate());
                    break;
                case 'lastyear':
                    cutoffDate = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
                    break;
                case 'custom':
                    // Custom date range handled below
                    break;
                case 'all':
                default:
                    // No cutoff
                    break;
            }

            // Filter by cutoff date
            if (cutoffDate) {
                filteredOrders = filteredOrders.filter(order => {
                    const orderDate = getOrderDate(order);
                    return orderDate && orderDate >= cutoffDate;
                });
            }

            // ✅ NEW: Apply custom date range
            if (state.salesTimeFilter === 'custom') {
                if (state.salesFilters.customStartDate) {
                    const startDate = new Date(state.salesFilters.customStartDate);
                    filteredOrders = filteredOrders.filter(order => {
                        const orderDate = getOrderDate(order);
                        return orderDate && orderDate >= startDate;
                    });
                }
                if (state.salesFilters.customEndDate) {
                    const endDate = new Date(state.salesFilters.customEndDate);
                    endDate.setHours(23, 59, 59, 999); // End of day
                    filteredOrders = filteredOrders.filter(order => {
                        const orderDate = getOrderDate(order);
                        return orderDate && orderDate <= endDate;
                    });
                }
            }

            // ✅ NEW: Apply year filter
            if (state.salesFilters.year !== 'all') {
                const year = parseInt(state.salesFilters.year);
                filteredOrders = filteredOrders.filter(order => {
                    const orderDate = getOrderDate(order);
                    return orderDate && orderDate.getFullYear() === year;
                });
            }

            // ✅ NEW: Apply month filter
            if (state.salesFilters.month !== 'all') {
                const month = parseInt(state.salesFilters.month);
                filteredOrders = filteredOrders.filter(order => {
                    const orderDate = getOrderDate(order);
                    return orderDate && orderDate.getMonth() === month;
                });
            }

            // ✅ NEW: Apply category filter
            if (state.salesFilters.category !== 'all') {
                const categoryId = state.salesFilters.category;
                filteredOrders = filteredOrders.filter(order => {
                    return order.items.some(orderItem => {
                        const isCustomerFormat = orderItem.item && typeof orderItem.item === 'object';
                        const itemId = isCustomerFormat ? orderItem.item.id : orderItem.id;
                        const item = state.items.find(i => i.id === itemId);
                        return item && item.catalogId === categoryId;
                    });
                });
            }

            // ✅ NEW: Apply product filter
            if (state.salesFilters.product !== 'all') {
                const productId = state.salesFilters.product;
                filteredOrders = filteredOrders.filter(order => {
                    return order.items.some(orderItem => {
                        const isCustomerFormat = orderItem.item && typeof orderItem.item === 'object';
                        const itemId = isCustomerFormat ? orderItem.item.id : orderItem.id;
                        return itemId === productId;
                    });
                });
            }

            // ✅ NEW: Apply payment status filter
            if (state.salesFilters.paymentStatus === 'paid') {
                filteredOrders = filteredOrders.filter(order => order.isPaid || order.paymentStatus === 'Paid');
            } else if (state.salesFilters.paymentStatus === 'unpaid') {
                filteredOrders = filteredOrders.filter(order => !order.isPaid && order.paymentStatus !== 'Paid');
            }

            return filteredOrders;
        }

        function generateYearOptions() {
            if (state.orders.length === 0) return '';

            const years = new Set();
            state.orders.forEach(order => {
                const date = getOrderDate(order);
                if (date) {
                    years.add(date.getFullYear());
                }
            });

            return Array.from(years)
                .sort((a, b) => b - a) // Most recent first
                .map(year => `<option value="${year}">${year}</option>`)
                .join('');
        }

        function generateMonthOptions() {
            const months = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];

            return months.map((month, index) =>
                `<option value="${index}">${month}</option>`
            ).join('');

        function waitForUserId(timeout = 5000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();

                const check = () => {
                    // Check the GLOBAL variable 'userId' directly
                    if (userId) {
                        resolve(userId); // Resolve with the UID string
                    } else if (Date.now() - startTime >= timeout) {
                        reject(new Error("Timeout waiting for Admin user ID."));
                    } else {
                        // Check again in 100 milliseconds
                        setTimeout(check, 100);
                    }
                };

                check();
            });
        }

        function getFilteredItems() {
            const f = state.catalogFilters || {};
            let items = state.items;

            // Text search
            if (state.searchTerm) {
                const term = state.searchTerm.toLowerCase();
                items = items.filter(item => {
                    const catName = state.catalogs.find(c => c.id === item.catalogId)?.name || 'Uncategorized';
                    return item.name.toLowerCase().includes(term) ||
                        (item.description || '').toLowerCase().includes(term) ||
                        catName.toLowerCase().includes(term) ||
                        (item.sku && item.sku.toLowerCase().includes(term));
                });
            }

            // Category filter
            if (f.categoryId && f.categoryId !== 'all') {
                items = items.filter(i => i.catalogId === f.categoryId);
            }

            // Sort
            const sorted = [...items];
            switch (f.sortBy || 'name-asc') {
                case 'name-asc':   sorted.sort((a, b) => (a.name || '').localeCompare(b.name || '')); break;
                case 'name-desc':  sorted.sort((a, b) => (b.name || '').localeCompare(a.name || '')); break;
                case 'price-asc':  sorted.sort((a, b) => (a.price || 0) - (b.price || 0)); break;
                case 'price-desc': sorted.sort((a, b) => (b.price || 0) - (a.price || 0)); break;
                case 'newest':     sorted.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); break;
                case 'oldest':     sorted.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)); break;
                case 'sku':        sorted.sort((a, b) => (a.sku || '').localeCompare(b.sku || '')); break;
            }
            return sorted;
        }

        // --- CATEGORY & PRODUCT CRUD ---
        const Validators = {
            required: (value, fieldName = 'Field') => {
                if (!value || (typeof value === 'string' && value.trim().length === 0)) {
                    return { valid: false, error: `${fieldName} is required` };
                }
                return { valid: true };
            },

            email: (email) => {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    return { valid: false, error: 'Invalid email format' };
                }
                return { valid: true };
            },

            phone: (phone) => {
                // Basic international phone validation
                const phoneRegex = /^\+?[\d\s\-()]{7,}$/;
                if (phone && !phoneRegex.test(phone)) {
                    return { valid: false, error: 'Invalid phone format' };
                }
                return { valid: true };
            },

            price: (price, min = 0.01, max = 999999.99) => {
                const numPrice = parseFloat(price);
                if (isNaN(numPrice)) {
                    return { valid: false, error: 'Price must be a number' };
                }
                if (numPrice < min) {
                    return { valid: false, error: `Price must be at least $${min}` };
                }
                if (numPrice > max) {
                    return { valid: false, error: `Price cannot exceed $${max}` };
                }
                return { valid: true, value: numPrice };
            },

            positiveInteger: (value, fieldName = 'Value') => {
                const num = parseInt(value, 10);
                if (isNaN(num) || num < 0) {
                    return { valid: false, error: `${fieldName} must be a positive number` };
                }
                return { valid: true, value: num };
            }
        };
        // Implemented Add Product
        async function handleAddProduct(e) {
            e.preventDefault();
            resetTimer();

            const form = e.target;

            // Existing validation...
            const nameValidation = Validators.required(form.itemName.value, 'Product name');
            if (!nameValidation.valid) {
                showMessage('error', nameValidation.error, 5000, 'catalog');
                return;
            }

            const priceValidation = Validators.price(form.itemPrice.value);
            if (!priceValidation.valid) {
                showMessage('error', priceValidation.error, 5000, 'catalog');
                return;
            }

            const stockValidation = Validators.positiveInteger(form.initialStock.value, 'Stock');
            if (!stockValidation.valid) {
                showMessage('error', stockValidation.error, 5000, 'catalog');
                return;
            }

            // ✅ NEW: Get dimension values
            const length = parseFloat(form.itemLength?.value) || 0;
            const width = parseFloat(form.itemWidth?.value) || 0;
            const height = parseFloat(form.itemHeight?.value) || 0;
            const weight = parseFloat(form.itemWeight?.value) || 0;

            // ✅ NEW: Validate dimensions if any are provided
            if ((length > 0 || width > 0 || height > 0 || weight > 0) &&
                (length <= 0 || width <= 0 || height <= 0 || weight <= 0)) {
                showMessage('error', 'Please provide all dimensions (length, width, height, weight) or leave them all empty', 5000, 'catalog');
                return;
            }

            try {
                const priceCents = Math.round(priceValidation.value * 100);
                const itemName = form.itemName.value.trim();
                const itemDescription = form.itemDescription.value.trim();

        // --- USER MANAGEMENT (MODIFIED for Bulk) ---

        async function handleBulkUserAction() {
            resetTimer();

            const bulkActionSelect = document.getElementById('bulkActionSelect');
            const action = bulkActionSelect.value;
            const selectedUsers = state.selectedUsers;

            if (selectedUsers.length === 0 || !action) {
                return showMessage('error', 'Please select users and an action.', 5000, 'users');
            }

            const usersToProcess = state.allUsers.filter(u => selectedUsers.includes(u.uid));

            let confirmationMessage = '';
            let actionData = {};

            // 1. Determine action and confirmation message
            if (action === 'delete') {
                confirmationMessage = `WARNING: Are you sure you want to PERMANENTLY delete ${selectedUsers.length} selected users? This is irreversible!`;
            } else if (action === 'update') {
                const selectedOption = bulkActionSelect.options[bulkActionSelect.selectedIndex];
                try {
                    actionData = JSON.parse(selectedOption.dataset.update || '{}');
                } catch (e) {
                    return showMessage('error', 'Invalid update data selected.', 5000, 'users');
                }
                const stateWord = actionData.disabled ? 'disable' : 'enable';
                confirmationMessage = `Are you sure you want to ${stateWord} ${selectedUsers.length} selected user accounts?`;
            } else {
                // We exclude 'resetPassword' from bulk actions as it requires sending an email per user, 
                // which should generally be done individually or requires separate batching logic.
                return showMessage('error', 'Unsupported bulk action selected.', 5000, 'users');
            }

            if (!confirm(confirmationMessage)) {
                return;
            }

            // 2. Execute actions sequentially to ensure stability and proper logging
            const results = { success: 0, failed: 0 };
            const total = usersToProcess.length;

            // Use a modal/message to show progress during a long bulk operation
            showMessage('info', `Processing ${total} users... Please wait.`, 0, 'users');

            for (const user of usersToProcess) {
                let successMsg = '';
                const data = (action === 'update') ? actionData : {};

                if (action === 'delete') {
                    successMsg = `User ${user.email || user.uid} deleted.`;
                } else if (action === 'update') {
                    successMsg = `User ${user.email || user.uid} ${data.disabled ? 'disabled' : 'enabled'}.`;
                }

                try {
                    // suppressRefresh: true is critical here to prevent re-fetching the entire list after every single user update
                    await window.module.handleUserAction(action, user.uid, data, successMsg, true);
                    results.success++;
                } catch (e) {
                    results.failed++;
                }
            }

            // 3. Final cleanup and feedback
            if (results.failed === 0) {
                showMessage('success', `Bulk action complete! ${results.success} user(s) processed successfully.`, 8000, 'users');
            } else {
                showMessage('error', `Bulk action finished with ${results.failed} failure(s) out of ${total} users. Check console for details.`, 10000, 'users');
            }

            // Clear selection state and reload the entire list to reflect all changes
            state.selectedUsers = [];
            window.module.fetchUsers(null);
        }

        // MODIFIED: Central function to execute actions against a user via Netlify function
        async function handleUserAction(action, uid, data = {}, successMsg, suppressRefresh = false) {
            resetTimer();

            if (action !== 'resetPassword' && !confirm(`Are you sure you want to perform the action: ${action} on user ${uid}?`)) {
                throw new Error('Action cancelled by user.');
            }

            try {
                const idToken = await auth.currentUser.getIdToken();

                const payload = {
                    action,
                    uid,
                    data
                };

                const res = await fetch(MANAGE_USER_FUNCTION, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${idToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errorDetails = await res.json();
                    throw new Error(errorDetails.details || errorDetails.error || res.statusText);
                }

                // Log the successful action
                await logAdminAction(action.toUpperCase() + '_USER', { uid, details: data }, uid);

                showMessage('success', successMsg, 5000, 'users');

                if (!suppressRefresh) {
                    // After successful individual action, fetch users from the start
                    // This is safer than just updating local state for complex changes.
                    window.module.fetchUsers(null);
                }

                return await res.json(); // Return data (e.g., reset link)

            } catch (error) {
                console.error(`User Action (${action}) failed for ${uid}:`, error);
                showMessage('error', `Action failed: ${error.message}`, 8000, 'users');
                throw error; // Re-throw the error for other handlers (like bulk) to catch
            }
        }

        async function handleClearAnonymousUsers() {
            if (!confirm("Are you sure you want to delete ALL anonymous users? This process is irreversible and may take time for large databases.")) {
                return;
            }

            const msgEl = document.getElementById('clearAnonButtonConfig') || document.getElementById('clearAnonButton');
            if (!msgEl) return;

            const originalText = msgEl.textContent;
            msgEl.textContent = 'Processing...';
            msgEl.disabled = true;

            let pageToken = null;
            let totalDeleted = 0;

            try {
                const idToken = await auth.currentUser.getIdToken();

                do {
                    const payload = { nextPageToken: pageToken };
                    const res = await fetch(CLEAR_ANON_FUNCTION, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${idToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errorDetails = await res.json();
                        throw new Error(errorDetails.details || errorDetails.error || res.statusText);
                    }

                    const data = await res.json();

                    totalDeleted += data.deletedCount || 0;
                    pageToken = data.nextPageToken;

                    if (pageToken) {
                        msgEl.textContent = `Processing batch... (${totalDeleted} deleted)`;
                    } else {
                        showMessage('success', `Cleanup complete! Total anonymous users deleted: ${totalDeleted}.`, 8000, 'config');
                        break; // Exit loop if no token is returned
                    }

                } while (pageToken);

                await logAdminAction('CLEANUP_ANON_USERS', { totalDeleted });
                if (state.activeTab === 'users') window.module.fetchUsers(null); // Refresh user list

            } catch (error) {
                console.error('Anonymous user cleanup failed:', error);
                showMessage('error', `Cleanup failed: ${error.message}. Check Netlify logs.`, 8000, 'config');
            } finally {
                msgEl.textContent = originalText;
                msgEl.disabled = false;
            }
        }

        async function updateOrder_WITH_DISCOUNT(orderId) {
            resetTimer();
            try {
                const order = state.orders.find(o => o.id === orderId);
                if (!order) throw new Error('Order not found');

                // Build new items array from draft cart
                const newItems = Object.values(state.editingOrderDraftCart).map(entry => ({
                    id: entry.item.id,
                    name: entry.item.name,
                    price: entry.item.price,
                    quantity: entry.quantity,
                    sku: entry.item.sku
                }));

                const newSubtotal = newItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                // Get shipping & tax from the modal inputs
                const shippingCents = Math.round((parseFloat(document.getElementById('editShippingCents')?.value) || 0) * 100);
                const taxCents = Math.round((parseFloat(document.getElementById('editTaxCents')?.value) || 0) * 100);

                // ✅ DISCOUNT: Determine discount to apply
                const pendingDiscount = state.editingOrderDiscount;
                let discountData = order.discount || null;    // Existing discount by default
                let discountCents = order.discountCents || 0;

                if (pendingDiscount) {
                    // Re-validate the pending discount against current cart
                    const cartItems = newItems.map(item => ({
                        item: { ...item, catalogId: state.items.find(i => i.id === item.id)?.catalogId },
                        id: item.id,
                        quantity: item.quantity
                    }));

                    const validation = validateDiscount(pendingDiscount.code, cartItems, newSubtotal);

                    if (validation.valid) {
                        discountData = {
                            code: pendingDiscount.code,
                            type: pendingDiscount.type,
                            value: pendingDiscount.value,
                            savedCents: validation.savedCents,
                            discountId: pendingDiscount.id,
                            appliedAt: new Date().toISOString(),
                            appliedBy: auth.currentUser?.email || 'admin'
                        };
                        discountCents = validation.savedCents;
                    } else {
                        // Discount no longer valid — warn but continue saving without it
                        showMessage('error', `Discount "${pendingDiscount.code}" is no longer valid: ${validation.message}. Order saved without discount.`, 8000, 'orders');
                        discountData = null;
                        discountCents = 0;
                    }
                }

                // ✅ DISCOUNT: Calculate final total with discount applied
                const discountedSubtotal = Math.max(0, newSubtotal - discountCents);
                const newTotal = discountedSubtotal + shippingCents + taxCents;

                // Get new status
                const newStatus = document.getElementById('editOrderStatus')?.value || order.status;

                // Build Firestore update
                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                const updatePayload = {
                    items: newItems,
                    subtotalCents: newSubtotal,
                    shippingCents: shippingCents,
                    taxCents: taxCents,
                    totalCents: newTotal,
                    status: newStatus,
                    // ✅ DISCOUNT: Include discount fields
                    discount: discountData,
                    discountCents: discountCents,
                    updatedAt: serverTimestamp()
                };

                await updateDoc(orderRef, updatePayload);

                // ✅ DISCOUNT: Record usage if this is a NEW discount (not already on the order)
                if (pendingDiscount && discountData && (!order.discount || order.discount.code !== pendingDiscount.code)) {
                    await recordDiscountUsage(
                        pendingDiscount,
                        orderId,
                        order.orderNumber || orderId.substring(0, 8),
                        discountCents
                    );
                }

                // Send status update email if status changed
                if (newStatus !== order.status) {
                    try {
                        await fetch('/.netlify/functions/sendStatusUpdate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderId: orderId,
                                orderNumber: order.orderNumber || orderId.substring(0, 8),
                                buyerEmail: order.buyerEmail,
                                buyerName: order.buyerName,
                                newStatus: newStatus,
                                language: order.language || 'en'
                            })
                        });
                    } catch (emailError) {
                        console.warn('Email failed:', emailError);
                    }
                }

                await logAdminAction('ORDER_UPDATED', {
                    orderId,
                    newItems,
                    newStatus,
                    discount: discountData,
                    discountCents,
                    newTotal
                }, orderId);

                // ✅ DISCOUNT: Clear editing state
                state.editingOrderDiscount = null;

                showMessage('success', `Order updated! ${discountData ? `Discount "${discountData.code}" applied (saves ${formatPriceDisplay(discountCents)}).` : ''} Total: ${formatPriceDisplay(newTotal)}`, 5000, 'orders');
                closeEditModal();

            } catch (error) {
                console.error('Error updating order:', error);
                showMessage('error', `Failed to update order: ${error.message}`, 5000, 'orders');
            }
        }

        function validateOrderForm() {
            const name = document.getElementById('buyerName')?.value.trim();
            const email = document.getElementById('buyerEmail')?.value.trim();
            const address = document.getElementById('deliveryAddress')?.value.trim();
            const addressValidated = document.getElementById('deliveryAddress')?.dataset.validated === 'true';
            const cartItems = Object.keys(state.adminCart).length;

            const errors = [];

            if (!name) errors.push('Customer name is required');
            if (!email || !Validators.email(email).valid) errors.push('Valid email is required');
            if (!address || !addressValidated) errors.push('Valid address must be selected from dropdown');
            if (cartItems === 0) errors.push('Cart cannot be empty');

            if (errors.length > 0) {
                showMessage('error', errors.join('\n'), 5000, 'orders');
                return false;
            }

            return true;
        }


        // ✅ NEW: Calculate shipping and tax for manual orders
        async function calculateAdminOrderShippingTax() {
            const addressInput = document.getElementById('deliveryAddress');
            const address = addressInput?.value?.trim();

            if (!address || addressInput.dataset.validated !== 'true') {
                // Reset if address is invalid
                state.adminOrderShippingCents = 0;
                state.adminOrderTaxCents = 0;
                state.adminOrderShippingDetails = null;
                state.adminOrderTaxDetails = null;
                updateAdminCartDisplay();
                return;
            }

            const submitButton = document.getElementById('submitOrderButton');
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Calculating shipping...';
            }

            try {
                // Parse address for state/zip
                const addressParts = address.split(',');
                const stateZip = addressParts[addressParts.length - 2]?.trim().split(' ') || [];
                const orderState = stateZip[0] || 'CA';
                const zipCode = stateZip[1] || '00000';

                // Calculate total weight (1 lb per item as example)
                const totalWeight = Object.values(state.adminCart).reduce((sum, e) => sum + e.quantity, 0);
                const cartTotalCents = Object.values(state.adminCart).reduce((s, e) => s + e.item.price * e.quantity, 0);

                // 1. Calculate Shipping
                try {
                    const shippingRes = await fetch('/.netlify/functions/calculateShipping', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            addressTo: {
                                name: document.getElementById('buyerName')?.value || 'Customer',
                                street1: addressParts[0]?.trim() || address,
                                city: addressParts[1]?.trim() || 'Unknown',
                                state: orderState,
                                zip: zipCode,
                                country: 'US'
                            },
                            parcels: [{
                                length: "12",
                                width: "8",
                                height: "6",
                                distance_unit: "in",
                                weight: Math.max(1, totalWeight).toString(),
                                mass_unit: "lb"
                            }]
                        })
                    });

                    if (shippingRes.ok) {
                        const shippingData = await shippingRes.json();
                        if (shippingData.bestRate) {
                            state.adminOrderShippingCents = Math.round(shippingData.bestRate.amount * 100);
                            state.adminOrderShippingDetails = {
                                provider: shippingData.bestRate.provider,
                                servicelevel: shippingData.bestRate.servicelevel?.name || 'Standard',
                                amount: shippingData.bestRate.amount,
                                estimated_days: shippingData.bestRate.estimated_days
                            };
                            console.log('✅ Shipping calculated:', shippingData.bestRate);
                        }
                    } else {
                        console.warn('Shipping API failed, using default');
                        state.adminOrderShippingCents = 1000; // $10 default
                        state.adminOrderShippingDetails = { provider: 'Standard', amount: 10 };
                    }
                } catch (shippingError) {
                    console.error('Shipping calculation error:', shippingError);
                    state.adminOrderShippingCents = 1000;
                    state.adminOrderShippingDetails = { provider: 'Standard', amount: 10 };
                }

                if (submitButton) submitButton.textContent = 'Calculating tax...';

                // 2. Calculate Tax
                try {
                    const taxRes = await fetch('/.netlify/functions/calculateTax', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subtotalCents: cartTotalCents,
                            state: orderState,
                            zipCode: zipCode,
                            // ✅ NEW: Parse from delivery address
                            street: addressParts[0]?.trim() || '',
                            city: addressParts[1]?.trim() || '',
                            country: 'US'
                        })
                    });

                    if (taxRes.ok) {
                        const taxData = await taxRes.json();
                        state.adminOrderTaxCents = taxData.taxCents || 0;
                        state.adminOrderTaxDetails = {
                            rate: taxData.taxRate,
                            ratePercent: taxData.taxRatePercent
                        };
                        console.log('✅ Tax calculated:', taxData);
                    } else {
                        console.warn('Tax API failed, using 0');
                        state.adminOrderTaxCents = 0;
                    }
                } catch (taxError) {
                    console.error('Tax calculation error:', taxError);
                    state.adminOrderTaxCents = 0;
                }

                // Re-render cart with updated totals
                updateAdminCartDisplay();

            } catch (error) {
                console.error('Calculation error:', error);
                showMessage('error', 'Failed to calculate shipping/tax. Using defaults.', 5000, 'orders');
            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = 'SUBMIT ORDER & SEND EMAIL';
                }
            }
        }





        // UPDATED Order submission function with email call
        async function handleAdminOrderSubmit(e) {
            e.preventDefault();
            resetTimer();
            if (!validateOrderForm()) {
                return;
            }
            const form = document.getElementById('createOrderForm');
            const deliveryAddress = document.getElementById('deliveryAddress');
            const submitButton = document.getElementById('submitOrderButton');

            // 1. Get Form Data
            const buyerName = form.buyerName.value.trim();
            const buyerEmail = form.buyerEmail.value.trim();
            const buyerPhone = form.buyerPhone.value.trim();
            const orderNotes = form.orderNotes.value.trim();
            const buyerLanguage = form.buyerLanguage?.value.trim() || 'en';

            const email = buyerEmail;
            const name = buyerName;
            const phone = buyerPhone;
            const address = deliveryAddress.value.trim();
            const itemsToOrder = Object.values(state.adminCart);

            // 1.1 Validation
            if (itemsToOrder.length === 0) {
                return showMessage('error', 'The order cart is empty.', 3000, 'orders');
            }

            if (deliveryAddress.dataset.validated !== 'true') {
                return showMessage('error', 'Please select a valid delivery address from the dropdown.', 5000, 'orders');
            }

            // 1.2 Get Geolocation (if available)
            let geolocation = null;
            if (autocomplete && autocomplete.getPlace) {
                const place = autocomplete.getPlace();
                if (place.geometry && place.geometry.location) {
                    geolocation = {
                        lat: place.geometry.location.lat(),
                        lng: place.geometry.location.lng()
                    };
                }
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Creating order...';

            try {
                // 2. Calculate Totals - Use pre-calculated shipping/tax from state
                const cartTotalCents = itemsToOrder.reduce((s, e) => s + e.item.price * e.quantity, 0);
                const discountCents = state.appliedDiscount?.savedCents || 0;
                const discountedSubtotal = Math.max(0, cartTotalCents - discountCents);
                const finalTotalCents = discountedSubtotal + shippingCents + taxCents;
                const shippingCents = state.adminOrderShippingCents || 0;
                const taxCents = state.adminOrderTaxCents || 0;

                console.log('💰 Order Totals:', {
                    subtotal: formatPriceDisplay(cartTotalCents),
                    shipping: formatPriceDisplay(shippingCents),
                    tax: formatPriceDisplay(taxCents),
                    total: formatPriceDisplay(finalTotalCents)
                });

                // 3. Prepare Order Data
                const whatsappConsent = document.getElementById('adminWhatsappOpt')?.checked || false;
                const smsConsent = document.getElementById('adminSmsOpt')?.checked || false;

                const orderData = {
                    buyerEmail: email,
                    buyerName: name,
                    buyerPhone: phone,
                    deliveryAddress: address,
                    whatsappConsent: whatsappConsent,
                    smsConsent: smsConsent,
                    notificationPreferences: {
                        whatsapp: whatsappConsent,
                        sms: smsConsent,
                        email: true
                    },
                    items: itemsToOrder.map(e => ({
                        id: e.item.id,
                        name: e.item.name,
                        sku: e.item.sku || null,
                        price: e.item.price,
                        quantity: e.quantity
                    })),
                    subtotalCents: cartTotalCents,
                    shippingCents: shippingCents,
                    discount: state.appliedDiscount ? {
                        code: state.appliedDiscount.code,
                        type: state.appliedDiscount.type,
                        value: state.appliedDiscount.value,
                        savedCents: discountCents,
                        discountId: state.appliedDiscount.id
                    } : null,
                    discountCents: discountCents,

                    taxCents: taxCents,
                    totalCents: finalTotalCents,
                    shippingDetails: state.adminOrderShippingDetails,
                    taxDetails: state.adminOrderTaxDetails,
                    userId: auth.currentUser.uid,
                    createdByAdmin: auth.currentUser.uid,
                    timestamp: new Date().toISOString(),
                    geolocation: geolocation,
                    adminNotes: orderNotes,
                    language: buyerLanguage,
                    communicationLang: buyerLanguage
                };

                // 4. Submit Order to Backend
                const idToken = await auth.currentUser.getIdToken();
                const res = await fetch(ADMIN_CREATE_ORDER_FUNCTION, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${idToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (!res.ok) {
                    const errorDetails = await res.json();
                    throw new Error(errorDetails.details || 'Order creation failed on server.');
                }

                const orderCreationResponse = await res.json();
                const finalOrderId = orderCreationResponse.orderId || 'ADMIN_ORDER_ID';

                if (state.appliedDiscount) {
                    await recordDiscountUsage(
                        state.appliedDiscount,
                        finalOrderId,
                        orderCreationResponse.orderNumber || finalOrderId.substring(0, 8),
                        discountCents
                    );
                }

                console.log('✅ Order created:', finalOrderId);

                // 5. Update Inventory
                const inventoryUpdates = itemsToOrder.map(async entry => {
                    const itemId = entry.item.id;
                    const orderQty = entry.quantity;
                    const currentItem = state.items.find(i => i.id === itemId);

                    if (!currentItem) return;

                    const newStock = Math.max(0, (currentItem.stock || 0) - orderQty);

                    const itemRef = doc(db, ITEMS_COLLECTION, itemId);
                    await updateDoc(itemRef, { stock: newStock });

                    await logAdminAction('INVENTORY_DECREASED', {
                        itemId,
                        item: currentItem.name,
                        action: 'remove',
                        amount: orderQty,
                        oldStock: currentItem.stock,
                        newStock
                    }, itemId);
                });

                await Promise.all(inventoryUpdates);
                console.log('✅ Inventory updated');

                // 6. Send Confirmation Email
                const emailPayload = {
                    ...orderData,
                    orderId: finalOrderId,
                    adminEmail: auth.currentUser?.email,
                    requesterEmail: auth.currentUser?.email,
                    language: buyerLanguage
                };

                try {
                    const emailRes = await fetch(EMAIL_CONFIRMATION_FUNCTION, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(emailPayload)
                    });

                    if (emailRes.ok) {
                        console.log('✅ Confirmation email sent');
                        logEmailNotification('order_confirmation', finalOrderId,
                            orderData.buyerEmail, orderData.buyerName,
                            { orderNumber: finalOrderId.substring(0, 8), totalCents: finalTotalCents });
                    } else {
                        console.warn('⚠️ Email send failed, but order was created');
                    }
                } catch (emailError) {
                    console.error('Email error:', emailError);
                    // Don't fail the whole order if email fails
                }

                // 7. Success - Reset Form and State
                state.adminCart = {};
                state.adminOrderShippingCents = 0;
                state.adminOrderTaxCents = 0;
                state.appliedDiscount = null;
                state.adminOrderShippingDetails = null;
                state.adminOrderTaxDetails = null;

                form.reset();
                deliveryAddress.dataset.validated = 'false';
                deliveryAddress.classList.remove('address-valid');
                deliveryAddress.classList.add('address-invalid');

                showMessage('success',
                    `✅ Order ${finalOrderId.substring(0, 8)} created successfully!\n` +
                    `Subtotal: ${formatPriceDisplay(cartTotalCents)}\n` +
                    `Shipping: ${formatPriceDisplay(shippingCents)}\n` +
                    `Tax: ${formatPriceDisplay(taxCents)}\n` +
                    `Total: ${formatPriceDisplay(finalTotalCents)}`,
                    10000, 'orders'
                );

                // Refresh orders list
                window.module.fetchOrders();

            } catch (error) {
                console.error('❌ Error creating order:', error);
                showMessage('error', `Failed to create order: ${error.message}`, 10000, 'orders');
            } finally {
                submitButton.textContent = 'SUBMIT ORDER & SEND EMAIL';
                submitButton.disabled = false;
                updateAdminCartDisplay();
            }
        }

        async function fetchUsers(pageToken = null) {
            resetTimer();
            const loadMoreBtn = document.getElementById('loadMoreUsersButton');
            const msgEl = document.getElementById('usersMessage');

            if (msgEl) msgEl.textContent = pageToken ? 'Loading next batch...' : 'Loading users...';
            if (loadMoreBtn) loadMoreBtn.disabled = true;

            if (!pageToken) {
                state.allUsers = [];
                globalNextPageToken = null;
                state.selectedUsers = [];
            }

            try {
                const idToken = await auth.currentUser.getIdToken();
                const params = new URLSearchParams();
                if (pageToken) params.append('nextPageToken', pageToken);

                const res = await fetch(`${LIST_USERS_FUNCTION}?${params.toString()}`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });

                if (!res.ok) {
                    const errorDetails = await res.json();
                    throw new Error(errorDetails.details || errorDetails.error || res.statusText);
                }

                const data = await res.json();
                globalNextPageToken = data.nextPageToken;
                state.allUsers = state.allUsers.concat(data.users);

                renderUserList();

            } catch (error) {
                console.error('Error fetching users:', error);
                showMessage('error', `Failed to fetch users: ${error.message}`, 5000, 'users');
            } finally {
                if (msgEl) msgEl.textContent = '';
                if (loadMoreBtn) loadMoreBtn.disabled = false;
                renderUserControls();
            }
        }

        function renderUserList() {
            const grid = document.getElementById('usersGrid');
            if (!grid) return;
            const users = getFilteredAuthUsers();

            Array.from(grid.children).slice(8).forEach(el => el.remove());
            const selectAll = document.getElementById('selectAllUsers');
            if (selectAll) selectAll.checked = false;

            document.getElementById('selectedUserCount').textContent = state.selectedUsers.length;
            document.getElementById('bulkActionButton').disabled = state.selectedUsers.length === 0;

            const userRows = users.map(user => {
                const disabledClass = user.disabled ? 'bg-red-50 text-red-700' : '';
                const emailVerifiedIcon = user.emailVerified ? '✅' : '❌';
                const disabledButtonText = user.disabled ? 'Enable' : 'Disable';
                const disabledButtonColor = user.disabled ? 'text-green-600 hover:text-green-800' : 'text-yellow-600 hover:text-yellow-800';
                const isSelected = state.selectedUsers.includes(user.uid);
                const userEmail = user.email || (user.uid.slice(0, 8) + '... (Anonymous)');

                return `
                    <div class="grid-item ${disabledClass}">
                        <input type="checkbox" onchange="window.module.toggleUserSelection('${user.uid}')" 
                                    data-uid="${user.uid}" ${isSelected ? 'checked' : ''}>
                    </div>
                    <div class="grid-item text-xs font-mono truncate ${disabledClass}">${user.uid.slice(0, 8)}...</div>
                    <div class="grid-item text-sm font-semibold truncate ${disabledClass}">${userEmail} ${emailVerifiedIcon}</div>
                    <div class="grid-item text-xs text-gray-500 ${disabledClass}">${user.displayName || 'N/A'}</div>
                    <div class="grid-item text-xs text-gray-500 ${disabledClass}">${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</div>
                    <div class="grid-item text-xs text-gray-500 ${disabledClass}">${user.lastSignInTime ? new Date(user.lastSignInTime).toLocaleDateString() : 'N/A'}</div>
                    <div class="grid-item text-xs font-bold ${disabledClass}">${user.disabled ? 'DISABLED' : 'Active'}</div>
                    <div class="grid-item space-x-2 ${disabledClass}">
                        <button onclick="window.module.promptForPasswordReset('${user.uid}', '${userEmail}')" class="text-blue-600 hover:text-blue-800 text-sm font-semibold">Reset Pwd</button>
                        <button onclick="window.module.disableUser('${user.uid}', '${userEmail}', ${user.disabled})" class="${disabledButtonColor} text-sm font-semibold">${disabledButtonText}</button>
                        <button onclick="window.module.deleteUser('${user.uid}', '${userEmail}')" class="text-red-600 hover:text-red-800 text-sm font-semibold">Delete</button>
                    </div>
                `;
            }).join('');

            grid.insertAdjacentHTML('beforeend', userRows);
            renderUserControls();
        }

                console.log('💾 Branding colors being sent:', updates.branding.colors); // ✅ NEW

                // ✅ ADD AUTHORIZATION HEADER
                const response = await fetch(UPDATE_ADMIN_CONFIG_FUNCTION, {
                    method: 'POST',
                    headers: {

                console.log('💾 Response status:', response.status); // ✅ NEW

                    throw new Error('Failed to update config');

                // Immediately update globalConfig in memory so re-render has correct values
                Object.assign(globalConfig, updates);

                setTimeout(() => {

                    setTimeout(() => { if (md) md.innerHTML = ''; }, 4000);

                // Refresh config from server to get updated lastUpdated timestamp

                console.error('❌ Error updating config:', error);
                messageDiv.innerHTML = '<div class="p-4 bg-red-100 text-red-700 rounded-lg">Failed to update configuration.</div>';
            }

        async function handleDeleteOrder(orderId) {
            if (!state.isAdmin) {
                showMessage('error', 'Permission denied: only admins can delete orders.', 4000, 'orders');
                return;
            }

            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            const label = order.orderNumber || orderId.substring(0, 8);
            if (!confirm(`⚠️ Permanently delete order #${label}?\n\nCustomer: ${order.buyerName || '—'}\nTotal: ${formatPriceDisplay(order.totalCents)}\n\nThis cannot be undone.`)) return;

            try {
                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                await deleteDoc(doc(db, path, orderId));

                await logAdminAction('ORDER_DELETED', {
                    orderId,
                    orderNumber: label,
                    buyerName:  order.buyerName,
                    buyerEmail: order.buyerEmail,
                    totalCents: order.totalCents,
                    deletedBy:  auth.currentUser?.email
                }, orderId);

                showMessage('success', `Order #${label} deleted.`, 3000, 'orders');
            } catch (err) {
                console.error('Delete order error:', err);
                showMessage('error', `Failed to delete order: ${err.message}`, 5000, 'orders');
            }
        }

        async function handleOrderStatusUpdate(orderId, newStatus) {
            resetTimer();
            const order = state.orders.find(o => o.id === orderId);
            if (!order) {
                showMessage('error', 'Order not found.', 3000, 'orders');
                return;
            }

            try {
                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                await updateDoc(orderRef, {
                    status: newStatus,
                    updatedAt: serverTimestamp()
                });

                await logAdminAction('ORDER_STATUS_UPDATED', {
                    orderId,
                    oldStatus: order.status,
                    newStatus
                }, orderId);

                // ✅ USE sendOrderConfirmation with newStatus parameter
                try {
                    await fetch('/.netlify/functions/sendOrderConfirmation', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            orderId: orderId,
                            buyerEmail: order.buyerEmail,
                            buyerName: order.buyerName,
                            newStatus: newStatus,  // ✅ This tells it to send a status update
                            communicationLang: order.language || order.communicationLang || 'en',
                            items: order.items || [],
                            totalCents: order.totalCents || 0,
                            subtotalCents: order.subtotalCents || order.totalCents || 0,
                            shippingCents: order.shippingCents || 0,
                            taxCents: order.taxCents || 0,
                            shippingDetails: order.shippingDetails || null,
                            taxDetails: order.taxDetails || null
                        })
                    });
                    console.log('✅ Status update email sent');
                    logEmailNotification('status_update', orderId,
                        order.buyerEmail, order.buyerName,
                        { newStatus, orderNumber: order.orderNumber || orderId.substring(0,8) });
                    showMessage('success', `Order status updated to: ${newStatus}. Email sent to customer.`, 5000, 'orders');
                } catch (emailError) {
                    console.warn('⚠️ Email notification failed:', emailError);
                    showMessage('success', `Order status updated to: ${newStatus}. (Email failed to send)`, 5000, 'orders');
                }

            } catch (error) {
                console.error('Error updating order status:', error);
                showMessage('error', `Failed to update order status: ${error.message}`, 5000, 'orders');
            }
        }

                    order.buyerEmail?.toLowerCase().includes(state.orderListSearchTerm.toLowerCase());

        async function sendPaymentLink(orderId) {
            if (!confirm('Send payment link email to customer?')) return;

            const buttons = document.querySelectorAll(`button[onclick*="sendPaymentLink('${orderId}')"]`);
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.innerHTML = '⏳ Sending...';
            });

            try {
                const token = await auth.currentUser.getIdToken();

                const response = await fetch('/.netlify/functions/resendPaymentLink', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        orderId: orderId,
                        sendEmail: true
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const paymentUrl = data.paymentUrl || data.payment_url || data.url || '';

                    // Log first — before anything that could throw
                    const order = state.orders.find(o => o.id === orderId);
                    logEmailNotification('payment_link', orderId,
                        order?.buyerEmail, order?.buyerName,
                        { orderNumber: order?.orderNumber || orderId.substring(0, 8) });

                    alert(`✅ Payment link sent!${paymentUrl ? `\n\n${paymentUrl.substring(0, 50)}...` : ''}`);

                    if (paymentUrl) {
                        try { await navigator.clipboard.writeText(paymentUrl); } catch (err) {}
                    }

                    await fetchOrders();

                    // Close modal if open
                    const modal = document.getElementById('editModalContainer');
                    if (modal) closeEditModal();
                } else {
                    const error = await response.json();
                    alert(`❌ Error: ${error.error || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Send payment link error:', error);
                alert(`❌ Failed: ${error.message}`);
            } finally {
                buttons.forEach(btn => {
                    btn.disabled = false;
                    btn.innerHTML = '📧 Send Payment Link';
                });
            }
        }
