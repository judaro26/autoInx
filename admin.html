        // ─────────────────────────────────────────────────────────────────────────────
        // FORM HELPERS
        // ─────────────────────────────────────────────────────────────────────────────

        function handleDiscountTypeToggle(type) {
            const valueField = document.querySelector('[name="discountValue"]');
            const valueLabel = document.getElementById('discountValueLabel');
            if (type === 'freeShipping') {
                if (valueField) { valueField.disabled = true; valueField.value = ''; }
                if (valueLabel) valueLabel.textContent = 'N/A';
            } else if (type === 'fixed') {
                if (valueField) { valueField.disabled = false; valueField.placeholder = '5.00'; }
                if (valueLabel) valueLabel.textContent = 'Amount ($)';
            } else {
                if (valueField) { valueField.disabled = false; valueField.placeholder = '10'; }
                if (valueLabel) valueLabel.textContent = 'Percentage';
            }
        }

        function handleDiscountSearchInput(e) {
            state.discountSearch = e.target.value.toLowerCase();
            renderDiscountsList();
            resetTimer();
        }

        function handleDiscountStatusFilter(e) {
            state.discountStatusFilter = e.target.value;
            renderDiscountsList();
            resetTimer();
        }

        function getFilteredDiscounts() {
            let filtered = [...state.discounts];
            const now = new Date();

            if (state.discountSearch) {
                const q = state.discountSearch;
                filtered = filtered.filter(d =>
                    d.code.toLowerCase().includes(q) ||
                    (d.description || '').toLowerCase().includes(q)
                );
            }

            switch (state.discountStatusFilter) {
                case 'active':
                    filtered = filtered.filter(d =>
                        d.enabled && (!d.expiresAt || new Date(d.expiresAt) > now) &&
                        (d.maxUses === 0 || (d.currentUses || 0) < d.maxUses)
                    );
                    break;
                case 'expired':
                    filtered = filtered.filter(d => d.expiresAt && new Date(d.expiresAt) <= now);
                    break;
                case 'disabled':
                    filtered = filtered.filter(d => !d.enabled);
                    break;
                case 'maxed':
                    filtered = filtered.filter(d => d.maxUses > 0 && (d.currentUses || 0) >= d.maxUses);
                    break;
            }
            return filtered;
        }


        // ─────────────────────────────────────────────────────────────────────────────
        // DISCOUNTS LIST RENDERING
        // ─────────────────────────────────────────────────────────────────────────────

        function renderDiscountsList() {
            const container = document.getElementById('discountsListContainer');
            if (!container) return;

            const discounts = getFilteredDiscounts();
            const now = new Date();

            if (discounts.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-gray-500">
            ${state.discounts.length === 0 ? 'No discounts created yet. Use the form above!' : 'No discounts match your filters.'}
        </p>`;
                return;
            }

            const rows = discounts.map(d => {
                const isExpired = d.expiresAt && new Date(d.expiresAt) <= now;
                const isMaxed = d.maxUses > 0 && (d.currentUses || 0) >= d.maxUses;

                let statusBadge;
                if (!d.enabled) statusBadge = '<span class="px-2 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-600">Disabled</span>';
                else if (isExpired) statusBadge = '<span class="px-2 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700">Expired</span>';
                else if (isMaxed) statusBadge = '<span class="px-2 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-700">Limit Hit</span>';
                else statusBadge = '<span class="px-2 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">Active</span>';

                let typeDisplay;
                if (d.type === 'percentage') typeDisplay = `${d.value}% off`;
                else if (d.type === 'fixed') typeDisplay = `${formatPriceDisplay(d.valueCents || Math.round(d.value * 100))} off`;
                else typeDisplay = 'Free Shipping';

                const usesDisplay = d.maxUses > 0 ? `${d.currentUses || 0}/${d.maxUses}` : `${d.currentUses || 0}`;
                const totalSavedCents = (d.usageLog || []).reduce((sum, e) => sum + (e.savedCents || 0), 0);

                const restrictions = [];
                if (d.minOrderCents > 0) restrictions.push(`Min: ${formatPriceDisplay(d.minOrderCents)}`);
                if (d.maxDiscountCents > 0) restrictions.push(`Cap: ${formatPriceDisplay(d.maxDiscountCents)}`);
                if (d.appliesToCategory && d.appliesToCategory !== 'all') {
                    restrictions.push(`Cat: ${state.catalogs.find(c => c.id === d.appliesToCategory)?.name || '?'}`);
                }
                if (d.appliesToProduct && d.appliesToProduct !== 'all') {
                    restrictions.push(`Prod: ${state.items.find(i => i.id === d.appliesToProduct)?.name || '?'}`);
                }

                return `
            <div class="border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition">
                <div class="grid grid-cols-12 gap-3 items-center p-4">
                    <div class="col-span-3">
                        <p class="font-bold font-mono text-indigo-700 text-sm">${escapeHtml(d.code)}</p>
                        <p class="text-xs text-gray-500 mt-1 truncate">${escapeHtml(d.description || '')}</p>
                        ${restrictions.length > 0 ? `<div class="flex flex-wrap gap-1 mt-1">${restrictions.map(r => `<span class="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">${r}</span>`).join('')}</div>` : ''}
                    </div>
                    <div class="col-span-2 text-sm font-semibold text-gray-700">${typeDisplay}</div>
                    <div class="col-span-1 text-center text-sm text-gray-600">${usesDisplay}</div>
                    <div class="col-span-2 text-center">
                        <span class="text-sm font-bold text-green-700">${formatPriceDisplay(totalSavedCents)}</span>
                        <p class="text-xs text-gray-500">saved</p>
                    </div>
                    <div class="col-span-1 text-center">${statusBadge}</div>
                    <div class="col-span-1 text-xs text-gray-500 text-center">
                        ${d.expiresAt ? `<span class="${isExpired ? 'text-red-600 font-bold' : ''}">${new Date(d.expiresAt).toLocaleDateString()}</span>` : '<span class="text-gray-400">Never</span>'}
                    </div>
                    <div class="col-span-2 flex flex-wrap gap-1 justify-end">
                        <button onclick="window.module.startEditDiscount('${d.id}')" class="px-2 py-1 text-xs font-bold text-blue-600 hover:bg-blue-100 rounded" title="Edit">✏️</button>
                        <button onclick="window.module.toggleDiscountEnabled('${d.id}', ${d.enabled})" class="px-2 py-1 text-xs font-bold ${d.enabled ? 'text-yellow-600 hover:bg-yellow-100' : 'text-green-600 hover:bg-green-100'} rounded" title="${d.enabled ? 'Disable' : 'Enable'}">${d.enabled ? '⏸️' : '▶️'}</button>
                        <button onclick="window.module.handleDeleteDiscount('${d.id}', '${escapeAttribute(d.code)}')" class="px-2 py-1 text-xs font-bold text-red-600 hover:bg-red-100 rounded" title="Delete">🗑️</button>
                    </div>
                </div>
                ${(d.usageLog && d.usageLog.length > 0) ? `
                    <div class="px-4 pb-3">
                        <button onclick="document.getElementById('usageLog-${d.id}').classList.toggle('hidden')" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold">
                            📊 View Usage Log (${d.usageLog.length} uses)
                        </button>
                        <div id="usageLog-${d.id}" class="hidden mt-2 max-h-48 overflow-y-auto custom-scrollbar bg-gray-50 rounded-lg">
                            <div class="grid grid-cols-4 gap-2 text-xs font-bold text-gray-600 bg-gray-200 px-3 py-2 rounded-t">
                                <div>Date</div><div>Order</div><div>Saved</div><div>By</div>
                            </div>
                            ${d.usageLog.map(entry => `
                                <div class="grid grid-cols-4 gap-2 text-xs py-2 px-3 border-b border-gray-100">
                                    <div>${entry.date ? new Date(entry.date).toLocaleDateString() : 'N/A'}</div>
                                    <div class="font-mono">${escapeHtml(entry.orderNumber || entry.orderId?.substring(0, 8) || 'N/A')}</div>
                                    <div class="font-bold text-green-700">${formatPriceDisplay(entry.savedCents || 0)}</div>
                                    <div class="truncate">${escapeHtml(entry.adminEmail || 'N/A')}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
            }).join('');

            container.innerHTML = `
        <div class="grid grid-cols-12 gap-3 font-bold text-xs text-gray-600 bg-gray-100 p-3 rounded-t-lg border-b-2 border-indigo-200">
            <div class="col-span-3">Code / Description</div>
            <div class="col-span-2">Type</div>
            <div class="col-span-1 text-center">Uses</div>
            <div class="col-span-2 text-center">Total Saved</div>
            <div class="col-span-1 text-center">Status</div>
            <div class="col-span-1 text-center">Expires</div>
            <div class="col-span-2 text-right">Actions</div>
        </div>
        <div class="divide-y divide-gray-100">${rows}</div>
        <div class="p-3 text-right text-xs text-gray-500 bg-gray-50 rounded-b-lg">
            Showing ${discounts.length} of ${state.discounts.length} discounts
        </div>
    `;
        }


        // ─────────────────────────────────────────────────────────────────────────────
        // MARKETING ANALYTICS DASHBOARD
        // ─────────────────────────────────────────────────────────────────────────────

        function renderMarketingAnalytics() {
            const container = document.getElementById('marketingAnalyticsContainer');
            if (!container) return;

            const now = new Date();
            const allDiscounts = state.discounts;

            const activeCount = allDiscounts.filter(d =>
                d.enabled && (!d.expiresAt || new Date(d.expiresAt) > now) &&
                (d.maxUses === 0 || (d.currentUses || 0) < d.maxUses)
            ).length;

            const totalUses = allDiscounts.reduce((sum, d) => sum + (d.currentUses || 0), 0);
            const totalSavedCents = allDiscounts.reduce((sum, d) =>
                sum + (d.usageLog || []).reduce((s, e) => s + (e.savedCents || 0), 0), 0);

            const ordersWithDiscount = state.orders.filter(o => o.discount || o.discountCents > 0);
            const totalDiscountGivenCents = ordersWithDiscount.reduce((sum, o) =>
                sum + (o.discountCents || o.discount?.savedCents || 0), 0);
            const avgDiscountCents = ordersWithDiscount.length > 0
                ? Math.round(totalDiscountGivenCents / ordersWithDiscount.length) : 0;

            // Top codes by usage
            const codePerformance = allDiscounts
                .filter(d => (d.currentUses || 0) > 0)
                .map(d => ({
                    code: d.code,
                    uses: d.currentUses || 0,
                    savedCents: (d.usageLog || []).reduce((s, e) => s + (e.savedCents || 0), 0)
                }))
                .sort((a, b) => b.uses - a.uses)
                .slice(0, 5);

            // Monthly usage
            const monthlyUsage = {};
            allDiscounts.forEach(d => {
                (d.usageLog || []).forEach(entry => {
                    if (entry.date) {
                        const date = new Date(entry.date);
                        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!monthlyUsage[key]) monthlyUsage[key] = { uses: 0, savedCents: 0 };
                        monthlyUsage[key].uses++;
                        monthlyUsage[key].savedCents += entry.savedCents || 0;
                    }
                });
            });

            container.innerHTML = `
        <!-- Summary Stats -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
            <div class="bg-purple-50 p-4 rounded-xl border-2 border-purple-200">
                <p class="text-xs font-semibold text-purple-600 mb-1">Total Codes</p>
                <p class="text-2xl font-black text-purple-900">${allDiscounts.length}</p>
            </div>
            <div class="bg-green-50 p-4 rounded-xl border-2 border-green-200">
                <p class="text-xs font-semibold text-green-600 mb-1">Active Codes</p>
                <p class="text-2xl font-black text-green-900">${activeCount}</p>
            </div>
            <div class="bg-blue-50 p-4 rounded-xl border-2 border-blue-200">
                <p class="text-xs font-semibold text-blue-600 mb-1">Redemptions</p>
                <p class="text-2xl font-black text-blue-900">${totalUses}</p>
            </div>
            <div class="bg-red-50 p-4 rounded-xl border-2 border-red-200">
                <p class="text-xs font-semibold text-red-600 mb-1">Total Given Away</p>
                <p class="text-2xl font-black text-red-900">${formatPriceDisplay(totalSavedCents)}</p>
            </div>
            <div class="bg-indigo-50 p-4 rounded-xl border-2 border-indigo-200">
                <p class="text-xs font-semibold text-indigo-600 mb-1">Discounted Orders</p>
                <p class="text-2xl font-black text-indigo-900">${ordersWithDiscount.length}</p>
            </div>
            <div class="bg-yellow-50 p-4 rounded-xl border-2 border-yellow-200">
                <p class="text-xs font-semibold text-yellow-600 mb-1">Avg Discount</p>
                <p class="text-2xl font-black text-yellow-900">${formatPriceDisplay(avgDiscountCents)}</p>
            </div>
        </div>

        <!-- Top Codes & Monthly Activity -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-lg border-t-4 border-purple-500">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-lg font-bold text-purple-800">🏆 Top Performing Codes</h4>
                    <button onclick="window.module.downloadDiscountUsageCsv()"
                            class="px-3 py-1 bg-green-600 text-white rounded-lg text-xs font-bold hover:bg-green-700 shadow-md">
                        ⬇️ Export CSV
                    </button>
                </div>
                ${codePerformance.length === 0
                    ? '<p class="text-center py-6 text-gray-400 text-sm">No codes used yet.</p>'
                    : `<div class="space-y-3">${codePerformance.map((cp, idx) => {
                        const barWidth = Math.max(10, Math.round((cp.uses / codePerformance[0].uses) * 100));
                        return `
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-gray-400 w-5">#${idx + 1}</span>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-baseline mb-1">
                                        <span class="font-bold font-mono text-sm text-indigo-700 truncate">${escapeHtml(cp.code)}</span>
                                        <span class="text-xs text-gray-600 ml-2">${cp.uses} uses · ${formatPriceDisplay(cp.savedCents)}</span>
                                    </div>
                                    <div class="w-full bg-gray-100 rounded-full h-2">
                                        <div class="bg-gradient-to-r from-purple-500 to-indigo-500 h-2 rounded-full" style="width:${barWidth}%"></div>
                                    </div>
                                </div>
                            </div>`;
                    }).join('')}</div>`
                }
            </div>

            <div class="bg-white p-5 rounded-xl shadow-lg border-t-4 border-blue-500">
                <h4 class="text-lg font-bold text-blue-800 mb-4">📅 Monthly Activity</h4>
                ${Object.keys(monthlyUsage).length === 0
                    ? '<p class="text-center py-6 text-gray-400 text-sm">No monthly data yet.</p>'
                    : `<div class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">${Object.keys(monthlyUsage).sort().reverse().map(key => {
                        const data = monthlyUsage[key];
                        const [year, month] = key.split('-');
                        const monthName = new Date(parseInt(year), parseInt(month) - 1).toLocaleString('default', { month: 'short', year: 'numeric' });
                        return `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <span class="font-semibold text-sm text-gray-800">${monthName}</span>
                                <div class="flex gap-3">
                                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">${data.uses} uses</span>
                                    <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">${formatPriceDisplay(data.savedCents)}</span>
                                </div>
                            </div>`;
                    }).join('')}</div>`

        function downloadDiscountUsageCsv() {
            resetTimer();
            const headers = ['Code', 'Type', 'Value', 'Total Uses', 'Max Uses', 'Total Saved (USD)', 'Status', 'Created', 'Expires'];
            const now = new Date();

            const rows = state.discounts.map(d => {
                const isExpired = d.expiresAt && new Date(d.expiresAt) <= now;
                const isMaxed = d.maxUses > 0 && (d.currentUses || 0) >= d.maxUses;
                let status = 'Active';
                if (!d.enabled) status = 'Disabled';
                else if (isExpired) status = 'Expired';
                else if (isMaxed) status = 'Limit Reached';

                const totalSaved = ((d.usageLog || []).reduce((s, e) => s + (e.savedCents || 0), 0) / 100).toFixed(2);
                let typeValue = d.type === 'percentage' ? `${d.value}%` : d.type === 'fixed' ? `$${(d.value || 0).toFixed(2)}` : 'Free Shipping';

                return [
                    `"${d.code}"`, d.type, typeValue, d.currentUses || 0,
                    d.maxUses || 'Unlimited', totalSaved, status,
                    d.createdAt ? new Date(d.createdAt).toLocaleDateString() : 'N/A',
                    d.expiresAt ? new Date(d.expiresAt).toLocaleDateString() : 'Never'
                ].join(',');
            });

            const csvString = [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const filename = `Discount_Codes_${new Date().toISOString().slice(0, 10)}.csv`;

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showMessage('success', `Exported ${state.discounts.length} discounts to ${filename}.`, 5000, 'marketing');
            }
        }

        async function processRefund(orderId) {
            if (state.refundInProgress) return;
            resetTimer();

            const order = state.orders.find(o => o.id === orderId);
            if (!order) {
                showMessage('error', 'Order not found.', 3000, 'orders');
                return;
            }

            // Read form values
            const amountStr = document.getElementById('refundAmount')?.value;
            const reason = document.getElementById('refundReason')?.value;
            const note = document.getElementById('refundNote')?.value?.trim() || '';
            const restock = document.getElementById('refundRestock')?.checked || false;
            const isManual = document.getElementById('refundManual')?.checked || false;
            const msgEl = document.getElementById('refundMessage');

            // Validation
            if (!amountStr || parseFloat(amountStr) <= 0) {
                if (msgEl) msgEl.innerHTML = '<p class="text-red-600 text-sm font-semibold">❌ Please enter a valid refund amount.</p>';
                return;
            }
            if (!reason) {
                if (msgEl) msgEl.innerHTML = '<p class="text-red-600 text-sm font-semibold">❌ Please select a refund reason.</p>';
                return;
            }

            const amountCents = Math.round(parseFloat(amountStr) * 100);
            const totalPaid = getOrderTotalPaidCents(order);
            const totalRefunded = order.totalRefundedCents || 0;
            const refundable = totalPaid - totalRefunded;

            if (amountCents > refundable) {
                if (msgEl) msgEl.innerHTML = `<p class="text-red-600 text-sm font-semibold">❌ Amount exceeds refundable balance (${formatPriceDisplay(refundable)}).</p>`;
                return;
            }

            // Confirmation
            const isFullRefund = amountCents >= refundable;
            const confirmMsg = isFullRefund
                ? `Process FULL REFUND of ${formatPriceDisplay(amountCents)} for order #${order.orderNumber || orderId.substring(0, 8)}?\n\nThis cannot be undone.`
                : `Process PARTIAL REFUND of ${formatPriceDisplay(amountCents)} for order #${order.orderNumber || orderId.substring(0, 8)}?\n\n${formatPriceDisplay(refundable - amountCents)} will remain refundable.`;

            if (!confirm(confirmMsg)) return;

            // Lock UI
            state.refundInProgress = true;
            const submitBtn = document.getElementById('refundSubmitBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '⏳ Processing refund...';
            }
            if (msgEl) msgEl.innerHTML = '<p class="text-blue-600 text-sm">Processing refund with Stripe...</p>';

            try {
                let refundResult = { refundId: null, status: 'recorded' };

                // Determine if we can do a Stripe refund
                const paymentIntentId = order.stripePaymentIntentId || null;
                const chargeId = order.stripeChargeId || null;
                const hasStripePayment = !!(paymentIntentId || chargeId);

                if (hasStripePayment && !isManual) {
                    // Call Netlify function for Stripe refund
                    const stripeReason = ['duplicate', 'fraudulent', 'requested_by_customer'].includes(reason)
                        ? reason : 'requested_by_customer';

                    const response = await fetch('/.netlify/functions/processRefund', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            paymentIntentId,
                            chargeId,
                            amountCents,
                            reason: stripeReason,
                            orderId,
                            adminEmail: auth.currentUser?.email || 'admin'
                        })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        throw new Error(data.error || 'Stripe refund failed');
                    }

                    refundResult = {
                        refundId: data.refundId,
                        status: data.status,
                        amountRefunded: data.amountRefunded
                    };

                    console.log('✅ Stripe refund succeeded:', refundResult);
                } else {
                    // Manual refund — just record it in Firestore
                    console.log('📝 Recording manual refund (no Stripe)');
                    refundResult = { refundId: null, status: 'recorded' };
                }

                // Build refund record
                const refundRecord = {
                    refundId: refundResult.refundId || `manual_${Date.now()}`,
                    amountCents,
                    reason,
                    reasonDetail: note,
                    status: refundResult.status,
                    adminEmail: auth.currentUser?.email || 'admin',
                    restockedItems: restock,
                    isManual: !hasStripePayment || isManual,
                    createdAt: new Date().toISOString()
                };

                // Calculate new totals
                const newTotalRefunded = totalRefunded + amountCents;
                const newRefundStatus = newTotalRefunded >= totalPaid ? 'full' : newTotalRefunded > 0 ? 'partial' : 'none';

                // Determine new payment status
                let newPaymentStatus = order.paymentStatus;
                if (newRefundStatus === 'full') {
                    newPaymentStatus = 'Refunded';
                } else if (newRefundStatus === 'partial') {
                    newPaymentStatus = 'Partially Refunded';
                }

                // Update order in Firestore
                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                await updateDoc(orderRef, {
                    refunds: arrayUnion(refundRecord),
                    totalRefundedCents: newTotalRefunded,
                    refundStatus: newRefundStatus,
                    paymentStatus: newPaymentStatus,
                    updatedAt: serverTimestamp()
                });

                // Restock inventory if requested
                if (restock) {
                    await restockOrderItems(order, isFullRefund ? null : amountCents);
                }

                // Log admin action
                await logAdminAction('REFUND_PROCESSED', {
                    orderId,
                    orderNumber: order.orderNumber || orderId.substring(0, 8),
                    amountCents,
                    reason,
                    reasonDetail: note,
                    refundId: refundRecord.refundId,
                    isManual: refundRecord.isManual,
                    restocked: restock,
                    newRefundStatus,
                    newPaymentStatus
                }, orderId);
                try {
                    console.log('📧 Sending refund confirmation email...');

                    await fetch('/.netlify/functions/sendOrderConfirmation', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            orderId: order.id,
                            buyerEmail: order.buyerEmail,
                            buyerName: order.buyerName,
                            items: order.items,
                            totalCents: order.totalCents,
                            communicationLang: order.communicationLang || order.language || 'en',

                            // 🔄 This triggers refund mode in the Netlify function
                            refundData: {
                                amountCents: amountCents,
                                reason: reason,
                                reasonDetail: note,
                                refundId: refundRecord.refundId,
                                refundStatus: newRefundStatus,         // 'full' or 'partial'
                                totalRefundedCents: newTotalRefunded,
                                isManual: refundRecord.isManual
                            }
                        })
                    });

                    console.log('✅ Refund confirmation email sent');
                } catch (emailError) {
                    console.error('❌ Refund email failed (non-blocking):', emailError);
                    // Don't fail the refund if email fails
                }
                showMessage('success',
                    `Refund of ${formatPriceDisplay(amountCents)} processed successfully! ${restock ? '📦 Inventory restocked.' : ''}`,
                    5000, 'orders'
                );

                if (msgEl) msgEl.innerHTML = `<p class="text-green-600 text-sm font-semibold">✅ Refund processed! ${refundResult.refundId ? `Stripe ID: ${refundResult.refundId}` : 'Recorded as manual.'}</p>`;

                // Refresh the modal after a short delay
                setTimeout(() => {
                    const updatedOrder = state.orders.find(o => o.id === orderId);
                    if (updatedOrder) {
                        const refundContainer = document.getElementById('refundSectionContainer');
                        if (refundContainer) {
                            refundContainer.innerHTML = renderRefundSection(updatedOrder);
                        }
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ Refund error:', error);
                if (msgEl) msgEl.innerHTML = `<p class="text-red-600 text-sm font-semibold">❌ Refund failed: ${error.message}</p>`;
                showMessage('error', `Refund failed: ${error.message}`, 8000, 'orders');
            } finally {
                state.refundInProgress = false;
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '⚠️ Process Refund';
                }
            }
        }

        function getOrderTotalPaidCents(order) {
            // If the order has a payments array, sum it
            if (order.payments && Array.isArray(order.payments) && order.payments.length > 0) {
                return order.payments.reduce((sum, p) => sum + (p.amountCents || 0), 0);
            }
            // If paymentStatus is 'Paid', assume totalCents was paid
            if (order.paymentStatus === 'Paid') {
                return order.totalCents || 0;
            }
            // If partially paid, check for a paidAmount field
            if (order.paidAmountCents) {
                return order.paidAmountCents;
            }
            // Fallback: if they've had any Stripe activity, assume totalCents
            if (order.stripePaymentIntentId || order.stripeChargeId) {
                return order.totalCents || 0;
            }
            return 0;
        }

        /**
 * Formats refund reason codes into human-readable text.
 */
        function formatRefundReason(reason) {
            const reasonMap = {
                'requested_by_customer': 'Customer Request',
                'duplicate': 'Duplicate Charge',
                'fraudulent': 'Fraudulent',
                'defective_product': 'Defective Product',
                'wrong_item': 'Wrong Item Sent',
                'never_received': 'Never Received',
                'price_adjustment': 'Price Adjustment',
                'other': 'Other'
            };
            return reasonMap[reason] || reason;
        }

        /**
         * Restocks inventory for all items in the order.
         * For partial refunds, restocks proportionally (or all items if amount is null).
         */
        async function restockOrderItems(order, partialAmountCents) {
            if (!order.items || order.items.length === 0) return;

            try {
                for (const item of order.items) {
                    // For full refund (partialAmountCents === null), restock all quantities
                    // For partial, we still restock all items (admin can manually adjust)
                    const restockQty = item.quantity || 1;

                    const itemRef = doc(db, ITEMS_COLLECTION, item.id);
                    const itemSnap = await getDoc(itemRef);

                    if (itemSnap.exists()) {
                        const currentStock = itemSnap.data().stock || 0;
                        const newStock = currentStock + restockQty;

                        await updateDoc(itemRef, {
                            stock: newStock,
                            updatedAt: serverTimestamp()
                        });

                        console.log(`📦 Restocked: ${item.name} — ${currentStock} → ${newStock} (+${restockQty})`);
                    }
                }

                console.log('✅ All items restocked');
            } catch (error) {
                console.error('❌ Error restocking inventory:', error);
                showMessage('error', 'Refund processed but inventory restock failed. Please adjust manually.', 8000, 'orders');
            }
        }

        /**
         * Exports all refund records across all orders as a CSV.
         */
        function downloadRefundsCsv() {
            resetTimer();
            const rows = [['Order #', 'Order ID', 'Refund ID', 'Amount ($)', 'Reason', 'Detail', 'Status', 'Admin', 'Restocked', 'Date']];

            state.orders.forEach(order => {
                (order.refunds || []).forEach(r => {
                    rows.push([
                        order.orderNumber || order.id.substring(0, 8),
                        order.id,
                        r.refundId || 'manual',
                        (r.amountCents / 100).toFixed(2),
                        formatRefundReason(r.reason || 'unknown'),
                        `"${(r.reasonDetail || '').replace(/"/g, '""')}"`,
                        r.status || 'recorded',
                        r.adminEmail || 'admin',
                        r.restockedItems ? 'Yes' : 'No',
                        r.createdAt ? new Date(r.createdAt).toLocaleDateString() : ''
                    ]);
                });
            });

            if (rows.length === 1) {
                showMessage('error', 'No refund records to export.', 3000, 'orders');
                return;
            }

            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Refunds_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            showMessage('success', `Exported ${rows.length - 1} refund records.`, 3000, 'orders');
        }

        async function removeDuplicateVendorOrders() {
            const all = state.vendorOrders || [];

            // Group docs by supplier orderId
            const groups = new Map();
            all.forEach(order => {
                if (!order.orderId) return;
                if (!groups.has(order.orderId)) groups.set(order.orderId, []);
                groups.get(order.orderId).push(order);
            });

            // Find groups with more than one doc
            const dupes = [...groups.values()].filter(g => g.length > 1);

            if (dupes.length === 0) {
                alert('✅ No duplicate vendor orders found — your list is clean!');
                return;
            }

            const totalToDelete = dupes.reduce((sum, g) => sum + g.length - 1, 0);
            const preview = dupes.map(g => {
                // Keep rule: prefer Cancelled-Refunded, then latest timestamp
                const keep = g.reduce((best, cur) => {
                    if (cur.status === 'Cancelled - Refunded' && best.status !== 'Cancelled - Refunded') return cur;
                    if (cur.status !== 'Cancelled - Refunded' && best.status === 'Cancelled - Refunded') return best;
                    const curTs  = cur.updatedAt?.toMillis?.()  || cur.updatedAt  || cur.createdAt?.toMillis?.()  || cur.createdAt  || 0;
                    const bestTs = best.updatedAt?.toMillis?.() || best.updatedAt || best.createdAt?.toMillis?.() || best.createdAt || 0;
                    return curTs > bestTs ? cur : best;
                });
                const remove = g.filter(o => o.id !== keep.id);
                return { orderId: g[0].orderId, keep, remove };
            });

            const lines = preview.map(p =>
                `• Order ${p.orderId}: keep "${p.keep.status}" (doc ${p.keep.id.substring(0,8)}…), ` +
                `delete ${p.remove.length} duplicate${p.remove.length !== 1 ? 's' : ''}`
            ).join('\n');

            if (!confirm(
                `🗑️ Found ${dupes.length} duplicate group${dupes.length !== 1 ? 's' : ''} — ${totalToDelete} extra doc${totalToDelete !== 1 ? 's' : ''} will be deleted:\n\n${lines}\n\nProceed?`
            )) return;

            const btn = document.getElementById('removeDupesBtn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Cleaning…'; }

            try {
                const toDelete = preview.flatMap(p => p.remove);
                await Promise.all(toDelete.map(o => deleteDoc(doc(db, VENDOR_ORDERS_COLLECTION, o.id))));
                await logAdminAction('VENDOR_ORDER_DUPES_REMOVED', {
                    groupsFixed: dupes.length,
                    docsDeleted: totalToDelete,
                    orderIds: preview.map(p => p.orderId)
                });
                showMessage('success', `Removed ${totalToDelete} duplicate doc${totalToDelete !== 1 ? 's' : ''} across ${dupes.length} order${dupes.length !== 1 ? 's' : ''}.`, 5000, 'vendorOrder');
            } catch (err) {
                console.error('Dedup cleanup failed:', err);
                showMessage('error', `Cleanup failed: ${err.message}`, 5000, 'vendorOrder');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🧹 Remove Duplicates'; }
            }
        }

        /**
         * Triggered when the user edits the Subtotal field.

        function autoCalcUnitCost(triggerEl) {
            const row = triggerEl.closest('.item-row');
            if (!row) return;

            const qtyEl = row.querySelector('[name="itemQty[]"]');
            const subtotalEl = row.querySelector('[name="itemSubtotal[]"]');
            const unitCostEl = row.querySelector('[name="itemUnitCost[]"]');

            const qty = parseFloat(qtyEl?.value) || 0;
            const subtotal = parseFloat(subtotalEl?.value) || 0;

            if (qty > 0 && subtotal > 0) {
                const unitCost = subtotal / qty;
                if (unitCostEl) unitCostEl.value = unitCost.toFixed(4); // 4 decimals for precision
            } else if (qty > 0 && subtotal === 0) {
                // Cleared subtotal — clear unit cost too
                if (unitCostEl) unitCostEl.value = '';
            }

            recalculateVendorOrderTotal();
        }

        /**
         * Triggered when the user edits the Unit Cost field directly.
         * Multiplies unitCost × qty to update the subtotal field.
         */
        function autoCalcSubtotal(triggerEl) {
            const row = triggerEl.closest('.item-row');
            if (!row) return;

            const qtyEl = row.querySelector('[name="itemQty[]"]');
            const subtotalEl = row.querySelector('[name="itemSubtotal[]"]');
            const unitCostEl = row.querySelector('[name="itemUnitCost[]"]');

            const qty = parseFloat(qtyEl?.value) || 0;
            const unitCost = parseFloat(unitCostEl?.value) || 0;

            if (qty > 0 && unitCost > 0) {
                if (subtotalEl) subtotalEl.value = (qty * unitCost).toFixed(2);
            } else {
                if (subtotalEl) subtotalEl.value = '';
            }

            recalculateVendorOrderTotal();
        }

        function normalizeVendorOrder(order) {
            if (order._normalized) return order;

            const fromCentsOrDollars = (centsField, dollarsField) => {
                if (order[centsField] != null) return order[centsField] / 100;
                if (order[dollarsField] != null) return parseFloat(order[dollarsField]) || 0;
                return 0;
            };

            const orderCost = fromCentsOrDollars('subtotalCents', 'orderCost');
            const shippingCost = fromCentsOrDollars('shippingCostCents', 'shippingCost');
            const tariffs = fromCentsOrDollars('tariffCostCents', 'tariffs');
            const processingFee = fromCentsOrDollars('processingFeeCents', 'processingFee'); // ✅ fixed
            const salesTax = fromCentsOrDollars('salesTaxCents', 'salesTax');      // ✅ fixed
            const landedCost = orderCost + shippingCost + tariffs + processingFee + salesTax;

            const items = (order.items || []).map(item => ({
                productId: item.productId || item.id || '',
                name: item.productName || item.name || '',
                sku: item.sku || '',
                quantity: parseInt(item.quantity || 0),
                unitCost: item.unitPriceCents != null ? item.unitPriceCents / 100
                    : parseFloat(item.unitCost || 0),
                subtotal: item.totalPriceCents != null ? item.totalPriceCents / 100
                    : parseFloat(item.subtotal || 0),
            }));

            return {
                ...order,
                orderCost,
                shippingCost,
                tariffs,
                processingFee,
                salesTax,
                landedCost,
                items,
                orderLink: order.supplierOrderUrl || order.orderLink || null,
                trackingNumber: order.trackingNumber || null,
                orderDate: order.orderDate || null,
                expectedDelivery: order.expectedDeliveryDate || order.expectedDelivery || null,
                notes: order.notes || null,
                status: order.status || 'pending',
                supplier: order.supplier || 'N/A',
                orderNumber: order.orderNumber || order.orderId || order.id,
                _normalized: true,
            };
        }

        async function saveVendorOrder(editOrderId = null) {
            const form = document.getElementById('vendorOrderForm');
            if (!form) return;

            const getValue = (name) => form.querySelector(`[name="${name}"]`)?.value?.trim() || '';
            const getNumber = (name) => parseFloat(form.querySelector(`[name="${name}"]`)?.value || 0) || 0;

            // Validation
            const supplier = getValue('supplier');
            if (!supplier) {
                showMessage('error', 'Supplier name is required.', 3000, 'vendorOrder');
                return;
            }

            // Collect item rows
            const rows = form.querySelectorAll('.item-row');
            const items = [];
            rows.forEach(row => {
                const productSelect = row.querySelector('[name="itemProductId[]"]');
                const qtyInput = row.querySelector('[name="itemQty[]"]');
                const costInput = row.querySelector('[name="itemUnitCost[]"]');
                const subtotalInput = row.querySelector('[name="itemSubtotal[]"]');

                const productId = productSelect?.value;
                const qty = parseInt(qtyInput?.value || 0);
                const unitCost = parseFloat(costInput?.value || 0); // dollars
                const subtotal = parseFloat(subtotalInput?.value || (qty * unitCost).toFixed(2));

                if (productId && qty > 0) {
                    const product = state.items?.find(i => i.id === productId);
                    items.push({
                        productId,
                        productName: product?.name || '',
                        sku: product?.sku || '',
                        quantity: qty,
                        // Store in cents to match existing Firestore schema
                        unitPriceCents: Math.round(unitCost * 100),
                        totalPriceCents: Math.round(subtotal * 100),
                    });
                }
            });

            // Read dollar values from form → convert to cents for storage
            const subtotalDollars = getNumber('orderCost');
            const shippingDollars = getNumber('shippingCost');
            const tariffDollars = getNumber('tariffs');
            const tariffRate = getNumber('tariffRate'); // percentage, store as-is
            const processingFeeDollars = getNumber('processingFee');
            const salesTaxDollars = getNumber('salesTax');

            const subtotalCents = Math.round(subtotalDollars * 100);
            const shippingCostCents = Math.round(shippingDollars * 100);
            const tariffCostCents = Math.round(tariffDollars * 100);
            const processingFeeCents = Math.round(processingFeeDollars * 100);
            const salesTaxCents = Math.round(salesTaxDollars * 100);
            const totalCostCents = subtotalCents + shippingCostCents + tariffCostCents
                + processingFeeCents + salesTaxCents;

            const orderData = {
                supplier,
                orderId: getValue('orderId') || null,
                supplierOrderUrl: getValue('orderLink') || null,
                status: getValue('status') || 'Ordered',
                orderDate: getValue('orderDate') || null,
                expectedDeliveryDate: getValue('expectedDelivery') || null,
                trackingNumber: getValue('trackingNumber') || null,
                notes: getValue('notes') || null,
                items,

                // Cents-based schema — matches existing Firestore documents
                subtotalCents,
                shippingCostCents,
                tariffCostCents,
                tariffRate: tariffRate || null,
                processingFeeCents,
                salesTaxCents,
                totalCostCents,

                // Cancellation / refund fields (only meaningful when status = Cancelled - Refunded)
                cancelReason: getValue('cancelReason') || null,
                refundDate: getValue('refundDate') || null,
                refundedAmountCents: getValue('refundedAmount')
                    ? Math.round(parseFloat(getValue('refundedAmount')) * 100)
                    : totalCostCents,  // default = full order cost
                refundReference: getValue('refundReference') || null,

                updatedAt: serverTimestamp(),
            };

            try {
                if (editOrderId) {
                    // Uses global VENDOR_ORDERS_COLLECTION — no local override
                    const docRef = doc(db, VENDOR_ORDERS_COLLECTION, editOrderId);
                    await updateDoc(docRef, orderData);
                    showMessage('success', 'Vendor order updated successfully.', 3000, 'vendorOrder');
                    await logAdminAction('VENDOR_ORDER_UPDATED', { supplier, editOrderId }, editOrderId);
                } else {
                    orderData.createdAt = serverTimestamp();
                    const docRef = await addDoc(collection(db, VENDOR_ORDERS_COLLECTION), orderData);
                    showMessage('success', 'Vendor order created successfully.', 3000, 'vendorOrder');
                    await logAdminAction('VENDOR_ORDER_CREATED', { supplier }, docRef.id);
                }

                closeVendorOrderModal();

                // Clear any active search/filter so the full list is visible after saving
                state.vendorOrderFilters = { searchTerm: '', supplier: 'all', status: 'all', sortBy: 'date-desc' };

                refreshVendorOrders();

                // Also reset the normal-view filter inputs if they're in the DOM
                const searchInput = document.querySelector('input[oninput*="handleVendorOrderSearch"]');
                if (searchInput) searchInput.value = '';
                const supplierSelect = document.querySelector('select[onchange*="handleVendorOrderSupplierFilter"]');
                if (supplierSelect) supplierSelect.value = 'all';
                const statusSelect = document.querySelector('select[onchange*="handleVendorOrderStatusFilter"]');
                if (statusSelect) statusSelect.value = 'all';
                const sortSelect = document.querySelector('select[onchange*="handleVendorOrderSort"]');
                if (sortSelect) sortSelect.value = 'date-desc';

            } catch (error) {
                console.error('Error saving vendor order:', error);
                showMessage('error', `Failed to save order: ${error.message}`, 5000, 'vendorOrder');
            }
        }

            updateActiveFilters: function () {
                const display = document.getElementById('activeFiltersDisplay');
                const tagsContainer = document.getElementById('activeFilterTags');

                if (!display || !tagsContainer) return;

                const activeTags = [];

                // Time filter
                if (state.salesTimeFilter !== 'all') {
                    const labels = {
                        'lastmonth': 'Last Month',
                        'last6months': 'Last 6 Months',
                        'lastyear': 'Last Year',
                        'custom': 'Custom Range'
                    };
                    activeTags.push(`📅 ${labels[state.salesTimeFilter] || state.salesTimeFilter}`);
                }

                // Year filter
                if (state.salesFilters.year !== 'all') {
                    activeTags.push(`📆 ${state.salesFilters.year}`);
                }

                // Month filter
                if (state.salesFilters.month !== 'all') {
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    activeTags.push(`📅 ${months[parseInt(state.salesFilters.month)]}`);
                }

                // Category filter
                if (state.salesFilters.category !== 'all') {
                    const cat = state.catalogs.find(c => c.id === state.salesFilters.category);
                    if (cat) activeTags.push(`🏷️ ${cat.name}`);
                }

                // Product filter
                if (state.salesFilters.product !== 'all') {
                    const prod = state.items.find(i => i.id === state.salesFilters.product);
                    if (prod) activeTags.push(`📦 ${prod.name}`);
                }

                // Payment filter
                if (state.salesFilters.paymentStatus !== 'all') {
                    const label = state.salesFilters.paymentStatus === 'paid' ? 'Paid Only' : 'Unpaid Only';
                    activeTags.push(`💰 ${label}`);
                }

                // Custom dates
                if (state.salesFilters.customStartDate) {
                    activeTags.push(`From: ${state.salesFilters.customStartDate}`);
                }
                if (state.salesFilters.customEndDate) {
                    activeTags.push(`To: ${state.salesFilters.customEndDate}`);
                }

                if (activeTags.length > 0) {
                    tagsContainer.innerHTML = activeTags.map(tag => `
                        <span class="px-3 py-1 bg-indigo-600 text-white text-xs rounded-full font-semibold shadow-md">
                            ${tag}
                        </span>
                    `).join('');
                    display.classList.remove('hidden');
                } else {
                    display.classList.add('hidden');
                }
            },

            fetchExternalOrders: async function () {
                try {
                    await waitForElement('externalOrdersTableBody');

                    const idToken = await auth.currentUser.getIdToken();
                    const response = await fetch(GET_EXTERNAL_ORDERS, {
                        headers: {
                            'Authorization': `Bearer ${idToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) throw new Error('Failed to fetch external orders');

                    const data = await response.json();
                    const orders = data.orders || [];

                    // Merge financial data from Firestore (qty, shippingCharged, transactionCost, vendorCostPerUnit)
                    try {
                        const pricingSnap = await getDocs(collection(db, EXTERNAL_ORDER_PRICING_COLLECTION));
                        const pricingMap = {};
                        pricingSnap.forEach(d => { pricingMap[d.id] = d.data(); });

                        allExternalOrders = orders.map(order => {
                            const pricing = pricingMap[order.id] || {};
                            return {
                                ...order,
                                quantity:         pricing.quantity         ?? order.quantity         ?? 1,
                                shippingCharged:  pricing.shippingCharged  ?? order.shippingCharged  ?? 0,
                                transactionCost:  pricing.transactionCost  ?? order.transactionCost  ?? 0,
                                vendorCostPerUnit: pricing.vendorCostPerUnit ?? order.vendorCostPerUnit ?? null,
                                productId:        pricing.productId        ?? order.productId        ?? null,
                            };
                        });
                    } catch (e) {
                        console.warn('Could not load pricing data from Firestore:', e);
                        allExternalOrders = orders;
                    }

                    window.module.renderExternalOrders();
                    window.module.updateExternalOrderStats();
                } catch (error) {
                    console.error('Error fetching external orders:', error);
                    const tbody = document.getElementById('externalOrdersTableBody');
                    if (tbody) {
                        tbody.innerHTML = `<tr><td colspan="12" class="px-4 py-8 text-center text-red-500">
                            Error loading orders. Please refresh the page.
                        </td></tr>`;
                    }
                }
            },

            renderExternalOrders: function () {
                const tbody = document.getElementById('externalOrdersTableBody');

                // ✅ Add safety check
                if (!tbody) {
                    console.warn('External orders table body not found in DOM');
                    return;
                }

                if (allExternalOrders.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="12" class="px-4 py-8 text-center text-gray-500">
                            No external orders found. Click "Add Order" to create one.
                        </td></tr>
                    `;
                    return;
                }

                const filteredOrders = window.module.getFilteredExternalOrders();

                if (filteredOrders.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="12" class="px-4 py-8 text-center text-gray-500">
                            No orders match your filters.
                        </td></tr>
                    `;
                    return;
                }

                tbody.innerHTML = filteredOrders.map(order => {
                    const statusColors = {
                        'Pending': 'bg-yellow-100 text-yellow-800',
                        'Processing': 'bg-blue-100 text-blue-800',
                        'Shipped': 'bg-purple-100 text-purple-800',
                        'Delivered': 'bg-green-100 text-green-800',
                        'Cancelled': 'bg-red-100 text-red-800'
                    };

                    const qty              = Number(order.quantity)         || 1;
                    const salePriceUnit    = Number(order.amount)           || 0;
                    const shippingCost     = Number(order.shippingCharged)  || 0; // we pay shipping
                    const transactionCost  = Number(order.transactionCost)  || 0;
                    const vendorCostUnit   = Number(order.vendorCostPerUnit) || 0;

                    const totalRevenue     = salePriceUnit * qty;
                    const totalVendorCost  = vendorCostUnit * qty;
                    const netProfit        = totalRevenue - totalVendorCost - transactionCost - shippingCost;
                    const profitPerUnit    = qty > 0 ? netProfit / qty : 0;

                    // Pre-compute profit cell HTML outside nested template to avoid parsing issues
                    let profitCellHtml;
                    if (salePriceUnit > 0 || vendorCostUnit > 0) {
                        const profitColor = netProfit > 0 ? 'text-green-700' : netProfit < 0 ? 'text-red-600' : 'text-gray-500';
                        profitCellHtml = '<div class="font-bold ' + profitColor + '">$' + netProfit.toFixed(2) + '</div>'
                            + '<div class="text-xs text-gray-400">$' + profitPerUnit.toFixed(2) + '/unit</div>';
                    } else {
                        profitCellHtml = '<span class="text-gray-300 text-sm">—</span>';
                    }

                    // Trim trailing zeros: 2.3400 → $2.34, 2.5000 → $2.50
                    const fmtVendor = v => '$' + parseFloat(v.toFixed(4)).toFixed(2);
                    const vendorCellHtml = vendorCostUnit > 0

                        ${order.status}

                <td class="px-4 py-3 text-sm font-semibold">${salePriceUnit > 0 ? '$' + salePriceUnit.toFixed(2) : '—'}</td>
                <td class="px-4 py-3 text-sm">${vendorCellHtml}</td>
                <td class="px-4 py-3 text-sm ${transactionCost > 0 ? 'text-red-600' : 'text-gray-300'}">${feeCellHtml}</td>
                <td class="px-4 py-3">${profitCellHtml}</td>
                <td class="px-4 py-3">
                    <div class="flex space-x-2">
                        <button onclick="window.module.editExternalOrder('${order.id}')" 
                                class="text-blue-600 hover:text-blue-800" title="Edit">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>

                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
