        /**
         * Validates and stages a discount code for the order being edited.
         * The discount is NOT saved to Firestore until "Save All Changes" is clicked.
         */
        function applyEditOrderDiscount(orderId) {
            resetTimer();
            const codeInput = document.getElementById('editOrderDiscountCode');
            const code = codeInput?.value?.trim();
            const msgEl = document.getElementById('editDiscountMessage');

            if (!code) {
                if (msgEl) msgEl.innerHTML = '<p class="text-red-600 text-sm mt-1">❌ Please enter a discount code.</p>';
                return;
            }

            // Build cart items from draft cart
            const cartItems = Object.values(state.editingOrderDraftCart || {}).map(entry => ({
                item: entry.item,
                quantity: entry.quantity,
                id: entry.item.id
            }));

            if (cartItems.length === 0) {
                if (msgEl) msgEl.innerHTML = '<p class="text-red-600 text-sm mt-1">❌ Order has no items. Add items first.</p>';
                return;
            }

            const subtotalCents = cartItems.reduce((sum, e) => sum + (e.item.price * e.quantity), 0);

            // Use existing validateDiscount function
            const result = validateDiscount(code, cartItems, subtotalCents);

            if (msgEl) {
                msgEl.innerHTML = result.valid
                    ? `<p class="text-green-700 text-sm font-semibold mt-1">${result.message}</p>`
                    : `<p class="text-red-600 text-sm font-semibold mt-1">❌ ${result.message}</p>`;
            }

            if (result.valid) {
                // Stage the discount — will be saved when user clicks "Save All Changes"
                state.editingOrderDiscount = {
                    ...result.discount,
                    savedCents: result.savedCents
                };

                // Re-render the modal to show the pending discount
                const order = state.orders.find(o => o.id === orderId);
                if (order) {
                    refreshEditModalDiscountSection(order);
                    updateEditModalTotals(order);
                }

                showMessage('success', `Discount "${code}" staged. Click "Save All Changes" to apply.`, 3000, 'orders');
            } else {
                state.editingOrderDiscount = null;
            }
        }

        /**
         * Clears a pending (not yet saved) discount from the edit modal.
         */
        function clearEditOrderDiscount() {
            resetTimer();
            state.editingOrderDiscount = null;

            const order = state.orders.find(o => o.id === state.editingOrderId);
            if (order) {
                refreshEditModalDiscountSection(order);
                updateEditModalTotals(order);
            }

            const msgEl = document.getElementById('editDiscountMessage');
            if (msgEl) msgEl.innerHTML = '<p class="text-blue-600 text-sm mt-1">Discount removed.</p>';
        }

        /**
         * Removes an EXISTING (already saved) discount from an order.
         * This immediately updates Firestore — no need to click "Save All Changes".
         */
        async function removeEditOrderDiscount(orderId) {
            if (!confirm('Remove the discount from this order? The order total will be recalculated.')) return;
            resetTimer();

            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            try {
                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                // Recalculate totals without discount
                const itemsSubtotal = (order.items || []).reduce((sum, item) => {
                    const data = getSafeItemData(item);
                    return sum + (data.price * data.quantity);
                }, 0);

                const shippingCents = order.shippingCents || 0;
                const taxCents = order.taxCents || 0;
                const newTotal = itemsSubtotal + shippingCents + taxCents;

                const oldDiscount = order.discount;
                const oldDiscountCents = order.discountCents || oldDiscount?.savedCents || 0;

                await updateDoc(orderRef, {
                    discount: null,
                    discountCents: 0,
                    subtotalCents: itemsSubtotal,
                    totalCents: newTotal,
                    updatedAt: serverTimestamp()
                });

                await logAdminAction('ORDER_DISCOUNT_REMOVED', {
                    orderId,
                    removedCode: oldDiscount?.code || 'Unknown',
                    removedSavedCents: oldDiscountCents,
                    newTotal
                }, orderId);

                showMessage('success', `Discount "${oldDiscount?.code || ''}" removed. Order total updated to ${formatPriceDisplay(newTotal)}.`, 5000, 'orders');

                // Refresh the modal
                closeEditModal();

            } catch (error) {
                console.error('Error removing discount:', error);
                showMessage('error', `Failed to remove discount: ${error.message}`, 5000, 'orders');
            }
        }


        // ─────────────────────────────────────────────────────────────────────────────
        // HELPER: Refresh just the discount section of the modal without full re-render
        // ─────────────────────────────────────────────────────────────────────────────

        function refreshEditModalDiscountSection(order) {
            const discountContainer = document.getElementById('editOrderDiscountContainer');
            if (discountContainer) {
                discountContainer.innerHTML = renderEditOrderDiscountSection(order);
            }
        }

        /**
         * Updates the pricing breakdown in the edit modal to reflect discount changes.
         */
        function updateEditModalTotals(order) {
            const subtotalEl = document.getElementById('editOrderSubtotal');
            const totalEl = document.getElementById('editOrderTotal');
            if (!subtotalEl || !totalEl) return;

            const draftItems = Object.values(state.editingOrderDraftCart || {});
            const subtotalCents = draftItems.reduce((sum, e) => sum + (e.item.price * e.quantity), 0);

            const shippingCents = Math.round((parseFloat(document.getElementById('editShippingCents')?.value) || 0) * 100);
            const taxCents = Math.round((parseFloat(document.getElementById('editTaxCents')?.value) || 0) * 100);

            // Determine active discount
            const discountCents = state.editingOrderDiscount?.savedCents
                || order.discountCents
                || order.discount?.savedCents
                || 0;

            const discountedSubtotal = Math.max(0, subtotalCents - discountCents);
            const grandTotal = discountedSubtotal + shippingCents + taxCents;

            subtotalEl.textContent = formatPriceDisplay(subtotalCents);
            totalEl.textContent = formatPriceDisplay(grandTotal);
        }

        async function handleResendReceipt(orderId) {
            resetTimer();
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            try {
                await fetch(RECEIPT_EMAIL_CONFIRMATION_FUNCTION, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, order })
                });
                logEmailNotification('receipt_resent', orderId,
                    order.buyerEmail, order.buyerName,
                    { orderNumber: order.orderNumber || orderId.substring(0,8) });
                showMessage('success', 'Receipt resent successfully!', 3000, 'orders');
            } catch (error) {
                showMessage('error', 'Failed to resend receipt', 3000, 'orders');
            }
        }

            return `

        function renderFinancialRows() {

                    const balanceCents = order.totalCents - totalPaidCents;
                    const isPaid = balanceCents <= 0;

                    const paymentMethods = payments.length > 0
                        ? [...new Set(payments.map(p => p.method))].join(', ')
                        : 'None';

                    return `
                        <tr class="${paidClass} hover:shadow-md transition">
                            <td class="p-3 text-sm font-mono">${order.orderNumber || order.id.substring(0, 8)}</td>
                            <td class="p-3 text-sm">${escapeHtml(order.buyerName || 'N/A')}</td>

                            <td class="p-3 text-sm font-semibold text-green-700">${formatPriceDisplay(totalPaidCents)}</td>
                            <td class="p-3 text-sm font-semibold ${balanceCents > 0 ? 'text-red-700' : 'text-green-700'}">
                                ${formatPriceDisplay(balanceCents)}
                            </td>
                            <td class="p-3 text-sm">${paidBadge}</td>

        function downloadPaymentLedgerCsv() {
            const csvData = [
                ['Order ID', 'Customer', 'Email', 'Total', 'Paid', 'Balance', 'Payment Status', 'Payment Methods', '# Payments', 'Order Date', 'Order Status'].join(','),
                ...state.orders
                    .filter(o => o.status !== 'Cancelled')
                    .map(o => {
                        const payments = o.payments || [];
                        const totalPaidCents = payments.reduce((sum, p) => sum + (p.amountCents || 0), 0);
                        const balanceCents = o.totalCents - totalPaidCents;
                        const paymentMethods = payments.length > 0
                            ? [...new Set(payments.map(p => p.method))].join('; ')
                            : 'None';

                        return [
                            o.orderNumber || o.id.substring(0, 8),
                            `"${(o.buyerName || 'N/A').replace(/"/g, '""')}"`,
                            `"${(o.buyerEmail || 'N/A').replace(/"/g, '""')}"`,
                            (o.totalCents / 100).toFixed(2),
                            (totalPaidCents / 100).toFixed(2),
                            (balanceCents / 100).toFixed(2),
                            balanceCents <= 0 ? 'Paid' : 'Unpaid',
                            `"${paymentMethods}"`,
                            payments.length,
                            formatTime(o.createdAt),
                            o.status
                        ].join(',');
                    })
            ].join('\n');

            const blob = new Blob([csvData], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `payment_ledger_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();

            showMessage('success', 'Payment ledger exported successfully!', 3000, 'financials');
        }

        async function addPaymentToOrder(orderId) {
            resetTimer();

            const amountInput = document.getElementById('newPaymentAmount');
            const methodSelect = document.getElementById('newPaymentMethod');
            const dateInput = document.getElementById('newPaymentDate');
            const referenceInput = document.getElementById('newPaymentReference');
            const notesInput = document.getElementById('newPaymentNotes');

            const amountDollars = parseFloat(amountInput?.value || 0);
            const method = methodSelect?.value;
            const date = dateInput?.value;
            const reference = referenceInput?.value?.trim();
            const notes = notesInput?.value?.trim();

            if (amountDollars <= 0) {
                showMessage('error', 'Please enter a valid payment amount', 3000, 'orders');
                return;
            }

            if (!method) {
                showMessage('error', 'Please select a payment method', 3000, 'orders');
                return;
            }

            try {
                const order = state.orders.find(o => o.id === orderId);
                if (!order) throw new Error('Order not found');

                const amountCents = Math.round(amountDollars * 100);

                const newPayment = {
                    amountCents: amountCents,
                    method: method,
                    date: date || new Date().toISOString(),
                    reference: reference || null,
                    notes: notes || null,
                    recordedBy: auth.currentUser?.email || 'Unknown',
                    recordedAt: new Date().toISOString()
                };

                const currentPayments = order.payments || [];
                const updatedPayments = [...currentPayments, newPayment];

                // Calculate new totals
                const totalPaidCents = updatedPayments.reduce((sum, p) => sum + p.amountCents, 0);
                const isPaid = totalPaidCents >= order.totalCents;

                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                await updateDoc(orderRef, {
                    payments: updatedPayments,
                    isPaid: isPaid,
                    paidCents: totalPaidCents,
                    updatedAt: serverTimestamp()
                });

                await logAdminAction('PAYMENT_ADDED', {
                    orderId,
                    payment: newPayment,
                    totalPaid: formatPriceDisplay(totalPaidCents),
                    isPaid
                }, orderId);

                showMessage('success', `Payment of ${formatPriceDisplay(amountCents)} recorded successfully!`, 3000, 'orders');

                // Clear form
                amountInput.value = '';
                methodSelect.value = '';
                referenceInput.value = '';
                notesInput.value = '';
                dateInput.value = new Date().toISOString().split('T')[0];

                // Re-render modal with updated payment data
                showOrderEditForm(orderId);

            } catch (error) {
                console.error('Error adding payment:', error);
                showMessage('error', `Failed to add payment: ${error.message}`, 5000, 'orders');
            }
        }

        function getFilteredVendorOrders() {
            let orders = state.vendorOrders || [];

            // Deduplicate by supplier orderId — keep the most authoritative doc:
            // prefer 'Cancelled - Refunded' status; otherwise keep the latest updatedAt/createdAt
            const seen = new Map();
            orders.forEach(order => {
                const key = order.orderId; // supplier order number (e.g. "292451222501029840")
                if (!key) return;          // no orderId = can't dedup, always show
                const existing = seen.get(key);
                if (!existing) {
                    seen.set(key, order);
                    return;
                }
                // Prefer Cancelled-Refunded as it's the terminal state
                const currentIsCancelled = order.status === 'Cancelled - Refunded';
                const existingIsCancelled = existing.status === 'Cancelled - Refunded';
                if (currentIsCancelled && !existingIsCancelled) {
                    seen.set(key, order);
                    return;
                }
                if (!currentIsCancelled && existingIsCancelled) return;
                // Both same status — keep whichever was updated most recently
                const currentTs = order.updatedAt?.toMillis?.() || order.updatedAt || order.createdAt?.toMillis?.() || order.createdAt || 0;
                const existingTs = existing.updatedAt?.toMillis?.() || existing.updatedAt || existing.createdAt?.toMillis?.() || existing.createdAt || 0;
                if (currentTs > existingTs) seen.set(key, order);
            });
            // Rebuild orders: deduped entries + any that had no orderId
            orders = [
                ...seen.values(),
                ...orders.filter(o => !o.orderId)
            ];

            // Apply search filter
            if (state.vendorOrderFilters?.searchTerm) {
                const term = state.vendorOrderFilters.searchTerm.toLowerCase();
                orders = orders.filter(order =>
                    (order.orderId || '').toLowerCase().includes(term) ||
                    (order.supplier || '').toLowerCase().includes(term) ||
                    (order.items || []).some(item =>
                        (item.productName || '').toLowerCase().includes(term) ||
                        (item.sku || '').toLowerCase().includes(term)
                    )
                );
            }

            // Apply supplier filter
            if (state.vendorOrderFilters?.supplier && state.vendorOrderFilters.supplier !== 'all') {
                orders = orders.filter(order => order.supplier === state.vendorOrderFilters.supplier);
            }

            // Apply status filter
            if (state.vendorOrderFilters?.status && state.vendorOrderFilters.status !== 'all') {
                orders = orders.filter(order => order.status === state.vendorOrderFilters.status);
            }

            // Apply sorting
            const sortBy = state.vendorOrderFilters?.sortBy || 'date-desc';
            orders.sort((a, b) => {
                switch (sortBy) {
                    case 'date-desc':
                        return new Date(b.orderDate || 0) - new Date(a.orderDate || 0);
                    case 'date-asc':
                        return new Date(a.orderDate || 0) - new Date(b.orderDate || 0);
                    case 'cost-desc':
                        return (b.totalCostCents || 0) - (a.totalCostCents || 0);
                    case 'cost-asc':
                        return (a.totalCostCents || 0) - (b.totalCostCents || 0);
                    default:
                        return 0;
                }
            });

            return orders;
        }

        function handleVendorOrderSearch(e) {

        function handleVendorOrderSort(e) {

        function handleProductSelect(selectElement, rowId) {
            const row = document.getElementById(rowId);
            if (!row) return;

            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const productId = selectElement.value;
            const productName = selectedOption.getAttribute('data-name') || '';
            const productSku = selectedOption.getAttribute('data-sku') || '';

            row.querySelector('.order-item-id').value = productId;
            row.querySelector('.order-item-name').value = productName;
            row.querySelector('.order-item-sku').value = productSku;

            // Try to prefill price from catalog
            const item = state.items?.find(i => i.id === productId);
            if (item && item.purchasePriceCents) {
                row.querySelector('.order-item-price').value = (item.purchasePriceCents / 100).toFixed(2);
            }

            recalculateVendorOrderTotal();
        }

        function recalculateVendorOrderTotal() {
            const form = document.getElementById('vendorOrderForm');
            if (!form) return;

            const getNum = (name) => parseFloat(form.querySelector(`[name="${name}"]`)?.value || 0) || 0;
            const fmt = (val) => `$${val.toFixed(2)}`;

            const orderCost = getNum('orderCost');
            const shippingCost = getNum('shippingCost');
            const tariffs = getNum('tariffs');
            const processingFee = getNum('processingFee');
            const salesTax = getNum('salesTax');
            const tariffRate = getNum('tariffRate');

            const total = orderCost + shippingCost + tariffs + processingFee + salesTax;

            // Main total
            const totalEl = document.getElementById('vendorOrderLandedCost');
            if (totalEl) totalEl.textContent = fmt(total);

            // Individual line items
            const set = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.textContent = fmt(val);
            };

            set('vo_subtotalDisplay', orderCost);
            set('vo_shippingDisplay', shippingCost);
            set('vo_tariffDisplay', tariffs);

            // Tariff rate badge next to label
            const rateLabel = document.getElementById('vo_tariffRateDisplay');
            if (rateLabel) {
                rateLabel.textContent = tariffRate > 0 ? `(${tariffRate.toFixed(2)}%)` : '';
            }

            // Processing fee row — show/hide
            const pfRow = document.getElementById('vo_processingFeeRow');
            if (pfRow) {
                pfRow.classList.toggle('hidden', processingFee <= 0);
                pfRow.classList.toggle('flex', processingFee > 0);
            }
            set('vo_processingFeeDisplay', processingFee);

            // Sales tax row — show/hide
            const taxRow = document.getElementById('vo_salesTaxRow');
            if (taxRow) {
                taxRow.classList.toggle('hidden', salesTax <= 0);
                taxRow.classList.toggle('flex', salesTax > 0);
            }
            set('vo_salesTaxDisplay', salesTax);
        }

        async function removePayment(orderId, paymentIndex) {
            resetTimer();

            if (!confirm('Are you sure you want to remove this payment record?')) {
                return;
            }

            try {
                const order = state.orders.find(o => o.id === orderId);
                if (!order) throw new Error('Order not found');

                const payments = order.payments || [];
                const removedPayment = payments[paymentIndex];

                const updatedPayments = payments.filter((_, idx) => idx !== paymentIndex);
                const totalPaidCents = updatedPayments.reduce((sum, p) => sum + p.amountCents, 0);
                const isPaid = totalPaidCents >= order.totalCents;

                const targetId = order.uid || order.userId || order.createdByAdmin || 'guest';
                const path = getOrdersCollectionPath(targetId);
                const orderRef = doc(db, path, orderId);

                await updateDoc(orderRef, {
                    payments: updatedPayments,
                    isPaid: isPaid,
                    paidCents: totalPaidCents,
                    updatedAt: serverTimestamp()
                });

                await logAdminAction('PAYMENT_REMOVED', {
                    orderId,
                    removedPayment,
                    totalPaid: formatPriceDisplay(totalPaidCents)
                }, orderId);

                showMessage('success', 'Payment record removed', 3000, 'orders');

                // Re-render modal
                showOrderEditForm(orderId);

            } catch (error) {
                console.error('Error removing payment:', error);
                showMessage('error', `Failed to remove payment: ${error.message}`, 5000, 'orders');
            }
        }

        // --- SHIPPING FUNCTIONS ---
        async function fetchShippingRates(orderId) {
            console.log('🚀 fetchShippingRates called with orderId:', orderId);
            resetTimer();

            const order = state.orders.find(o => o.id === orderId);
            if (!order) {
                showMessage('error', 'Order not found', 3000, 'orders');
                return;
            }

            const weight = parseFloat(document.getElementById('packageWeight')?.value || 1);
            const length = parseFloat(document.getElementById('packageLength')?.value || 12);
            const width = parseFloat(document.getElementById('packageWidth')?.value || 8);
            const height = parseFloat(document.getElementById('packageHeight')?.value || 6);

            if (!weight || weight <= 0) {
                showMessage('error', 'Please enter a valid package weight', 3000, 'orders');
                return;
            }

            // ✅ Parse Google Maps format: "street, city, state, country"
            const addressParts = (order.deliveryAddress || '').split(',').map(p => p.trim());
            const street = addressParts[0] || '';
            const city = addressParts[1] || '';

            // Handle "CA" or "CA 95101" in part[2]
            const stateZipParts = (addressParts[2] || '').split(' ').filter(s => s.length > 0);
            let stateCode = stateZipParts[0] || '';
            let zip = stateZipParts[1] || '';

            if (!street || !city || !stateCode) {
                showMessage('error', 'Invalid delivery address. Please update the order address first.', 5000, 'orders');
                return;
            }

            // ✅ ZIP missing — use Netlify Function (Proxy) to look it up
            if (!zip) {
                try {
                    console.log('🗺️ ZIP missing. Asking server to geocode address...');

                    // Call our new Netlify function
                    // We send the full address string (street + city + state) for better accuracy
                    const fullAddressQuery = `${street}, ${city}, ${stateCode}`;

                    const geoResponse = await fetch('/.netlify/functions/geocode', {
                        method: 'POST',
                        body: JSON.stringify({ address: fullAddressQuery }),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (!geoResponse.ok) {
                        throw new Error(`Geocode server error: ${geoResponse.status}`);
                    }

                    const geoData = await geoResponse.json();
                    console.log('🗺️ Geocode response:', geoData.status);

                    if (geoData.status === 'OK' && geoData.results?.length > 0) {
                        const components = geoData.results[0].address_components;

                        // Extract ZIP
                        const postalComponent = components.find(c => c.types.includes('postal_code'));
                        if (postalComponent) {
                            zip = postalComponent.short_name;
                            console.log('✅ ZIP found:', zip);
                        } else {
                            console.warn('⚠️ No postal_code in geocode results');
                        }

                        // Extract/Confirm State (Optional, but good for data integrity)
                        const stateComponent = components.find(c => c.types.includes('administrative_area_level_1'));
                        if (stateComponent) {
                            stateCode = stateComponent.short_name;
                        }
                    } else {
                        console.warn('⚠️ Geocode API returned no results or non-OK status:', geoData.status);
                    }

                } catch (geoError) {
                    console.error('❌ Geocoding error:', geoError);
                    showMessage('error', 'Could not auto-detect ZIP code. Please enter it manually.', 5000, 'orders');
                }
            }

            console.log('✅ Final address:', { street, city, stateCode, zip });

            const addressTo = {
                name: order.buyerName,
                street1: street,
                city: city,
                state: stateCode,
                zip: zip,

            resetTimer();

            if (!confirm(`Generate shipping label with ${provider} ${servicelevel} for $${amount.toFixed(2)}?`)) {
                return;
            }

            // Show loading
            showMessage('info', 'Generating shipping label... Please wait.', 0, 'orders');

            try {
                const response = await fetch('/.netlify/functions/generateShippingLabel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${await auth.currentUser.getIdToken()}`
                    },
                    body: JSON.stringify({
                        rateId: rateId,
                        orderId: orderId
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.details || 'Failed to generate label');
                }

                const result = await response.json();

                console.log('✅ Label generated:', result);

                // Update order with tracking info
                await updateOrderWithTracking(orderId, {
                    trackingNumber: result.trackingNumber,
                    trackingUrl: result.trackingUrlProvider,
                    carrier: result.carrier,
                    servicelevel: servicelevel,
                    shippingCost: Math.round(amount * 100), // Convert to cents
                    labelUrl: result.labelUrl,
                    transactionId: result.transactionId
                });

                // Open label in new window
                window.open(result.labelUrl, '_blank');

                showMessage('success', `Label generated! Tracking: ${result.trackingNumber}`, 8000, 'orders');

                window.module.closeShippingModal();

            } catch (error) {
                console.error('❌ Label generation error:', error);
                showMessage('error', `Failed to generate label: ${error.message}`, 8000, 'orders');
            }
        }

            return new Promise((resolve, reject) => {
                let attempts = 0;
                const checkInterval = setInterval(() => {
                    const element = document.getElementById(elementId);
                    attempts++;

                    if (element) {
                        clearInterval(checkInterval);
                        resolve(element);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        reject(new Error(`Element ${elementId} not found after ${maxAttempts} attempts`));
                    }
                }, 50); // Check every 50ms
            });
        }

        // ============================================================================
        // HELPER FUNCTIONS
        // ============================================================================

        function calculateItemProfit(item) {
            const sellingPriceCents = item.price || 0;
            const purchasePriceCents = item.purchasePriceCents || 0;
            const avgShippingCostCents = item.avgShippingCostCents || 0;

            // ✅ NEW: Tariff calculations
            const countryOfOrigin = item.countryOfOrigin || 'Unknown';
            const tariffRate = item.tariffRate || 0; // Percentage (e.g., 25 for 25%)
            const tariffCents = Math.round((purchasePriceCents * tariffRate) / 100);

            const hasData = purchasePriceCents > 0 || avgShippingCostCents > 0 || tariffCents > 0;

            // Cost per unit (vendor cost + tariff)
            const costPerUnitCents = purchasePriceCents + tariffCents;

            // Profit if customer pays shipping (most common scenario)
            const profitWithoutShippingCents = sellingPriceCents - costPerUnitCents;
            const marginWithoutShippingPercent = sellingPriceCents > 0
                ? (profitWithoutShippingCents / sellingPriceCents) * 100
                : 0;

            // Actual profit if you absorb shipping cost
            const profitWithShippingCents = sellingPriceCents - (costPerUnitCents + avgShippingCostCents);
            const marginWithShippingPercent = sellingPriceCents > 0
                ? (profitWithShippingCents / sellingPriceCents) * 100
                : 0;

            // Break-even price if you were to offer free shipping (like Amazon)
            const breakEvenWithFreeShippingCents = costPerUnitCents + avgShippingCostCents;

            // ✅ NEW: Calculate what profit would be WITHOUT tariffs (for comparison)
            const profitWithoutTariffCents = sellingPriceCents - (purchasePriceCents + avgShippingCostCents);
            const marginWithoutTariffPercent = sellingPriceCents > 0
                ? ((sellingPriceCents - purchasePriceCents) / sellingPriceCents) * 100
                : 0;

            return {
                hasData,
                sellingPriceCents,
                purchasePriceCents,
                avgShippingCostCents,

                // ✅ NEW: Tariff data
                countryOfOrigin,
                tariffRate,
                tariffCents,
                tariffImpactCents: tariffCents, // How much tariff adds to cost

                // Cost breakdown
                costPerUnitCents,  // Vendor cost + tariff

                // Dual profit calculations (WITH tariffs)
                profitWithoutShippingCents,      // When customer pays shipping
                marginWithoutShippingPercent,    // Margin without shipping
                profitWithShippingCents,         // If you absorb shipping
                marginWithShippingPercent,       // Margin with shipping absorbed

                // ✅ NEW: Pre-tariff comparison
                profitWithoutTariffCents,        // What profit would be without tariffs
                marginWithoutTariffPercent,      // What margin would be without tariffs

                breakEvenWithFreeShippingCents,

                // Legacy (kept for backward compatibility)
                totalCostCents: costPerUnitCents,
                profitCents: profitWithoutShippingCents,
                marginPercent: marginWithoutShippingPercent
            };
        }

        function getMarginClass(marginPercent) {
            if (marginPercent > 40) return 'margin-excellent';
            if (marginPercent >= 20) return 'margin-good';
            if (marginPercent >= 0) return 'margin-poor';
            return 'margin-negative';
        }

        function renderCompetitorPrices(item) {
            const competitorPrices = item.competitorPrices || {};
            const ebayPrice = competitorPrices.ebay;
            const amazonPrice = competitorPrices.amazon;

            const badges = [];
            if (ebayPrice) {
                badges.push(`<span class="competitor-badge ebay-badge">eBay: ${formatPriceDisplay(ebayPrice)}</span>`);
            }
            if (amazonPrice) {
                badges.push(`<span class="competitor-badge amazon-badge">Amazon: ${formatPriceDisplay(amazonPrice)}</span>`);
            }

            return badges.length > 0 ? badges.join(' ') : '<span class="text-gray-400 text-xs">Not set</span>';
        }

        function getFilteredProfitItems() {
            let filtered = [...state.items];

            // Search filter
            if (state.profitAnalysis?.searchTerm) {
                const term = state.profitAnalysis.searchTerm.toLowerCase();
                filtered = filtered.filter(item =>
                    item.name.toLowerCase().includes(term) ||
                    (item.sku && item.sku.toLowerCase().includes(term))
                );
            }

            // Margin filter
            if (state.profitAnalysis?.filterMargin !== 'all') {
                filtered = filtered.filter(item => {
                    const analysis = calculateItemProfit(item);
                    if (!analysis.hasData) return false;

                    switch (state.profitAnalysis.filterMargin) {
                        case 'excellent': return analysis.marginPercent > 40;
                        case 'good': return analysis.marginPercent >= 20 && analysis.marginPercent <= 40;
                        case 'poor': return analysis.marginPercent >= 0 && analysis.marginPercent < 20;
                        case 'negative': return analysis.marginPercent < 0;
                        default: return true;
                    }
                });
            }

            // Sort
            const sortBy = state.profitAnalysis?.sortBy || 'margin';
            const sortDir = state.profitAnalysis?.sortDirection || 'desc';

            filtered.sort((a, b) => {
                const analysisA = calculateItemProfit(a);
                const analysisB = calculateItemProfit(b);

                let comparison = 0;

                switch (sortBy) {
                    case 'margin':
                        comparison = analysisA.marginPercent - analysisB.marginPercent;
                        break;
                    case 'profit':
                        comparison = analysisA.profitCents - analysisB.profitCents;
                        break;
                    case 'price':
                        comparison = a.price - b.price;
                        break;
                    case 'name':
                        comparison = a.name.localeCompare(b.name);
                        break;
                }

                return sortDir === 'desc' ? -comparison : comparison;
            });

            return filtered;
        }

        function renderEnhancedPriceRecommendations(item, analysis) {
            if (!analysis.hasData) {
                return `
                    <div class="bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200">
                        <p class="text-sm text-yellow-800">
                            💡 Enter cost data above to see pricing recommendations
                        </p>
                    </div>
                `;
            }

            const competitorPrices = item.competitorPrices || {};
            const amazonPrice = competitorPrices.amazon || 0;
            const ebayPrice = competitorPrices.ebay || 0;

            const recommendations = [];

            // Recommendation 1: Match Amazon (they have free shipping)
            if (amazonPrice > 0) {
                const profitVsAmazon = amazonPrice - analysis.costPerUnitCents;
                const marginVsAmazon = (profitVsAmazon / amazonPrice) * 100;

                recommendations.push({
                    title: '🎯 Match Amazon Price',
                    price: amazonPrice,
                    profit: profitVsAmazon,
                    margin: marginVsAmazon,
                    description: 'Match Amazon (customer pays your shipping separately)',
                    highlight: true
                });
            }

            // Recommendation 2: Beat Amazon by 5%
            if (amazonPrice > 0) {
                const beatAmazonPrice = Math.floor((amazonPrice * 0.95) / 100) * 100;
                const profitBeatAmazon = beatAmazonPrice - analysis.costPerUnitCents;
                const marginBeatAmazon = (profitBeatAmazon / beatAmazonPrice) * 100;

                recommendations.push({
                    title: '⚡ Beat Amazon by 5%',
                    price: beatAmazonPrice,
                    profit: profitBeatAmazon,
                    margin: marginBeatAmazon,
                    description: 'Undercut Amazon to win sales',
                    highlight: false
                });
            }

            // Recommendation 3: 30% target margin (customer pays shipping)
            const targetMarginPrice = Math.ceil((analysis.costPerUnitCents / 0.70) / 100) * 100;
            const targetProfit = targetMarginPrice - analysis.costPerUnitCents;
            const targetMargin = ((targetProfit / targetMarginPrice) * 100);

            recommendations.push({
                title: '📊 30% Target Margin',
                price: targetMarginPrice,
                profit: targetProfit,
                margin: targetMargin,
                description: 'Industry standard retail margin',
                highlight: false
            });

            if (recommendations.length === 0) {
                return '';
            }

            const recoHtml = recommendations.map(reco => `
                <div class="bg-white p-4 rounded-lg border-2 ${reco.highlight ? 'border-indigo-400 ring-2 ring-indigo-200' : 'border-gray-200'} hover:border-indigo-400 transition">
                    ${reco.highlight ? '<div class="mb-2"><span class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">⭐ RECOMMENDED</span></div>' : ''}
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="font-bold text-gray-900">${reco.title}</p>
                            <p class="text-xs text-gray-600">${reco.description}</p>
                        </div>
                        <p class="text-2xl font-black text-indigo-700">${formatPriceDisplay(reco.price)}</p>
                    </div>
                    <div class="flex justify-between text-sm mt-3 pt-3 border-t">
                        <span class="text-gray-600">Your Profit: <strong class="${reco.profit >= 0 ? 'text-green-600' : 'text-red-600'}">${formatPriceDisplay(reco.profit)}</strong></span>
                        <span class="text-gray-600">Margin: <strong class="${reco.profit >= 0 ? 'text-green-600' : 'text-red-600'}">${reco.margin.toFixed(1)}%</strong></span>
                    </div>
                    <div class="mt-2 text-xs text-gray-500 italic">
                        Customer pays shipping separately (~${formatPriceDisplay(analysis.avgShippingCostCents)})
                    </div>
                </div>
            `).join('');

            return `
                <div class="bg-indigo-50 p-6 rounded-xl border-2 border-indigo-200">
                    <h4 class="text-lg font-bold text-indigo-800 mb-4">💡 Pricing Strategies vs Amazon</h4>
                    <div class="grid grid-cols-1 gap-3">
                        ${recoHtml}
                    </div>
                </div>
            `;
        }

                    analysis.tariffRate.toFixed(1),

                    (analysis.purchasePriceCents / 100).toFixed(2),
                    (analysis.tariffCents / 100).toFixed(2),
                    (analysis.avgShippingCostCents / 100).toFixed(2),
                    (analysis.costPerUnitCents / 100).toFixed(2),
                    (analysis.profitWithoutShippingCents / 100).toFixed(2),
                    analysis.marginWithoutShippingPercent.toFixed(2),
                    (analysis.profitWithoutTariffCents / 100).toFixed(2),
                    analysis.marginWithoutTariffPercent.toFixed(2),
                    (analysis.profitWithShippingCents / 100).toFixed(2),
                    analysis.marginWithShippingPercent.toFixed(2),
                    competitorPrices.amazon ? (competitorPrices.amazon / 100).toFixed(2) : '',
                    competitorPrices.ebay ? (competitorPrices.ebay / 100).toFixed(2) : '',
                    `"${(item.vendorUrl || '').replace(/"/g, '""')}"`
                ].join(',');
            });

            const csvString = [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const filename = `profit_analysis_with_tariffs_${new Date().toISOString().slice(0, 10)}.csv`;

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showMessage('success', `Exported ${items.length} products to ${filename}`, 5000, 'catalog');
            } else {
                showMessage('error', 'Browser does not support automatic download', 5000, 'catalog');
            }
        }

        async function saveProfitData(itemId) {
            resetTimer();

            const purchasePrice = parseFloat(document.getElementById('modal-purchase-price')?.value || 0);
            const shippingCost = parseFloat(document.getElementById('modal-shipping-cost')?.value || 0);
            const vendorUrl = document.getElementById('modal-vendor-url')?.value?.trim() || null;
            const ebayPrice = parseFloat(document.getElementById('modal-ebay-price')?.value || 0);
            const amazonPrice = parseFloat(document.getElementById('modal-amazon-price')?.value || 0);

            // Get tariff data
            const countryOfOrigin = document.getElementById('modal-country-origin')?.value || 'Unknown';
            const tariffRate = parseFloat(document.getElementById('modal-tariff-rate')?.value || 0);

            const purchasePriceCents = Math.round(purchasePrice * 100);
            const avgShippingCostCents = Math.round(shippingCost * 100);
            const competitorPrices = {};

            if (ebayPrice > 0) competitorPrices.ebay = Math.round(ebayPrice * 100);
            if (amazonPrice > 0) competitorPrices.amazon = Math.round(amazonPrice * 100);

            try {
                const itemRef = doc(db, ITEMS_COLLECTION, itemId);

                await updateDoc(itemRef, {
                    purchasePriceCents: purchasePriceCents,
                    avgShippingCostCents: avgShippingCostCents,
                    vendorUrl: vendorUrl,
                    competitorPrices: competitorPrices,
                    countryOfOrigin: countryOfOrigin,
                    tariffRate: tariffRate,
                    updatedAt: serverTimestamp()
                });

                await logAdminAction('PROFIT_DATA_UPDATED', {
                    itemId,
                    purchasePriceCents,
                    avgShippingCostCents,
                    competitorPrices,
                    countryOfOrigin,
                    tariffRate
                }, itemId);

                showMessage('success', 'Profit data saved successfully!', 3000, 'catalog');
                closeProfitDetailsModal();

                // Refresh the profit analysis section
                if (state.activeTab === 'profitAnalysis') {
                    renderAdminPage(auth.currentUser?.email || 'Admin');
                }

            } catch (error) {
                console.error('Error saving profit data:', error);
                showMessage('error', `Failed to save: ${error.message}`, 5000, 'catalog');

                // ✅ FIX: Restore scrolling even if save fails
                document.body.style.overflow = 'auto';
            }
        }

        function renderLabelStatus(status) {
            const statusMap = {
                created: { label: 'Created', class: 'bg-blue-100 text-blue-800' },
                in_transit: { label: 'In Transit', class: 'bg-purple-100 text-purple-800' },
                delivered: { label: 'Delivered', class: 'bg-green-100 text-green-800' },
                exception: { label: 'Exception', class: 'bg-red-100 text-red-800' }
            };

            const statusInfo = statusMap[status] || { label: status || 'Unknown', class: 'bg-gray-100 text-gray-800' };

            return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${statusInfo.class}">${statusInfo.label}</span>`;
        }

        function getFilteredShippingLabels() {
            let filtered = [...state.shippingLabels];

            // Search filter
            if (state.shippingLabelFilters.searchTerm) {
                const term = state.shippingLabelFilters.searchTerm.toLowerCase();
                filtered = filtered.filter(label =>
                    (label.trackingNumber && label.trackingNumber.toLowerCase().includes(term)) ||
                    (label.orderId && label.orderId.toLowerCase().includes(term)) ||
                    (label.addressTo?.name && label.addressTo.name.toLowerCase().includes(term))
                );
            }

            // Carrier filter
            if (state.shippingLabelFilters.carrier !== 'all') {
                filtered = filtered.filter(label => label.carrier === state.shippingLabelFilters.carrier);
            }

            // Status filter
            if (state.shippingLabelFilters.status !== 'all') {
                filtered = filtered.filter(label => label.status === state.shippingLabelFilters.status);
            }

            // Sort
            filtered.sort((a, b) => {
                switch (state.shippingLabelFilters.sortBy) {
                    case 'date-desc':
                        return (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0);
                    case 'date-asc':
                        return (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0);
                    case 'cost-desc':
                        return (b.cost || 0) - (a.cost || 0);
                    case 'cost-asc':
                        return (a.cost || 0) - (b.cost || 0);
                    default:
                        return 0;
                }
            });

            return filtered;
        }

        function updateShippingLabelFilter(filterName, value) {
            state.shippingLabelFilters[filterName] = value;
            refreshShippingLabels();
        }

        async function calculateShippingRates() {
            const form = document.getElementById('createLabelForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Show loading state
            const modal = document.getElementById('createLabelModal');
            const footer = modal.querySelector('.bg-gray-50');
            footer.innerHTML = `
                <div class="flex items-center justify-center gap-2 text-blue-600">
                    <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Calculating rates...</span>
                </div>`;

            try {
                // Call your Netlify function
                const response = await fetch('/.netlify/functions/calculateShipping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        addressTo: {
                            name: data.name,
                            street1: data.street1,
                            street2: data.street2 || '',
                            city: data.city,
                            state: data.state,
                            zip: data.zip,
                            country: data.country,
                            phone: data.phone || ''
                        },
                        parcels: [{
                            length: data.length,
                            width: data.width,
                            height: data.height,
                            distance_unit: 'in',
                            weight: data.weight,
                            mass_unit: 'lb'
                        }]
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to calculate rates');
                }

                // Close the create modal and show rate selection
                document.getElementById('createLabelModal').remove();
                showRateSelectionModal(result.allRates, result.shipmentId, data);

            } catch (error) {
                console.error('Rate calculation error:', error);
                showMessage('error', error.message || 'Failed to calculate shipping rates', 5000, 'shippingLabel');

                // Restore footer
                footer.innerHTML = `
                    <div class="flex justify-end gap-3 px-6 py-4">
                        <button onclick="document.getElementById('createLabelModal').remove()"
                            class="px-6 py-2 text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg transition-colors">
                            Cancel
                        </button>
                        <button onclick="window.module.calculateShippingRates()"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Get Rates
                        </button>
                    </div>`;
            }
        }

        async function selectRate(rateId, cost, carrier, servicelevel, orderId, addressData) {

                        <p class="text-sm text-gray-500 mt-2">This may take a moment</p>
                    </div>
                </div>`;

            try {
                // Call your Netlify function to purchase the label
                const response = await fetch('/.netlify/functions/generateShippingLabel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        rateId: rateId,
                        orderId: orderId || null
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to generate label');
                }

                // Save to Firestore
                await addDoc(collection(db, SHIPPING_LABELS_COLLECTION), {
                    trackingNumber: result.trackingNumber,
                    trackingUrlProvider: result.trackingUrlProvider,
                    labelUrl: result.labelUrl,
                    carrier: carrier,
                    servicelevel: servicelevel,
                    cost: cost,
                    status: 'created',
                    orderId: orderId || null,
                    transactionId: result.transactionId,
                    addressTo: {
                        name: addressData.name,
                        street1: addressData.street1,
                        street2: addressData.street2 || '',
                        city: addressData.city,
                        state: addressData.state,
                        zip: addressData.zip,
                        country: addressData.country,
                        phone: addressData.phone || ''
                    },
                    weight: { value: parseFloat(addressData.weight), unit: 'lb' },
                    dimensions: {
                        length: parseFloat(addressData.length),
                        width: parseFloat(addressData.width),
                        height: parseFloat(addressData.height),
                        unit: 'in'
                    },
                    createdAt: serverTimestamp()
                });

                // Close modal
                modal.remove();

                // Show success message
                showMessage('success', `Label created! Tracking: ${result.trackingNumber}`, 5000, 'shippingLabel');

                // Refresh the labels table
                refreshShippingLabels();

            } catch (error) {
                console.error('Label purchase error:', error);
                modal.remove();
                showMessage('error', error.message || 'Failed to purchase label', 5000, 'shippingLabel');
            }
        }

        /** Download a PDF receipt for a vendor order */
        async function syncVendorCostToProfit(orderId) {
            const raw = state.vendorOrders?.find(o => o.id === orderId);
            if (!raw) return;
            const order = normalizeVendorOrder(raw);

            // Identify items that are linked to catalog products
            const linked = order.items.filter(i => i.productId && i.quantity > 0);
            if (linked.length === 0) {
                alert('⚠️ No items in this order are linked to catalog products. Make sure each row has a product selected.');
                return;
            }

            // Overhead = everything beyond pure product cost (shipping + tariffs + processing + sales tax)
            const overheadDollars = order.shippingCost + order.tariffs + order.processingFee + order.salesTax;
            const orderSubtotalDollars = order.orderCost || linked.reduce((s, i) => s + i.subtotal, 0);

            // Build preview rows
            const updates = linked.map(item => {
                const itemShare    = orderSubtotalDollars > 0 ? item.subtotal / orderSubtotalDollars : 1 / linked.length;
                const proratedOverheadPerUnit = item.quantity > 0 ? (overheadDollars * itemShare) / item.quantity : 0;
                const landedUnitCostDollars   = item.unitCost + proratedOverheadPerUnit;
                const landedUnitCostCents      = Math.round(landedUnitCostDollars * 100);

                const catalogItem = state.items.find(ci => ci.id === item.productId);
                return {
                    productId:         item.productId,
                    name:              item.name || catalogItem?.name || item.productId,
                    sku:               item.sku  || catalogItem?.sku  || '—',
                    quantity:          item.quantity,
                    baseUnitCost:      item.unitCost,
                    proratedOverhead:  proratedOverheadPerUnit,
                    landedUnitCostCents,
                    currentCents:      catalogItem?.purchasePriceCents ?? null,
                };
            });

            // Build confirmation preview
            const previewLines = updates.map(u =>
                `• ${u.name} (SKU: ${u.sku})\n` +
                `  Base: $${u.baseUnitCost.toFixed(4)}  +  Overhead share: $${u.proratedOverhead.toFixed(4)}\n` +
                `  → New purchasePriceCents: ${formatPriceDisplay(u.landedUnitCostCents)}` +
                (u.currentCents !== null ? `  (was ${formatPriceDisplay(u.currentCents)})` : '  (not set yet)')
            ).join('\n\n');

            const confirmed = confirm(
                `📊 Sync landed cost to Profit Analysis?\n\n` +
                `This will update purchasePriceCents on ${updates.length} product${updates.length !== 1 ? 's' : ''}:\n\n` +
                `${previewLines}\n\n` +
                `Overhead ($${overheadDollars.toFixed(2)}) is prorated by each item's share of the order subtotal.`
            );
            if (!confirmed) return;

            // Disable the button while saving
            const btn = document.getElementById('syncProfitBtn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }

            try {
                await Promise.all(updates.map(u =>
                    updateDoc(doc(db, ITEMS_COLLECTION, u.productId), {
                        purchasePriceCents: u.landedUnitCostCents,
                        updatedAt: serverTimestamp()
                    })
                ));

                await logAdminAction('VENDOR_COST_SYNCED_TO_PROFIT', {
                    vendorOrderId: orderId,
                    orderNumber:   order.orderNumber,
                    itemsUpdated:  updates.map(u => ({ productId: u.productId, sku: u.sku, landedUnitCostCents: u.landedUnitCostCents }))
                }, orderId);

                alert(`✅ Synced! ${updates.length} product${updates.length !== 1 ? 's' : ''} updated in Profit Analysis.`);
                document.getElementById('vendorOrderDetailsModal')?.remove();

            } catch (err) {
                console.error('Sync failed:', err);
                alert(`❌ Sync failed: ${err.message}`);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '📊 Sync to Profit Analysis'; }
            }
        }

        /** Force-download a shipping label PDF from Shippo URL */
        async function downloadShippingLabelPDF(labelId) {
            const label = state.shippingLabels.find(l => l.id === labelId);
            if (!label?.labelUrl) {
                showMessage('error', 'No label PDF available for this shipment.', 3000, 'shippingLabel');
                return;
            }

            const btn = document.getElementById(`labelDownloadBtn-${labelId}`);
            if (btn) { btn.textContent = '⏳ Downloading…'; btn.disabled = true; }

            try {
                const res = await fetch(label.labelUrl);
                if (!res.ok) throw new Error('Fetch failed');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `label-${label.trackingNumber || labelId}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            } catch {
                // CORS fallback — open in new tab so user can File > Save
                window.open(label.labelUrl, '_blank');
            } finally {
                if (btn) { btn.textContent = '📥 Download Label PDF'; btn.disabled = false; }
            }
        }

        function getFilteredEmailNotifications() {
            let items = state.emailNotifications || [];
            const f = state.emailNotifFilters || {};

            if (f.searchTerm) {
                const term = f.searchTerm.toLowerCase();
                items = items.filter(n =>
                    (n.recipientEmail || '').toLowerCase().includes(term) ||
                    (n.recipientName  || '').toLowerCase().includes(term) ||
                    (n.orderId        || '').toLowerCase().includes(term) ||
                    (n.orderNumber    || '').toLowerCase().includes(term)

            if (f.type && f.type !== 'all') {

            return items;

        async function purgeOldEmailNotifications() {
            const DAYS = 60;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - DAYS);

            const stale = state.emailNotifications.filter(n => {
                const sent = n.sentAt?.toDate ? n.sentAt.toDate() : new Date(n.sentAt);
                return sent < cutoff;
            });

            if (stale.length === 0) {
                alert(`✅ Nothing to purge — no notifications older than ${DAYS} days.`);
                return;
            }

            if (!confirm(`🗑️ Delete ${stale.length} notification${stale.length !== 1 ? 's' : ''} older than ${DAYS} days?\n\nThis cannot be undone.`)) return;

            const btn = document.getElementById('purgeEmailNotifBtn');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Purging…'; }

            try {
                await Promise.all(
                    stale.map(n => deleteDoc(doc(db, EMAIL_NOTIFICATIONS_COLLECTION, n.id)))
                );
                logAdminAction('EMAIL_NOTIF_PURGED', { count: stale.length, olderThanDays: DAYS });
                showMessage && showMessage('success', `Deleted ${stale.length} old notification log${stale.length !== 1 ? 's' : ''}.`, 4000, 'emailNotif');
            } catch (err) {
                console.error('Purge failed:', err);
                alert(`❌ Purge failed: ${err.message}`);
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🗑️ Purge Old Logs'; }
            }
        }

        async function handleCreateDiscount(e) {
            e.preventDefault();
            resetTimer();

            const form = e.target;
            const code = form.discountCode.value.trim().toUpperCase();
            const type = form.discountType.value;
            const value = parseFloat(form.discountValue.value) || 0;
            const minOrderCents = Math.round((parseFloat(form.minOrder.value) || 0) * 100);
            const maxUses = parseInt(form.maxUses.value, 10) || 0;
            const expiresAt = form.expiresAt.value ? new Date(form.expiresAt.value) : null;
            const description = form.discountDescription.value.trim();
            const appliesToCategory = form.appliesToCategory.value || 'all';
            const appliesToProduct = form.appliesToProduct.value || 'all';
            const maxDiscountCents = Math.round((parseFloat(form.maxDiscountAmount.value) || 0) * 100);

            // --- Validation ---
            if (!code) {
                showMessage('error', 'Discount code is required.', 3000, 'marketing');
                return;
            }
            if (type === 'percentage' && (value <= 0 || value > 100)) {
                showMessage('error', 'Percentage must be between 1 and 100.', 3000, 'marketing');
                return;
            }
            if (type === 'fixed' && value <= 0) {
                showMessage('error', 'Fixed discount amount must be greater than 0.', 3000, 'marketing');
                return;
            }

            // Check for duplicate code
            const duplicate = state.discounts.find(d => d.code === code && d.id !== state.editingDiscount?.id);
            if (duplicate) {
                showMessage('error', `Discount code "${code}" already exists.`, 3000, 'marketing');
                return;
            }

            const discountData = {
                code,
                type,
                value,
                valueCents: type === 'fixed' ? Math.round(value * 100) : 0,
                minOrderCents,
                maxUses,
                maxDiscountCents,
                expiresAt: expiresAt ? expiresAt.toISOString() : null,
                description,
                appliesToCategory,
                appliesToProduct,
                enabled: true,
                updatedAt: new Date().toISOString(),
            };

            try {
                if (state.editingDiscount) {
                    const docRef = doc(db, getDiscountsCollectionPath(), state.editingDiscount.id);
                    await updateDoc(docRef, {
                        ...discountData,
                        currentUses: state.editingDiscount.currentUses || 0,
                        usageLog: state.editingDiscount.usageLog || [],
                        createdAt: state.editingDiscount.createdAt,
                    });
                    showMessage('success', `Discount "${code}" updated successfully.`, 3000, 'marketing');
                    logAdminAction('DISCOUNT_UPDATED', { code, type, value });
                } else {
                    discountData.currentUses = 0;
                    discountData.usageLog = [];
                    discountData.createdAt = new Date().toISOString();
                    await addDoc(collection(db, getDiscountsCollectionPath()), discountData);
                    showMessage('success', `Discount "${code}" created successfully.`, 3000, 'marketing');
                    logAdminAction('DISCOUNT_CREATED', { code, type, value });
                }

                state.editingDiscount = null;
                form.reset();
                cancelDiscountEdit();
                await fetchDiscounts();
            } catch (error) {
                console.error('Error saving discount:', error);
                showMessage('error', `Failed to save discount: ${error.message}`, 5000, 'marketing');
            }
        }

        // ─────────────────────────────────────────────────────────────────────────────
        // DISCOUNT VALIDATION & APPLICATION
        // ─────────────────────────────────────────────────────────────────────────────

        function validateDiscount(code, cartItems, orderTotalCents) {
            if (!code) return { valid: false, discount: null, message: 'No code entered.', savedCents: 0 };

            const discount = state.discounts.find(d => d.code === code.toUpperCase() && d.enabled);
            if (!discount) {
                return { valid: false, discount: null, message: 'Invalid or inactive discount code.', savedCents: 0 };
            }

            if (discount.expiresAt && new Date(discount.expiresAt) < new Date()) {
                return { valid: false, discount, message: 'This discount code has expired.', savedCents: 0 };
            }

            if (discount.maxUses > 0 && (discount.currentUses || 0) >= discount.maxUses) {
                return { valid: false, discount, message: 'This discount code has reached its usage limit.', savedCents: 0 };
            }

            if (discount.minOrderCents > 0 && orderTotalCents < discount.minOrderCents) {
                const minDollars = (discount.minOrderCents / 100).toFixed(2);
                return { valid: false, discount, message: `Minimum order of $${minDollars} required.`, savedCents: 0 };
            }

            if (discount.appliesToCategory && discount.appliesToCategory !== 'all') {
                const hasMatch = cartItems.some(entry => {
                    const item = entry.item || state.items.find(i => i.id === (entry.id || entry.item?.id));
                    return item && item.catalogId === discount.appliesToCategory;
                });
                if (!hasMatch) {
                    const catName = state.catalogs.find(c => c.id === discount.appliesToCategory)?.name || 'the required category';
                    return { valid: false, discount, message: `This code only applies to "${catName}" products.`, savedCents: 0 };
                }
            }

            if (discount.appliesToProduct && discount.appliesToProduct !== 'all') {
                const hasProduct = cartItems.some(entry => {
                    const itemId = entry.item?.id || entry.id;
                    return itemId === discount.appliesToProduct;
                });
                if (!hasProduct) {
                    return { valid: false, discount, message: 'This code does not apply to items in this order.', savedCents: 0 };
                }
            }

            let savedCents = 0;
            if (discount.type === 'percentage') {
                savedCents = Math.round(orderTotalCents * (discount.value / 100));
                if (discount.maxDiscountCents > 0 && savedCents > discount.maxDiscountCents) {
                    savedCents = discount.maxDiscountCents;
                }
            } else if (discount.type === 'fixed') {
                savedCents = discount.valueCents || Math.round(discount.value * 100);
                if (savedCents > orderTotalCents) savedCents = orderTotalCents;
            } else if (discount.type === 'freeShipping') {
                savedCents = 0;
            }

            return {
                valid: true,
                discount,
                message: `✅ Code "${discount.code}" applied! ${getDiscountSummaryText(discount, savedCents)}`,
                savedCents
            };
        }

        function getDiscountSummaryText(discount, savedCents) {
            if (discount.type === 'percentage') return `${discount.value}% off (saves ${formatPriceDisplay(savedCents)})`;
            if (discount.type === 'fixed') return `${formatPriceDisplay(savedCents)} off`;
            if (discount.type === 'freeShipping') return 'Free shipping applied!';
            return '';
        }

        function handleApplyDiscountToOrder() {
            resetTimer();
            const codeInput = document.getElementById('orderDiscountCode');
            const code = codeInput?.value?.trim();

            if (!code) {
                showMessage('error', 'Please enter a discount code.', 2000, 'orders');
                return;
            }

            const cartItems = Object.values(state.adminCart).map(entry => ({
                item: entry.item, quantity: entry.quantity, id: entry.item.id
            }));
            const subtotalCents = cartItems.reduce((sum, e) => sum + (e.item.price * e.quantity), 0);
            const result = validateDiscount(code, cartItems, subtotalCents);

            const msgEl = document.getElementById('discountMessage');
            if (msgEl) {
                msgEl.innerHTML = result.valid
                    ? `<p class="text-green-700 text-sm font-semibold mt-2">${result.message}</p>`
                    : `<p class="text-red-600 text-sm font-semibold mt-2">❌ ${result.message}</p>`;
            }

            if (result.valid) {
                state.appliedDiscount = { ...result.discount, savedCents: result.savedCents };
            } else {
                state.appliedDiscount = null;
            }
            updateOrderTotalsWithDiscount();
        }

        function removeAppliedDiscount() {
            state.appliedDiscount = null;
            const codeInput = document.getElementById('orderDiscountCode');
            if (codeInput) codeInput.value = '';
            const msgEl = document.getElementById('discountMessage');
            if (msgEl) msgEl.innerHTML = '';
            updateOrderTotalsWithDiscount();
            resetTimer();
        }

        function updateOrderTotalsWithDiscount() {
            const discountRowEl = document.getElementById('orderDiscountRow');
            const discountAmountEl = document.getElementById('orderDiscountAmount');
            const discountCodeEl = document.getElementById('orderDiscountCodeLabel');
            const grandTotalEl = document.getElementById('orderDiscountedGrandTotal');

            const cartItems = Object.values(state.adminCart);
            const subtotalCents = cartItems.reduce((sum, e) => sum + (e.item.price * e.quantity), 0);
            const shippingCents = state.adminOrderShippingCents || 0;
            const taxCents = state.adminOrderTaxCents || 0;

            let discountCents = 0;
            if (state.appliedDiscount) {
                const result = validateDiscount(
                    state.appliedDiscount.code,
                    cartItems.map(e => ({ item: e.item, id: e.item.id, quantity: e.quantity })),
                    subtotalCents
                );
                if (result.valid) {
                    discountCents = result.savedCents;
                    state.appliedDiscount.savedCents = discountCents;
                } else {
                    state.appliedDiscount = null;
                    const msgEl = document.getElementById('discountMessage');
                    if (msgEl) msgEl.innerHTML = `<p class="text-red-600 text-sm mt-1">⚠️ Discount removed: ${result.message}</p>`;
                }
            }

            if (discountRowEl) discountRowEl.classList.toggle('hidden', discountCents === 0);
            if (discountAmountEl) discountAmountEl.textContent = `-${formatPriceDisplay(discountCents)}`;
            if (discountCodeEl && state.appliedDiscount) discountCodeEl.textContent = state.appliedDiscount.code;

            const finalCents = Math.max(0, subtotalCents - discountCents + shippingCents + taxCents);
            if (grandTotalEl) grandTotalEl.textContent = formatPriceDisplay(finalCents);
        }

                });
                logAdminAction('DISCOUNT_USED', { code: discount.code, orderId, savedCents });
            } catch (error) {
                console.error('Error recording discount usage:', error);
            }
        }
