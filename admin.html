            getFilteredExternalOrders: function () {
                const platform = document.getElementById('platformFilter')?.value || 'all';
                const status = document.getElementById('statusFilter')?.value || 'all';
                const search = document.getElementById('searchExternalOrders')?.value.toLowerCase() || '';

                return allExternalOrders.filter(order => {
                    const matchesPlatform = platform === 'all' || order.platform === platform;
                    const matchesStatus = status === 'all' || order.status === status;
                    const matchesSearch = search === '' ||
                        order.externalOrderId.toLowerCase().includes(search) ||
                        order.customerName.toLowerCase().includes(search) ||
                        order.product.toLowerCase().includes(search);

                    return matchesPlatform && matchesStatus && matchesSearch;
                });
            },

            filterExternalOrders: function () {
                window.module.renderExternalOrders();  // ✅ Add window.module.
                window.module.updateExternalOrderStats();  // ✅ Add window.module.
            },

            updateExternalOrderStats: function () {
                const filtered = window.module.getFilteredExternalOrders();

                // ✅ Add safety checks for all elements
                const statTotal = document.getElementById('statTotal');
                const statPending = document.getElementById('statPending');
                const statProcessing = document.getElementById('statProcessing');
                const statShipped = document.getElementById('statShipped');
                const statDelivered = document.getElementById('statDelivered');

                if (!statTotal || !statPending || !statProcessing || !statShipped || !statDelivered) {
                    console.warn('Stats elements not found in DOM');
                    return;
                }

                statTotal.textContent = filtered.length;
                statPending.textContent = filtered.filter(o => o.status === 'Pending').length;
                statProcessing.textContent = filtered.filter(o => o.status === 'Processing').length;
                statShipped.textContent = filtered.filter(o => o.status === 'Shipped').length;
                statDelivered.textContent = filtered.filter(o => o.status === 'Delivered').length;
            },

            handleExternalProductSelect: function () {
                const selector = document.getElementById('orderProductSelector');
                const selectedOption = selector.options[selector.selectedIndex];

                const productInput = document.getElementById('orderProduct');
                const amountInput = document.getElementById('orderAmount');
                const previewDiv = document.getElementById('productDetailsPreview');

                if (selectedOption.value === '') {
                    productInput.value = '';
                    amountInput.value = '';
                    previewDiv.classList.add('hidden');
                    document.getElementById('profitPreviewPanel').classList.add('hidden');
                    productInput.readOnly = false;
                    amountInput.readOnly = false;
                } else if (selectedOption.value === 'custom') {
                    productInput.value = '';
                    amountInput.value = '';
                    previewDiv.classList.add('hidden');
                    document.getElementById('profitPreviewPanel').classList.add('hidden');
                    productInput.readOnly = false;
                    amountInput.readOnly = false;
                    productInput.placeholder = 'Enter custom product name';
                    productInput.focus();
                } else {
                    const productName    = selectedOption.dataset.name;
                    const price          = selectedOption.dataset.price;
                    const sku            = selectedOption.dataset.sku;
                    const description    = selectedOption.dataset.description;
                    const purchasePrice  = selectedOption.dataset.purchasePrice;
                    const stock          = selectedOption.dataset.stock;

                    productInput.value = productName;
                    amountInput.value = price;

                    document.getElementById('previewSku').textContent = sku || 'N/A';
                    document.getElementById('previewDescription').textContent = description || 'No description';
                    document.getElementById('previewPrice').textContent = `$${price}`;
                    document.getElementById('previewStock').textContent = stock || '0';
                    document.getElementById('previewVendorCost').textContent =
                        purchasePrice ? `$${parseFloat(purchasePrice).toFixed(4)}` : 'Not set in Profit Analysis';
                    previewDiv.classList.remove('hidden');

                    productInput.readOnly = false;
                    amountInput.readOnly = false;

                    window.module.recalcExternalProfit();
                }
            },

            recalcExternalProfit: function () {
                const selector       = document.getElementById('orderProductSelector');
                const selectedOption = selector?.options[selector.selectedIndex];
                const purchasePrice  = parseFloat(selectedOption?.dataset?.purchasePrice || 0);

                const qty            = parseFloat(document.getElementById('orderQty')?.value || 1);
                const salePriceUnit  = parseFloat(document.getElementById('orderAmount')?.value || 0);
                const shippingCost   = parseFloat(document.getElementById('orderShippingCharged')?.value || 0);
                const transactionCost= parseFloat(document.getElementById('orderTransactionCost')?.value || 0);

                const panel = document.getElementById('profitPreviewPanel');
                if (!panel || (salePriceUnit === 0 && purchasePrice === 0)) {
                    panel?.classList.add('hidden');
                    return;
                }
                panel.classList.remove('hidden');

                const totalRevenue    = salePriceUnit * qty;                                   // shipping is our cost
                const totalVendorCost = purchasePrice * qty;
                const netProfit       = totalRevenue - totalVendorCost - transactionCost - shippingCost;
                const profitPerUnit   = qty > 0 ? netProfit / qty : 0;
                const margin          = totalRevenue > 0 ? (netProfit / totalRevenue) * 100 : 0;

                const fmt = v => `$${v.toFixed(2)}`;
                const profitColor = netProfit >= 0 ? 'text-green-700' : 'text-red-600';

                document.getElementById('ppRevenue').textContent       = fmt(totalRevenue);
                document.getElementById('ppVendorCost').textContent    = fmt(totalVendorCost);
                document.getElementById('ppFee').textContent           = fmt(transactionCost + shippingCost);
                document.getElementById('ppProfit').textContent        = fmt(netProfit);
                document.getElementById('ppProfit').className          = `font-black text-right text-lg ${profitColor}`;
                document.getElementById('ppProfitPerUnit').textContent = fmt(profitPerUnit);
                document.getElementById('ppMargin').textContent        = `${margin.toFixed(1)}%`;
            },

            showAddExternalOrderModal: function () {
                document.getElementById('modalTitle').textContent = 'Add External Order';
                document.getElementById('externalOrderForm').reset();
                document.getElementById('editOrderId').value = '';
                document.getElementById('orderDate').valueAsDate = new Date();
                document.getElementById('externalOrderModal').classList.remove('hidden');
            },

            editExternalOrder: function (orderId) {
                const order = allExternalOrders.find(o => o.id === orderId);
                if (!order) return;

                document.getElementById('modalTitle').textContent = 'Edit External Order';
                document.getElementById('editOrderId').value = order.id;
                document.getElementById('orderPlatform').value = order.platform;
                document.getElementById('orderExternalId').value = order.externalOrderId;
                document.getElementById('orderCustomerName').value = order.customerName;
                document.getElementById('orderDate').value = order.orderDate;
                document.getElementById('orderProduct').value = order.product;
                document.getElementById('orderStatus').value = order.status;
                document.getElementById('orderQty').value = order.quantity || 1;
                document.getElementById('orderAmount').value = order.amount || '';
                document.getElementById('orderShippingCharged').value = order.shippingCharged || '';
                document.getElementById('orderTransactionCost').value = order.transactionCost || '';
                document.getElementById('orderTracking').value = order.trackingNumber || '';
                document.getElementById('orderNotes').value = order.notes || '';

                // Re-select the product in the dropdown if we have a productId
                const selector = document.getElementById('orderProductSelector');
                const productId = order.productId || null;
                if (productId && selector) {
                    selector.value = productId;
                    const selectedOption = selector.options[selector.selectedIndex];
                    if (selectedOption && selectedOption.value === productId) {
                        // Populate the product details preview from the option's data attributes
                        const sku         = selectedOption.dataset.sku || 'N/A';
                        const description = selectedOption.dataset.description || '';
                        const price       = selectedOption.dataset.price || '';
                        const stock       = selectedOption.dataset.stock || '0';
                        const purchasePrice = selectedOption.dataset.purchasePrice || null;

                        document.getElementById('previewSku').textContent         = sku;
                        document.getElementById('previewDescription').textContent = description;
                        document.getElementById('previewPrice').textContent       = price ? `$${price}` : '—';
                        document.getElementById('previewStock').textContent       = stock;
                        document.getElementById('previewVendorCost').textContent  =
                            order.vendorCostPerUnit
                                ? `$${Number(order.vendorCostPerUnit).toFixed(4)}`
                                : purchasePrice
                                    ? `$${parseFloat(purchasePrice).toFixed(4)}`
                                    : 'Not set in Profit Analysis';
                        document.getElementById('productDetailsPreview').classList.remove('hidden');
                    }
                } else if (order.vendorCostPerUnit) {
                    // No productId but we have a stored vendor cost — show it anyway
                    document.getElementById('previewVendorCost').textContent = `$${Number(order.vendorCostPerUnit).toFixed(4)}`;
                    document.getElementById('productDetailsPreview').classList.remove('hidden');
                }

                window.module.recalcExternalProfit();
                document.getElementById('externalOrderModal').classList.remove('hidden');
            },

            closeExternalOrderModal: function () {
                document.getElementById('externalOrderModal').classList.add('hidden');
                document.getElementById('externalOrderForm').reset();
            },

            saveExternalOrder: async function (event) {
                event.preventDefault();

                const isNew = !document.getElementById('editOrderId').value;

                const selector       = document.getElementById('orderProductSelector');
                const selectedOption = selector?.options[selector.selectedIndex];
                const productId      = (selectedOption?.value && selectedOption.value !== 'custom') ? selectedOption.value : null;
                const purchasePrice  = parseFloat(selectedOption?.dataset?.purchasePrice || 0) || 0;

                const qty             = parseInt(document.getElementById('orderQty')?.value || 1) || 1;
                const salePriceUnit   = parseFloat(document.getElementById('orderAmount').value) || null;
                const shippingCharged = parseFloat(document.getElementById('orderShippingCharged')?.value) || 0;
                const transactionCost = parseFloat(document.getElementById('orderTransactionCost')?.value) || 0;

                // For edit, use stored vendorCostPerUnit if no product is freshly selected
                const existingOrderId = document.getElementById('editOrderId').value;
                let vendorCostPerUnit = purchasePrice || null;
                if (!productId && existingOrderId) {
                    // Try to get it from the existing Firestore pricing record
                    try {
                        const pricingDoc = await getDoc(doc(db, EXTERNAL_ORDER_PRICING_COLLECTION, existingOrderId));
                        if (pricingDoc.exists()) {
                            vendorCostPerUnit = vendorCostPerUnit ?? pricingDoc.data().vendorCostPerUnit ?? null;
                        }
                    } catch(e) { /* ignore */ }
                }

                const orderData = {
                    id:              existingOrderId || null,
                    platform:        document.getElementById('orderPlatform').value,
                    externalOrderId: document.getElementById('orderExternalId').value,
                    customerName:    document.getElementById('orderCustomerName').value,
                    orderDate:       document.getElementById('orderDate').value,
                    product:         document.getElementById('orderProduct').value,
                    status:          document.getElementById('orderStatus').value,
                    amount:          salePriceUnit,
                    trackingNumber:  document.getElementById('orderTracking').value || null,
                    notes:           document.getElementById('orderNotes').value || null
                };

                try {
                    const idToken = await auth.currentUser.getIdToken();
                    const response = await fetch(SAVE_EXTERNAL_ORDER, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${idToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(orderData)
                    });

                    if (!response.ok) throw new Error('Failed to save order');

                    const saved = await response.json();
                    // The Netlify backend returns the saved order — get its ID
                    const savedId = saved?.id || saved?.orderId || orderData.id;

                    // Persist financial fields directly in Firestore (backend may not store these)
                    if (savedId) {
                        await setDoc(doc(db, EXTERNAL_ORDER_PRICING_COLLECTION, savedId), {
                            quantity:        qty,
                            shippingCharged: shippingCharged,
                            transactionCost: transactionCost,
                            vendorCostPerUnit: vendorCostPerUnit,
                            productId:       productId || null,
                            updatedAt:       serverTimestamp()
                        }, { merge: true });
                    }

                    // Decrease inventory only for new orders with a linked product
                    if (isNew && productId && qty > 0) {
                        const catalogItem = state.items.find(i => i.id === productId);
                        if (catalogItem) {
                            const newStock = Math.max(0, (catalogItem.stock || 0) - qty);
                            await updateDoc(doc(db, ITEMS_COLLECTION, productId), {
                                stock: newStock,
                                updatedAt: serverTimestamp()
                            });
                            await logAdminAction('INVENTORY_DECREASED', {
                                itemId:   productId,
                                item:     catalogItem.name,
                                action:   'external_order',
                                platform: orderData.platform,
                                amount:   qty,
                                oldStock: catalogItem.stock,
                                newStock
                            }, productId);
                        }
                    }

                    alert(orderData.id ? 'Order updated successfully!' : 'Order added successfully!');
                    window.module.closeExternalOrderModal();
                    await window.module.fetchExternalOrders();

                } catch (error) {
                    console.error('Error saving order:', error);
                    alert('Failed to save order. Please try again.');
                }
            },

            deleteExternalOrder: async function (orderId) {
                if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
                    return;
                }

                try {
                    const idToken = await auth.currentUser.getIdToken();
                    const response = await fetch(DELETE_EXTERNAL_ORDER, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${idToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ orderId })
                    });

                    if (!response.ok) throw new Error('Failed to delete order');

                    alert('Order deleted successfully!');
                    await window.module.fetchExternalOrders();

                } catch (error) {
                    console.error('Error deleting order:', error);
                    alert('Failed to delete order. Please try again.');
                }
            },

            loadEbaySyncStatus: async function () {
                const el = document.getElementById('ebaySyncStatusText');
                if (!el) return;
                try {
                    const snap = await getDoc(doc(db, 'admin', 'ebay_sync_state'));
                    if (!snap.exists()) {
                        el.textContent = 'eBay sync: never run — will poll every 15 min';
                        return;
                    }
                    const d = snap.data();
                    const lastRun = d.lastRunAt?.toDate?.();
                    const result  = d.lastResult || {};
                    const errMsg  = d.lastError  || null;

                    if (errMsg) {
                        el.innerHTML = `<span class="text-red-500">⚠️ Last sync failed: ${escapeHtml(errMsg)}</span>`;
                    } else if (lastRun) {
                        const ago = Math.round((Date.now() - lastRun.getTime()) / 60000);
                        el.innerHTML =
                            `✅ Last synced ${ago < 2 ? 'just now' : ago + ' min ago'} — ` +
                            `${result.created || 0} new, ${result.updated || 0} updated` +
                            (result.errors?.length ? ` <span class="text-red-500">(${result.errors.length} errors)</span>` : '');
                    } else {
                        el.textContent = 'eBay sync ready — polling every 15 min';
                    }
                } catch (e) {
                    el.textContent = 'Could not load eBay sync status';
                }
            },

            triggerEbaySync: async function () {
                const btn = document.getElementById('ebaySyncBtn');
                if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }
                try {
                    const idToken = await auth.currentUser.getIdToken();
                    const res = await fetch('/.netlify/functions/ebaySyncOrders', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${idToken}` }
                    });
                    if (res.ok) {
                        showMessage('success', 'eBay sync triggered — orders will appear shortly.', 4000, 'externalOrders');
                        setTimeout(() => window.module.fetchExternalOrders(), 3000);
                        setTimeout(() => window.module.loadEbaySyncStatus(), 3500);
                    } else {
                        showMessage('error', 'eBay sync trigger failed.', 4000, 'externalOrders');
                    }
                } catch (e) {
                    showMessage('error', `eBay sync error: ${e.message}`, 4000, 'externalOrders');
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync eBay'; }
                }
            },

            formatDate: function (dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            },

            handleStockAdjustment: async function (itemId, adjustment, setToZero = false) {
                resetTimer();
                try {
                    const item = state.items.find(i => i.id === itemId);
                    if (!item) {
                        showMessage('error', 'Product not found.', 3000, 'inventory');
                        return;
                    }

                    const currentStock = item.stock || 0;
                    let newStock;

                    if (setToZero) {
                        if (!confirm(`Are you sure you want to set stock to 0 for "${item.name}"?`)) {
                            return;
                        }
                        newStock = 0;
                    } else {
                        newStock = Math.max(0, currentStock + adjustment);

                        // Prevent going below 0
                        if (newStock < 0) {
                            showMessage('warning', 'Stock cannot be negative. Setting to 0.', 3000, 'inventory');
                            newStock = 0;
                        }
                    }

                    // Update Firestore
                    const itemRef = doc(db, ITEMS_COLLECTION, itemId);
                    await updateDoc(itemRef, {
                        stock: newStock,
                        updatedAt: serverTimestamp()
                    });

                    // Log the stock adjustment
                    await logAdminAction('STOCK_ADJUSTED', {
                        productId: itemId,
                        productName: item.name,
                        previousStock: currentStock,
                        newStock: newStock,
                        adjustment: adjustment,
                        setToZero: setToZero
                    }, itemId);

                    const actionText = setToZero
                        ? 'set to 0'
                        : (adjustment > 0
                            ? `increased by ${adjustment}`
                            : `decreased by ${Math.abs(adjustment)}`);

                    showMessage('success', `Stock for "${item.name}" ${actionText}. New stock: ${newStock}`, 3000, 'inventory');

                } catch (error) {
                    console.error('Error adjusting stock:', error);
                    showMessage('error', 'Failed to adjust stock. Check console for details.', 5000, 'inventory');
                }
            },

            handleStockDirectUpdate: async function (itemId, newStockValue) {
                resetTimer();
                try {
                    const item = state.items.find(i => i.id === itemId);
                    if (!item) {
                        showMessage('error', 'Product not found.', 3000, 'inventory');
                        return;
                    }

                    const newStock = parseInt(newStockValue, 10);

                    if (isNaN(newStock) || newStock < 0) {
                        showMessage('error', 'Please enter a valid stock number (0 or greater).', 3000, 'inventory');
                        // Reset the input to the current stock
                        const input = document.getElementById(`stock-input-${itemId}`);
                        if (input) input.value = item.stock || 0;
                        return;
                    }

                    const currentStock = item.stock || 0;

                    if (newStock === currentStock) {
                        return; // No change needed
                    }

                    // Update Firestore
                    const itemRef = doc(db, ITEMS_COLLECTION, itemId);
                    await updateDoc(itemRef, {
                        stock: newStock,
                        updatedAt: serverTimestamp()
                    });

                    // Log the stock adjustment
                    await logAdminAction('STOCK_UPDATED', {
                        productId: itemId,
                        productName: item.name,
                        previousStock: currentStock,
                        newStock: newStock,
                        method: 'direct_input'
                    }, itemId);

                    showMessage('success', `Stock for "${item.name}" updated to ${newStock}`, 2000, 'inventory');

                } catch (error) {
                    console.error('Error updating stock:', error);
                    showMessage('error', 'Failed to update stock. Check console for details.', 5000, 'inventory');

                    // Reset the input to the current stock on error
                    const item = state.items.find(i => i.id === itemId);
                    const input = document.getElementById(`stock-input-${itemId}`);
                    if (input && item) input.value = item.stock || 0;
                }
            },
