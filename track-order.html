<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18055277652"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order | AutoInx</title>
    <meta name="description" content="Track your AutoInx order in real time. Enter your order number and email, or sign in to see all your orders.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://autoinx.com/track-order.html">
    <meta property="og:title"       content="Track Your Order | AutoInx">
    <meta property="og:description" content="Real-time order tracking for AutoInx customers.">
    <meta property="og:url"         content="https://autoinx.com/track-order.html">
    <meta property="og:image"       content="https://autoinx.com/images/AutoInx logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/AutoInx logo.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f0f4f8;
            --surface:   #ffffff;
            --border:    #e2e8f0;
            --indigo:    #4f46e5;
            --indigo-lt: #eef2ff;
            --indigo-dk: #4338ca;
            --green:     #16a34a;
            --green-lt:  #dcfce7;
            --yellow:    #d97706;
            --yellow-lt: #fef3c7;
            --blue:      #2563eb;
            --blue-lt:   #dbeafe;
            --red:       #dc2626;
            --red-lt:    #fee2e2;
            --gray:      #64748b;
            --text:      #0f172a;
            --text-2:    #475569;
            --mono:      'DM Mono', monospace;
            --sans:      'DM Sans', sans-serif;
            --radius:    16px;
            --shadow:    0 1px 4px rgba(0,0,0,.06);
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 10;
        }
        .logo { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
        .logo img { height: 32px; }
        .logo-name { font-weight: 700; font-size: 1.1rem; color: var(--indigo); letter-spacing: -.02em; }
        .header-right { display: flex; align-items: center; gap: .75rem; }
        .back-link { font-size: .85rem; font-weight: 600; color: var(--gray); text-decoration: none; display: flex; align-items: center; gap: .3rem; transition: color .15s; }
        .back-link:hover { color: var(--indigo); }
        .lang-btn { font-size: .78rem; font-weight: 700; padding: .3rem .7rem; border: 1.5px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; color: var(--gray); transition: all .15s; }
        .lang-btn:hover { border-color: var(--indigo); color: var(--indigo); }

        /* ── Layout ── */
        .page { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
        .page-title { font-size: 1.75rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: .35rem; }
        .page-sub   { color: var(--text-2); font-size: .95rem; margin-bottom: 2rem; }

        /* ── Auth loading state ── */
        #authLoader {
            display: flex; align-items: center; justify-content: center;
            padding: 3rem; gap: .75rem; color: var(--gray); font-size: .95rem;
        }
        .spin { width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--indigo); border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Guest search card ── */
        .search-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .card-label { font-size: .75rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1.25rem; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .875rem; margin-bottom: .875rem; }
        @media (max-width: 540px) { .field-row { grid-template-columns: 1fr; } }
        .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-2); margin-bottom: .375rem; }
        .field input {
            width: 100%; padding: .65rem .85rem;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-family: var(--sans); font-size: .95rem;
            transition: border-color .15s, box-shadow .15s;
            outline: none; background: #fafafa;
        }
        .field input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,.12); background: #fff; }
        .field input.mono { font-family: var(--mono); letter-spacing: .04em; }

        .btn-primary {
            width: 100%; padding: .8rem;
            background: var(--indigo); color: #fff;
            border: none; border-radius: 10px;
            font-family: var(--sans); font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background .15s, transform .1s;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
        }
        .btn-primary:hover { background: var(--indigo-dk); }
        .btn-primary:active { transform: scale(.99); }
        .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

        .search-error { margin-top: .75rem; padding: .65rem .875rem; background: var(--red-lt); border: 1px solid #fca5a5; border-radius: 8px; font-size: .875rem; color: var(--red); font-weight: 500; }

        /* ── Logged-in orders list ── */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.25rem; flex-wrap: wrap; gap: .5rem;
        }
        .section-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; }
        .order-count { font-size: .8rem; color: var(--gray); background: var(--border); padding: .2rem .6rem; border-radius: 999px; font-weight: 600; }

        .orders-empty {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2.5rem;
            text-align: center; color: var(--text-2);
            box-shadow: var(--shadow);
        }
        .orders-empty .icon { font-size: 2.5rem; margin-bottom: .75rem; }
        .orders-empty p { font-size: .95rem; }

        /* ── Order summary card (in list) ── */
        .order-summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .order-summary-card:hover { border-color: #c7d2fe; box-shadow: 0 4px 16px rgba(79,70,229,.1); }

        .order-summary-header {
            padding: 1rem 1.25rem;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem;
            cursor: pointer; user-select: none;
        }
        .order-summary-left { display: flex; align-items: center; gap: .875rem; }
        .order-thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--indigo-lt); border: 1px solid #c7d2fe; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; }
        .order-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .order-summary-meta { }
        .order-summary-id { font-family: var(--mono); font-size: .88rem; font-weight: 500; color: var(--indigo); }
        .order-summary-date { font-size: .78rem; color: var(--text-2); margin-top: .1rem; }
        .order-summary-right { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
        .order-summary-total { font-size: .95rem; font-weight: 700; color: var(--text); }
        .expand-btn { 
            width: 28px; height: 28px; border-radius: 8px; background: var(--bg);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: .75rem; color: var(--gray); transition: all .15s; flex-shrink: 0;
        }
        .order-summary-card.expanded .expand-btn { background: var(--indigo-lt); color: var(--indigo); border-color: #c7d2fe; transform: rotate(180deg); }

        .order-detail-panel { display: none; border-top: 1px solid var(--border); }
        .order-summary-card.expanded .order-detail-panel { display: block; }

        /* ── Order detail (shared by list + search result) ── */
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .order-header {
            padding: 1.25rem 1.75rem;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem;
            background: var(--indigo-lt);
        }
        .order-id   { font-family: var(--mono); font-size: .95rem; font-weight: 500; color: var(--indigo); }
        .order-date { font-size: .8rem; color: var(--text-2); }

        /* ── Status timeline ── */
        .timeline { padding: 1.5rem 1.75rem; border-bottom: 1px solid var(--border); }
        .timeline h3 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-bottom: 1.25rem; }
        .steps { display: flex; align-items: flex-start; position: relative; }
        .step  { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .step-line { position: absolute; top: 14px; left: 50%; right: -50%; height: 2px; background: var(--border); z-index: 0; }
        .step:last-child .step-line { display: none; }
        .step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid var(--border); background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            font-size: .8rem; position: relative; z-index: 1; transition: all .25s;
        }
        .step-dot.done     { background: var(--green);  border-color: var(--green);  color: #fff; }
        .step-dot.active   { background: var(--indigo); border-color: var(--indigo); color: #fff; box-shadow: 0 0 0 4px rgba(79,70,229,.18); }
        .step-dot.cancelled{ background: var(--red);    border-color: var(--red);    color: #fff; }
        .step-line.done    { background: var(--green); }
        .step-label        { font-size: .72rem; font-weight: 600; margin-top: .5rem; color: var(--text-2); text-align: center; }
        .step-label.active { color: var(--indigo); }
        .step-label.done   { color: var(--green); }

        /* ── Tracking banner ── */
        .tracking-banner {
            margin: 1.25rem 1.75rem 0;
            padding: .875rem 1.1rem;
            background: var(--blue-lt); border: 1px solid #bfdbfe; border-radius: 10px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
        }
        .tracking-banner .label  { font-size: .8rem; font-weight: 600; color: #1e40af; }
        .tracking-banner .number { font-family: var(--mono); font-size: .9rem; color: #1e40af; }
        .tracking-link {
            font-size: .8rem; font-weight: 700; color: var(--blue);
            text-decoration: none; padding: .35rem .75rem;
            border: 1.5px solid var(--blue); border-radius: 7px; transition: background .15s; white-space: nowrap;
        }
        .tracking-link:hover { background: var(--blue); color: #fff; }

        /* ── Payment row ── */
        .payment-row {
            padding: 1rem 1.75rem; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
        }
        .badge {
            display: inline-flex; align-items: center; gap: .3rem;
            padding: .3rem .75rem; border-radius: 999px; font-size: .78rem; font-weight: 700;
        }
        .badge.paid       { background: var(--green-lt);  color: var(--green); }
        .badge.unpaid     { background: var(--yellow-lt); color: var(--yellow); }
        .badge.processing { background: var(--blue-lt);   color: var(--blue); }
        .badge.pending    { background: var(--yellow-lt); color: var(--yellow); }
        .badge.delivered  { background: var(--green-lt);  color: var(--green); }
        .badge.cancelled  { background: var(--red-lt);    color: var(--red); }
        .badge.shipped    { background: var(--blue-lt);   color: var(--blue); }
        .pay-now-btn {
            padding: .35rem 1rem; background: var(--indigo); color: #fff;
            border-radius: 8px; text-decoration: none;
            font-size: .82rem; font-weight: 700; transition: background .15s;
        }
        .pay-now-btn:hover { background: var(--indigo-dk); }

        /* ── Items ── */
        .items-section { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); }
        .items-section h3 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-bottom: .875rem; }
        .item-row { display: flex; align-items: center; gap: .875rem; padding: .6rem 0; border-bottom: 1px solid #f1f5f9; }
        .item-row:last-child { border-bottom: none; }
        .item-img    { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; flex-shrink: 0; }
        .item-img-ph { width: 48px; height: 48px; border-radius: 8px; background: #f1f5f9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .item-name  { flex: 1; font-size: .9rem; font-weight: 600; }
        .item-qty   { font-size: .8rem; color: var(--text-2); }
        .item-price { font-size: .9rem; font-weight: 700; color: var(--indigo); white-space: nowrap; }

        /* ── Totals ── */
        .totals { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); }
        .totals-row { display: flex; justify-content: space-between; font-size: .9rem; padding: .3rem 0; color: var(--text-2); }
        .totals-row.grand    { font-size: 1.05rem; font-weight: 700; color: var(--text); border-top: 1.5px solid var(--border); padding-top: .6rem; margin-top: .3rem; }
        .totals-row.discount { color: var(--green); }

        /* ── Address ── */
        .address-section { padding: 1.25rem 1.75rem; }
        .address-section h3 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-bottom: .5rem; }
        .address-text { font-size: .9rem; color: var(--text-2); line-height: 1.5; }

        /* ── User greeting banner ── */
        .user-banner {
            display: flex; align-items: center; gap: 1rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem 1.25rem;
            margin-bottom: 1.5rem; box-shadow: var(--shadow);
        }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--indigo-lt); border: 2px solid #c7d2fe;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700; color: var(--indigo); flex-shrink: 0;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: 700; font-size: .95rem; }
        .user-email { font-size: .8rem; color: var(--gray); }
        .sign-out-btn {
            font-size: .78rem; font-weight: 700; color: var(--gray);
            border: 1.5px solid var(--border); border-radius: 8px;
            background: none; cursor: pointer; padding: .3rem .75rem;
            transition: all .15s; white-space: nowrap;
        }
        .sign-out-btn:hover { border-color: var(--red); color: var(--red); }

        /* ── Guest sign-in nudge ── */
        .sign-in-nudge {
            background: var(--indigo-lt); border: 1px solid #c7d2fe;
            border-radius: var(--radius); padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: .875rem; flex-wrap: wrap;
        }
        .sign-in-nudge .nudge-icon { font-size: 1.25rem; flex-shrink: 0; }
        .sign-in-nudge .nudge-text { flex: 1; font-size: .88rem; color: var(--indigo); }
        .sign-in-nudge .nudge-text strong { display: block; font-weight: 700; margin-bottom: .15rem; }
        .btn-sign-in {
            padding: .45rem 1.1rem; background: var(--indigo); color: #fff;
            border: none; border-radius: 8px; font-family: var(--sans);
            font-size: .85rem; font-weight: 700; cursor: pointer; transition: background .15s;
            white-space: nowrap;
        }
        .btn-sign-in:hover { background: var(--indigo-dk); }

        /* Loading orders spinner */
        .orders-loading {
            display: flex; align-items: center; justify-content: center;
            padding: 2.5rem; gap: .75rem; color: var(--gray); font-size: .9rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }

        /* ── Detail spinner ── */
        .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }

        /* tracking separator line */
        .tracking-sep { height: 1.25rem; border-bottom: 1px solid var(--border); }

        /* Guest search result */
        #guestResult { display: none; }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">
        <img src="/images/AutoInx logo.png" alt="AutoInx">
        <span class="logo-name">AutoInx</span>
    </a>
    <div class="header-right">
        <button class="lang-btn" onclick="toggleLang()" id="langBtn">ES</button>
        <a href="/" class="back-link">← <span id="backTxt">Back to store</span></a>
    </div>
</header>

<div class="page">
    <h1 class="page-title" id="pageTitle">Track Your Order</h1>
    <p class="page-sub" id="pageSub"></p>

    <!-- Auth loading -->
    <div id="authLoader">
        <div class="spin"></div>
        <span id="authLoaderTxt">Loading…</span>
    </div>

    <!-- ═══════════ LOGGED-IN VIEW ═══════════ -->
    <div id="loggedInView" style="display:none">
        <!-- User banner -->
        <div class="user-banner">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <div class="user-name" id="userName"></div>
                <div class="user-email" id="userEmail"></div>
            </div>
            <button class="sign-out-btn" onclick="handleSignOut()" id="signOutBtn">Sign out</button>
        </div>

        <!-- Orders list -->
        <div id="ordersLoadingEl" class="orders-loading" style="display:none">
            <div class="spin" style="border-top-color:var(--indigo)"></div>
            <span id="ordersLoadingTxt">Loading your orders…</span>
        </div>

        <div id="ordersListEl" style="display:none">
            <div class="section-header">
                <div class="section-title" id="myOrdersTitle">My Orders</div>
                <span class="order-count" id="orderCountBadge"></span>
            </div>
            <div id="ordersContainer"></div>
        </div>

        <div id="ordersEmptyEl" class="orders-empty" style="display:none">
            <div class="icon">📦</div>
            <p id="ordersEmptyTxt">You don't have any orders yet.</p>
            <p style="font-size:.8rem;color:var(--gray);margin-top:.5rem;" id="ordersEmptyHint">
                If you placed an order as a guest, use the search below.
            </p>
            <button onclick="document.getElementById('guestView').style.display='block';document.getElementById('ordersEmptyEl').style.display='none';"
                    style="margin-top:.875rem;padding:.5rem 1.25rem;background:var(--indigo);color:#fff;border:none;border-radius:10px;font-size:.875rem;font-weight:700;cursor:pointer;">
                Look up by order number
            </button>
        </div>
    </div>

    <!-- ═══════════ GUEST VIEW ═══════════ -->
    <div id="guestView" style="display:none">
        <!-- Sign-in nudge -->
        <div class="sign-in-nudge">
            <div class="nudge-icon">✨</div>
            <div class="nudge-text">
                <strong id="nudgeTitle">Sign in for instant access</strong>
                <span id="nudgeBody">Log in to see all your orders in one place — no order number needed.</span>
            </div>
            <button class="btn-sign-in" onclick="goToSignIn()" id="signInBtn">Sign in</button>
        </div>

        <!-- Search card -->
        <div class="search-card">
            <div class="card-label" id="lookupLabel">Order Lookup</div>
            <div class="field-row">
                <div class="field">
                    <label id="orderLabel">Order Number</label>
                    <input type="text" id="orderInput" class="mono" placeholder="e.g. a1b2c3d4"
                           maxlength="20" oninput="this.value=this.value.replace(/\s/g,'').toLowerCase()"
                           onkeydown="if(event.key==='Enter')lookupOrder()">
                </div>
                <div class="field">
                    <label id="emailLabel">Email Address</label>
                    <input type="email" id="emailInput" placeholder="you@example.com"
                           onkeydown="if(event.key==='Enter')lookupOrder()">
                </div>
            </div>
            <button class="btn-primary" onclick="lookupOrder()" id="trackBtn">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <span id="trackBtnTxt">Track Order</span>
            </button>
            <div id="searchError" style="display:none" class="search-error"></div>
        </div>

        <!-- Guest result -->
        <div id="guestResult">
            <div class="order-card" id="guestOrderCard"></div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut }
                                     from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs }
                                     from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ── i18n ────────────────────────────────────────────────────────────────
    let lang = localStorage.getItem('trackLang') ||
               (navigator.language.startsWith('es') ? 'es' : 'en');

    const T = {
        en: {
            pageTitle:       'Track Your Order',

        $('lookupLabel').textContent   = t('lookupLabel');

        $('ordersEmptyTxt').textContent   = t('ordersEmptyTxt');

    // ── Firebase init ────────────────────────────────────────────────────────
    let db, auth, ORDERS_COLL;
    const PAYMENT_CONFIRMATIONS_COLL = 'payment_confirmations';

    async function initFirebase() {
        try {
            const res  = await fetch('/.netlify/functions/getClientFirebaseConfig');
            const cfg  = await res.json();
            const app  = initializeApp(cfg);
            auth       = getAuth(app);
            db         = getFirestore(app);

            // Orders are always written to 'default-app-id' by checkout.html.
            // cfg.appId is the Firebase App ID string (e.g. "1:123:web:abc"),
            // NOT the Firestore path segment — use the same literal as checkout.html.
            ORDERS_COLL = 'artifacts/default-app-id/public/data/orders';
            return true;
        } catch (e) {
            console.error('Firebase init failed', e);
            return false;
        }
    }

    // ── Auth state ────────────────────────────────────────────────────────────
    async function boot() {
        applyLang('');
        const ok = await initFirebase();
        if (!ok) { showGuestView(); return; }

        const _pendingParams  = new URLSearchParams(location.search);
        const _pendingMethod  = _pendingParams.get('pending');
        const _pendingOrderId = _pendingParams.get('order');
        const _urlToken       = _pendingParams.get('token');
        const _urlEmail       = _pendingParams.get('email');

        // ── Token auto-auth: link from confirmation email ─────────────────────
        // If URL has ?order=ID&email=X&token=T, verify the token server-side and
        // show the order directly — no email re-entry needed.
        if (_pendingOrderId && _urlToken && _urlEmail) {
            try {
                const res = await fetch('/.netlify/functions/verifyOrderToken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: _pendingOrderId, email: _urlEmail, token: _urlToken })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.valid && data.order) {
                        // Pre-fill inputs and render order directly
                        showGuestView();
                        if ($('orderInput')) $('orderInput').value = _pendingOrderId.slice(0, 20);
                        if ($('emailInput')) $('emailInput').value = _urlEmail;
                        renderGuestOrder(data.order, _pendingMethod);
                        // Save to localStorage for future visits
                        try { localStorage.setItem('autoinx_last_order', JSON.stringify({ orderId: _pendingOrderId, email: _urlEmail, savedAt: Date.now() })); } catch {}
                        // Clean the URL so the token isn't visible after load
                        window.history.replaceState({}, '', `/track-order.html?order=${_pendingOrderId}`);
                        return; // Skip normal auth flow
                    }
                }
            } catch (e) {
                console.warn('Token auto-auth failed, falling back to normal flow:', e.message);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user && !user.isAnonymous) {
                user.getIdToken(false).then(token =>
                    fetch('/.netlify/functions/linkUserOrders', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                    }).catch(() => {})
                ).catch(() => {});

                window._currentUser = user;
                showLoggedInView(user);
                await loadUserOrders(user);

                if (_pendingMethod && _pendingOrderId) {
                    setTimeout(() => window.showPaymentConfirmationPanel(_pendingOrderId, _pendingMethod, user), 300);
                }
            } else if (user && user.isAnonymous) {
                showGuestView();
            } else {
                showGuestView();
            }
        });
    }

    function showLoggedInView(user) {
        window._currentMode = 'loggedin';
        applyLang('loggedin');
        $('authLoader').style.display    = 'none';
        $('guestView').style.display     = 'none';
        $('loggedInView').style.display  = 'block';

        // Avatar initials
        const name  = user.displayName || '';
        const email = user.email || '';
        const init  = name ? name.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : '?');
        $('userAvatar').textContent = init;
        $('userName').textContent   = name || email;
        $('userEmail').textContent  = email;
    }

    function showGuestView() {
        window._currentMode = 'guest';
        applyLang('guest');
        $('authLoader').style.display   = 'none';
        $('loggedInView').style.display = 'none';
        $('guestView').style.display    = 'block';
        readUrlParams();
        _prefillFromLocalStorage();
    }

    function _prefillFromLocalStorage() {
        // Only pre-fill if URL didn't already provide the order
        const urlOrder = new URLSearchParams(location.search).get('order') || new URLSearchParams(location.search).get('orderId');
        if (urlOrder) return;

        try {
            const saved = JSON.parse(localStorage.getItem('autoinx_last_order') || 'null');
            if (!saved) return;

            // Expire after 30 days
            if (Date.now() - saved.savedAt > 30 * 24 * 3600 * 1000) {
                localStorage.removeItem('autoinx_last_order');
                return;
            }

            if (saved.orderId && $('orderInput') && !$('orderInput').value) {
                $('orderInput').value = saved.orderId;
            }
            if (saved.email && $('emailInput') && !$('emailInput').value) {
                $('emailInput').value = saved.email;
            }

            // Show a subtle "welcome back" hint
            const hint = document.createElement('p');
            hint.style.cssText = 'font-size:.75rem;color:#6366f1;margin:6px 0 0;text-align:center;';
            hint.textContent = lang === 'es'
                ? '↑ Tu último pedido fue precargado'
                : '↑ Pre-filled from your last lookup';
            $('trackBtn')?.insertAdjacentElement('afterend', hint);
            setTimeout(() => hint.remove(), 4000);
        } catch {}
    }

    window.handleSignOut = async () => {
        try { await signOut(auth); } catch {}
    };

    window.goToSignIn = () => { window.location.href = '/?signin=1#account'; };

    // ── Load user orders from Firestore ──────────────────────────────────────
    async function loadUserOrders(user) {
        $('ordersLoadingEl').style.display = 'flex';
        $('ordersListEl').style.display    = 'none';
        $('ordersEmptyEl').style.display   = 'none';

        try {
            // Get a fresh ID token to send to the server-side function.
            // This bypasses Firestore client-side security rules entirely —
            // the function uses the Admin SDK which has full read access.
            const idToken = await user.getIdToken(/* forceRefresh= */ false);

            const res = await fetch('/.netlify/functions/getUserOrders', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${idToken}`,
                },
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || `Server error ${res.status}`);
            }

            const data   = await res.json();
            const orders = data.orders || [];

            window._orders = orders;
            $('ordersLoadingEl').style.display = 'none';

            if (orders.length === 0) {
                $('ordersEmptyEl').style.display = 'block';
            } else {
                $('orderCountBadge').textContent = tf('orderItems', orders.length);
                $('ordersListEl').style.display  = 'block';
                renderOrdersList(orders);
            }
        } catch (err) {
            console.error('Load orders error:', err);
            $('ordersLoadingEl').style.display = 'none';
            $('ordersEmptyEl').style.display   = 'block';
        }
    }

    // ── Render orders list ───────────────────────────────────────────────────

                    ${(() => {

                        const _oMethod  = order.paymentMethod || '';
                        const _oPsLower = (order.paymentStatus || '').toLowerCase();
                        const _oIsAlt   = !_oPaid && _oMethod !== 'card';

                              + '<p style="font-weight:700;color:#16a34a;margin:0 0 2px;font-size:.9rem;">' + (_isSp ? 'Comprobante enviado' : 'Confirmation submitted') + '</p>'
                              + '<p style="font-size:.78rem;color:#6b7280;margin:0;">' + (_isSp ? 'Estamos revisando tu pago.' : 'We are reviewing your payment.') + '</p>'
                              + '</div></div>'
                            : '<div style="background:#fefce8;border:2px solid #fde68a;border-radius:12px;padding:14px 16px;margin-bottom:12px;">'
                              + '<p style="font-weight:700;color:#92400e;margin:0 0 6px;font-size:.875rem;">' + _icon + ' ' + (_isSp ? 'Envia tu pago y sube el comprobante' : 'Send payment &amp; upload your proof') + '</p>'
                              + '<p style="font-size:.8rem;color:#78350f;margin:0 0 10px;">' + (_isSp ? 'Sube tu comprobante para confirmar tu pedido.' : 'Upload your proof of payment to confirm your order.') + '</p>'

    window.toggleOrder = (id) => {
        const card = document.getElementById(`ocard-${id}`);
        if (card) card.classList.toggle('expanded');

    // ── Build order detail HTML (shared by list + guest result) ─────────────
    function buildOrderDetailHtml(order) {
        const statusSteps = ['Pending', 'Processing', 'Shipped', 'Delivered'];
        const isCancelled = order.status === 'Cancelled';
        const currentStep = isCancelled ? -1 : Math.max(0, statusSteps.indexOf(order.status));
        const isPaid      = order.paymentStatus === 'Paid' || order.isPaid;
        const stepLabels  = T[lang].steps;

        const timelineHtml = `
            <div class="timeline">
                <h3>${t('timeline')}</h3>
                <div class="steps">
                    ${statusSteps.map((step, i) => {
                        const isDone   = !isCancelled && i < currentStep;
                        const isActive = !isCancelled && i === currentStep;
                        const cls  = isDone ? 'done' : isActive ? 'active' : '';
                        const icon = isDone   ? '✓'
                                   : isActive ? (step === 'Shipped' ? '🚚' : step === 'Delivered' ? '✅' : '●')
                                   : '';
                        return `
                        <div class="step">
                            <div class="step-line ${isDone ? 'done' : ''}"></div>
                            <div class="step-dot ${cls}">${icon}</div>
                            <div class="step-label ${cls}">${stepLabels[i]}</div>
                        </div>`;
                    }).join('')}
                    ${isCancelled ? `
                    <div class="step" style="flex:0;margin-left:1rem;">
                        <div class="step-dot cancelled">✕</div>
                        <div class="step-label" style="color:var(--red)">${t('cancelled')}</div>
                    </div>` : ''}
                </div>
            </div>`;

        const trackingHtml = order.trackingNumber ? `
            <div class="tracking-banner">
                <div>
                    <div class="label">📦 ${t('carrier')}: ${order.shippingDetails?.provider || ''}</div>
                    <div class="number">${order.trackingNumber}</div>
                </div>
                ${order.trackingUrl ? `<a href="${order.trackingUrl}" target="_blank" class="tracking-link">${t('trackShipment')} →</a>` : ''}
            </div>
            <div class="tracking-sep"></div>` : '';

        const paidBadge   = `<span class="badge paid">✅ ${t('paidOn')}${order.paidAt ? ' · ' + new Date(order.paidAt).toLocaleDateString() : ''}</span>`;
        const unpaidBadge = `<span class="badge unpaid">⏳ Payment: Pending</span>`;
        const paymentHtml = `
            <div class="payment-row">
                ${isPaid ? paidBadge : unpaidBadge}
                ${!isPaid && order.stripePaymentUrl
                    ? `<a href="${order.stripePaymentUrl}" class="pay-now-btn">💳 ${t('payNow')}</a>
                       <span style="font-size:.8rem;color:var(--text-2);">${t('unpaidNote')}</span>`
                    : ''}
            </div>`;

        const items = order.items || [];
        const itemsHtml = `
            <div class="items-section">
                <h3>${t('items')}</h3>
                ${items.map(item => {
                    const img = item.imageUrl || item.imageUrls?.[0] || '';
                    return `
                    <div class="item-row">
                        ${img ? `<img class="item-img" src="${img}" alt="">` : `<div class="item-img-ph">📦</div>`}
                        <div class="item-name">${item.name || ''}</div>
                        <div class="item-qty">×${item.quantity}</div>
                        <div class="item-price">${fmt((item.price || 0) * item.quantity)}</div>
                    </div>`;
                }).join('')}
            </div>`;

        const sub   = order.subtotalCents || 0;
        const ship  = order.shippingCents || 0;
        const tax   = order.taxCents || 0;
        const disc  = order.discountCents || 0;
        const total = order.totalCents || (sub + ship + tax - disc);
        const totalsHtml = `
            <div class="totals">
                <div class="totals-row"><span>${t('subtotal')}</span><span>${fmt(sub)}</span></div>
                ${ship > 0 ? `<div class="totals-row"><span>📦 ${t('shipping')}</span><span>${fmt(ship)}</span></div>` : ''}
                ${tax  > 0 ? `<div class="totals-row"><span>${t('tax')}</span><span>${fmt(tax)}</span></div>` : ''}
                ${disc > 0 ? `<div class="totals-row discount"><span>🏷️ ${t('discount')}${order.discount?.code ? ` (${order.discount.code})` : ''}</span><span>−${fmt(disc)}</span></div>` : ''}
                <div class="totals-row grand"><span>${t('total')}</span><span>${fmt(total)}</span></div>
            </div>`;

        const addressHtml = order.deliveryAddress ? `
            <div class="address-section">
                <h3>📍 ${t('address')}</h3>
                <div class="address-text">${order.deliveryAddress}</div>
            </div>` : '';

        const isSp = lang === 'es';

        return timelineHtml + trackingHtml + paymentHtml + itemsHtml + totalsHtml + addressHtml;
    }

    // ── Guest order lookup (server-side, no PII exposed) ─────────────────────
    window.lookupOrder = async function() {
        const rawId = $('orderInput').value.trim();
        const email = $('emailInput').value.trim();
        const errEl = $('searchError');

        errEl.style.display = 'none';
        $('guestResult').style.display = 'none';

        if (!rawId || !email) { showErr(t('enterBoth')); return; }

        setGuestLoading(true);
        try {
            const res  = await fetch('/.netlify/functions/getOrderStatus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId: rawId, email }),
            });
            const data = await res.json();
            if (!res.ok) { showErr(data.error || t('notFound')); return; }

            // Save to localStorage so returning visitors don't have to re-enter
            try {
                localStorage.setItem('autoinx_last_order', JSON.stringify({
                    orderId: rawId, email, savedAt: Date.now()
                }));
            } catch {}

            renderGuestOrder(data.order, new URLSearchParams(location.search).get('pending'));
        } catch {
            showErr(t('notFound'));
        } finally {
            setGuestLoading(false);
        }
    };

    function renderGuestOrder(order, explicitPendingMethod) {
        const placedDate = order.timestamp
            ? new Date(order.timestamp).toLocaleDateString(lang === 'es' ? 'es-CO' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            : '';
        const status   = order.status || 'Pending';
        const statusLc = status.toLowerCase();

        const headerHtml = `
            <div class="order-header">
                <div>
                    <div class="order-id">#${order.id.substring(0,8).toUpperCase()}</div>
                    ${placedDate ? `<div class="order-date">${t('placedOn')} ${placedDate}</div>` : ''}
                </div>
                <span class="badge ${statusLc}">${status}</span>
            </div>`;

        // Add payment confirmation CTA for Zelle/Cash orders
        // Use explicitly passed method first, fall back to URL param, then order data
        const pendingMethod = explicitPendingMethod
            || new URLSearchParams(location.search).get('pending')
            || null;
        // Also treat "Pending - Zelle" / "Pending - Cash" paymentStatus as alt pay
        const paymentStatusLower = (order.paymentStatus || '').toLowerCase();
        const isAltPay = order.paymentMethod === 'zelle'
            || order.paymentMethod === 'cash'
            || pendingMethod
            || paymentStatusLower.includes('zelle')
            || paymentStatusLower.includes('cash');
        const resolvedMethod = order.paymentMethod === 'zelle' || order.paymentMethod === 'cash'
            ? order.paymentMethod
            : pendingMethod
            || (paymentStatusLower.includes('zelle') ? 'zelle' : null)
            || (paymentStatusLower.includes('cash')  ? 'cash'  : null)
            || 'zelle';
        const isPaid   = order.isPaid || order.paymentStatus === 'Paid';
        const alreadySubmitted = order.paymentConfirmationSubmitted;
        const isSp = lang === 'es';

        const paymentCta = (isAltPay && !isPaid) ? `
        <div style="margin-top:16px;background:${alreadySubmitted ? '#f0fdf4' : '#fefce8'};border:2px solid ${alreadySubmitted ? '#bbf7d0' : '#fde68a'};border-radius:12px;padding:16px;">
            ${alreadySubmitted
                ? `<p style="font-weight:700;color:#16a34a;margin:0 0 4px;">✅ ${isSp ? 'Comprobante enviado' : 'Confirmation submitted'}</p>
                   <p style="font-size:13px;color:#6b7280;margin:0;">${isSp ? 'Estamos revisando tu pago.' : 'We are reviewing your payment.'}</p>`
                : `<p style="font-weight:700;color:#92400e;margin:0 0 8px;">💳 ${isSp ? '¿Ya pagaste? Sube tu comprobante' : 'Already paid? Upload your confirmation'}</p>
                   <button onclick="showGuestPaymentConfirmation('${order.id}', '${resolvedMethod}')"
                           style="background:#d97706;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;">
                       📎 ${isSp ? 'Subir Comprobante' : 'Upload Confirmation'}
                   </button>`
            }
        </div>` : '';

        $('guestOrderCard').innerHTML = headerHtml + buildOrderDetailHtml(order) + paymentCta;
        $('guestResult').style.display = 'block';
        $('guestResult').scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Auto-show panel if ?pending= is in URL and not yet submitted
        if (isAltPay && !alreadySubmitted && !isPaid && (pendingMethod || resolvedMethod)) {
            setTimeout(() => showGuestPaymentConfirmation(order.id, resolvedMethod), 400);
        }
    }

    // Guest payment confirmation — order number + email verified, no account needed
    window.showGuestPaymentConfirmation = function(orderId, method) {
        const existing = document.getElementById('guestPayConfirmPanel');
        if (existing) existing.remove();

        const isZelle = method === 'zelle';
        const isSp    = lang === 'es';
        const ZELLE_EMAIL = window._zelleEmail || 'payments@autoinx.com';

        const panel = document.createElement('div');
        panel.id = 'guestPayConfirmPanel';
        panel.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
        panel.innerHTML = `
        <div style="background:#fff;border-radius:20px;box-shadow:0 25px 50px rgba(0,0,0,.2);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;">
            <div style="background:linear-gradient(135deg,${isZelle?'#7c3aed,#a855f7':'#16a34a,#22c55e'});padding:20px 24px;border-radius:20px 20px 0 0;">
                <h2 style="color:#fff;font-size:1.15rem;font-weight:900;margin:0;">${isZelle ? '🏦' : '💵'} ${isSp ? 'Confirmar Pago' : 'Confirm Payment'}</h2>
                <p style="color:rgba(255,255,255,.8);font-size:.8rem;margin:4px 0 0;">${isSp ? 'Pedido' : 'Order'} #${orderId.slice(0,8).toUpperCase()}</p>
            </div>
            <div style="padding:20px 24px;space-y:12px;">
                ${isZelle ? `<div style="background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:14px;margin-bottom:14px;">
                    <p style="font-size:.75rem;color:#6b7280;margin:0 0 4px;">${isSp ? 'Envía a:' : 'Send to:'}</p>
                    <p style="font-size:1rem;font-weight:900;color:#7c3aed;margin:0;">${ZELLE_EMAIL}</p>
                </div>` : ''}

                <div style="margin-bottom:12px;">
                    <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">
                        ${isSp ? 'Adjuntar comprobante (foto/captura)' : 'Attach confirmation (photo/screenshot)'}
                    </label>
                    <label style="display:block;border:2px dashed #d1d5db;border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:#fafafa;" id="gpcDropzone">
                        <div id="gpcPreview"></div>
                        <p style="font-size:.8rem;color:#6b7280;margin:0;">📎 ${isSp ? 'Toca para adjuntar' : 'Tap to attach'}</p>
                        <input type="file" id="gpcFile" accept="image/*,application/pdf" style="display:none">
                    </label>
                </div>

                <div style="margin-bottom:12px;">
                    <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">${isSp ? 'Monto pagado ($)' : 'Amount paid ($)'}</label>
                    <input type="number" id="gpcAmount" step="0.01" placeholder="0.00"
                           style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
                </div>

                <div style="margin-bottom:12px;">
                    <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">${isSp ? 'Notas (opcional)' : 'Notes (optional)'}</label>
                    <textarea id="gpcNotes" rows="2" placeholder="${isSp ? 'Número de confirmación, fecha, etc.' : 'Confirmation number, date, etc.'}"
                              style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.8rem;resize:none;box-sizing:border-box;"></textarea>
                </div>

                <div id="gpcError" style="display:none;background:#fee2e2;border-radius:8px;padding:10px;font-size:.8rem;color:#dc2626;font-weight:600;margin-bottom:10px;"></div>

                <div style="display:flex;gap:10px;">
                    <button id="gpcSubmit"
                            style="flex:1;padding:11px;background:${isZelle?'#7c3aed':'#16a34a'};color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;">
                        ✅ ${isSp ? 'Enviar' : 'Submit'}
                    </button>
                    <button onclick="document.getElementById('guestPayConfirmPanel').remove()"
                            style="padding:11px 16px;background:#f3f4f6;color:#6b7280;border:none;border-radius:10px;font-size:.875rem;font-weight:600;cursor:pointer;">
                        ${isSp ? 'Cancelar' : 'Cancel'}
                    </button>
                </div>
            </div>
        </div>`;
        document.body.appendChild(panel);

        const fileInput = document.getElementById('gpcFile');
        document.getElementById('gpcDropzone').onclick = e => { if (e.target !== fileInput) fileInput.click(); };
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (!file) return;
            const preview = document.getElementById('gpcPreview');
            if (file.type.startsWith('image/')) {
                const url = URL.createObjectURL(file);
                preview.innerHTML = `<img src="${url}" style="max-height:100px;border-radius:6px;margin-bottom:4px;">`;
            } else {
                preview.innerHTML = `<p style="font-size:.75rem;color:#374151;font-weight:600;margin-bottom:4px;">📄 ${file.name}</p>`;
            }
        };

        document.getElementById('gpcSubmit').onclick = async () => {
            const file   = fileInput.files[0];
            const amount = parseFloat(document.getElementById('gpcAmount').value) || 0;
            const notes  = document.getElementById('gpcNotes').value.trim();
            const errEl  = document.getElementById('gpcError');
            const btn    = document.getElementById('gpcSubmit');
            errEl.style.display = 'none';

            if (!file && !notes) {
                errEl.textContent = isSp ? 'Adjunta un comprobante o añade una nota.' : 'Please attach a screenshot or add a note.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true; btn.textContent = '⏳';

            try {
                // Upload via a server-side function (guest has no Firebase auth)
                let screenshotUrl = null;
                if (file) {
                    const formData = new FormData();
                    formData.append('file',    file);
                    formData.append('orderId', orderId);
                    const uploadRes = await fetch('/.netlify/functions/uploadPaymentProof', {
                        method: 'POST', body: formData
                    });
                    if (uploadRes.ok) {
                        const uploadData = await uploadRes.json();
                        screenshotUrl = uploadData.url || null;
                    }
                }

                // Save confirmation via server-side function (no auth required for guest)
                const res = await fetch('/.netlify/functions/submitPaymentConfirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId, method, amountPaid: amount || null,
                        screenshotUrl, notes: notes || null,
                        customerEmail: $('emailInput')?.value?.trim() || null,
                        isGuest: true,
                    })
                });

                if (!res.ok) throw new Error('Submission failed');

                panel.innerHTML = `
                <div style="background:#fff;border-radius:20px;padding:36px;text-align:center;max-width:460px;width:100%;">
                    <div style="font-size:2.5rem;margin-bottom:10px;">✅</div>
                    <h2 style="font-size:1.15rem;font-weight:900;color:#16a34a;margin:0 0 8px;">${isSp ? '¡Enviado!' : 'Submitted!'}</h2>
                    <p style="font-size:.875rem;color:#6b7280;margin:0 0 18px;">${isSp ? 'Revisaremos tu pago pronto.' : 'We will review your payment shortly.'}</p>
                    <button onclick="document.getElementById('guestPayConfirmPanel').remove()"
                            style="padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">
                        OK
                    </button>
                </div>`;
                panel.style.alignItems = 'center';
            } catch (err) {
                errEl.textContent = isSp ? 'Error al enviar. Intenta de nuevo.' : 'Submission failed. Please try again.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = isSp ? '✅ Enviar' : '✅ Submit';
            }
        };
    };

    function showErr(msg) {
        const el = $('searchError');
        el.textContent    = msg;
        el.style.display  = 'block';
    }

    function setGuestLoading(on) {
        const btn = $('trackBtn');
        btn.disabled = on;
        btn.innerHTML = on
            ? '<div class="spinner"></div>'
            : `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>${t('trackBtnTxt')}</span>`;
    }

    function readUrlParams() {
        const params  = new URLSearchParams(location.search);
        const orderId = params.get('order') || params.get('orderId') || '';
        if (orderId) $('orderInput').value = orderId.substring(0, 20);
    }

    // ── Payment Confirmation Panel ───────────────────────────────────────────────
    window.showPaymentConfirmationPanel = async function(orderId, method, user) {
        const existing = document.getElementById('payConfirmPanel');
        if (existing) return; // already shown

        const isZelle = method === 'zelle';
        const isSp    = lang === 'es';
        const ZELLE_EMAIL = window._zelleEmail || 'payments@autoinx.com';
        const ZELLE_NAME  = window._zelleName  || 'AutoInx';

        const panel = document.createElement('div');
        panel.id = 'payConfirmPanel';
        panel.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
        panel.innerHTML = `
        <div style="background:#fff;border-radius:24px;box-shadow:0 25px 50px rgba(0,0,0,.2);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;">
            <div style="background:linear-gradient(135deg,${isZelle?'#7c3aed,#a855f7':'#16a34a,#22c55e'});padding:24px 28px;border-radius:24px 24px 0 0;">
                <h2 style="color:#fff;font-size:1.25rem;font-weight:900;margin:0;">${isZelle ? '🏦' : '💵'} ${isSp ? 'Confirmar Pago' : 'Confirm Your Payment'}</h2>
                <p style="color:rgba(255,255,255,.8);font-size:.85rem;margin:4px 0 0;">
                    ${isSp ? 'Pedido' : 'Order'} #${orderId.slice(0,8).toUpperCase()}
                </p>
            </div>
            <div style="padding:24px 28px;space-y:16px;">

                ${isZelle ? `
                <div style="background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:16px;margin-bottom:16px;">
                    <p style="font-size:.8rem;color:#6b7280;margin:0 0 4px;">${isSp ? 'Envía tu pago Zelle a:' : 'Send your Zelle payment to:'}</p>
                    <p style="font-size:1.1rem;font-weight:900;color:#7c3aed;margin:0;">${ZELLE_EMAIL}</p>
                    <p style="font-size:.85rem;font-weight:600;color:#374151;margin:2px 0 0;">${ZELLE_NAME}</p>
                </div>` : `
                <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:16px;margin-bottom:16px;">
                    <p style="font-size:.85rem;color:#374151;margin:0;">${isSp ? 'Coordinaremos el pago en efectivo al momento de la entrega.' : 'We will coordinate cash payment at the time of delivery or pickup.'}</p>
                </div>`}

                <p style="font-size:.85rem;font-weight:700;color:#374151;margin:0 0 8px;">
                    ${isSp ? 'Sube tu comprobante de pago:' : 'Upload your payment confirmation:'}
                </p>

                <label style="display:block;border:2px dashed #d1d5db;border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#fafafa;" id="pcDropzone">
                    <div id="pcPreview" style="margin-bottom:8px;"></div>
                    <p style="font-size:.85rem;color:#6b7280;margin:0;">📎 ${isSp ? 'Toca para adjuntar captura de pantalla' : 'Tap to attach screenshot or photo'}</p>
                    <p style="font-size:.72rem;color:#9ca3af;margin:4px 0 0;">JPG, PNG, PDF — max 5MB</p>
                    <input type="file" id="pcFile" accept="image/*,application/pdf" style="display:none">
                </label>

                <div style="margin-top:12px;">
                    <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">
                        ${isSp ? 'Monto pagado ($)' : 'Amount paid ($)'}
                    </label>
                    <input type="number" id="pcAmount" step="0.01" min="0" placeholder="0.00"
                           style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:.95rem;box-sizing:border-box;">
                </div>

                <div style="margin-top:12px;">
                    <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;">
                        ${isSp ? 'Notas adicionales (opcional)' : 'Additional notes (optional)'}
                    </label>
                    <textarea id="pcNotes" rows="2" placeholder="${isSp ? 'Número de confirmación, fecha, etc.' : 'Confirmation number, date, etc.'}"
                              style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:.85rem;resize:none;box-sizing:border-box;"></textarea>
                </div>

                <div id="pcError" style="display:none;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:10px 12px;font-size:.8rem;color:#dc2626;font-weight:500;margin-top:8px;"></div>

                <div style="display:flex;gap:10px;margin-top:16px;">
                    <button id="pcSubmitBtn"
                            style="flex:1;padding:12px;background:${isZelle?'#7c3aed':'#16a34a'};color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;">
                        ✅ ${isSp ? 'Enviar Confirmación' : 'Submit Confirmation'}
                    </button>
                    <button id="pcSkipBtn"
                            style="padding:12px 16px;background:#f3f4f6;color:#6b7280;border:none;border-radius:12px;font-size:.875rem;font-weight:600;cursor:pointer;">
                        ${isSp ? 'Ahora no' : 'Not now'}
                    </button>
                </div>
                <p style="font-size:.72rem;color:#9ca3af;text-align:center;margin:8px 0 0;">
                    ${isSp ? 'También puedes enviar tu comprobante más tarde desde esta página.' : 'You can also submit your confirmation later from this page.'}
                </p>
            </div>
        </div>`;

        document.body.appendChild(panel);

        // File preview
        const fileInput = document.getElementById('pcFile');
        document.getElementById('pcDropzone').onclick = (e) => {
            if (e.target !== fileInput) fileInput.click();
        };
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (!file) return;
            const preview = document.getElementById('pcPreview');
            if (file.type.startsWith('image/')) {
                const url = URL.createObjectURL(file);
                preview.innerHTML = `<img src="${url}" style="max-height:120px;border-radius:8px;margin-bottom:4px;">`;
            } else {
                preview.innerHTML = `<p style="font-size:.8rem;color:#374151;font-weight:600;">📄 ${file.name}</p>`;
            }
        };

        document.getElementById('pcSkipBtn').onclick = () => panel.remove();

        document.getElementById('pcSubmitBtn').onclick = async () => {
            const file    = fileInput.files[0];
            const amount  = parseFloat(document.getElementById('pcAmount').value) || 0;
            const notes   = document.getElementById('pcNotes').value.trim();
            const errEl   = document.getElementById('pcError');
            const btn     = document.getElementById('pcSubmitBtn');
            errEl.style.display = 'none';

            if (!file && !notes) {
                errEl.textContent = isSp ? 'Por favor adjunta un comprobante o añade una nota.' : 'Please attach a screenshot or add a note.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳';

            try {
                let screenshotUrl = null;

                // Upload screenshot via Netlify function (server-side Firebase Storage)
                // Avoids needing storageBucket in the client Firebase config
                if (file) {
                    const idToken  = await user.getIdToken();
                    const formData = new FormData();
                    formData.append('file',    file);
                    formData.append('orderId', orderId);
                    formData.append('userId',  user.uid);

                    const uploadRes = await fetch('/.netlify/functions/uploadPaymentProof', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${idToken}` },
                        body:    formData,
                    });

                    if (!uploadRes.ok) {
                        const errData = await uploadRes.json().catch(() => ({}));
                        throw new Error(errData.error || `Upload failed (${uploadRes.status})`);
                    }

                    const uploadData = await uploadRes.json();
                    screenshotUrl    = uploadData.url || uploadData.downloadUrl || null;
                }

                // Save confirmation to Firestore
                const { addDoc: addDocument, collection: col, serverTimestamp: sTs } =
                    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

                await addDocument(col(db, PAYMENT_CONFIRMATIONS_COLL), {
                    orderId,
                    orderIdShort:   orderId.slice(0,8),
                    userId:         user.uid,
                    customerEmail:  user.email,
                    paymentMethod:  method,
                    amountPaid:     amount || null,
                    screenshotUrl:  screenshotUrl || null,
                    notes:          notes || null,
                    status:         'pending_review',
                    submittedAt:    sTs(),
                });

                // Mark order as payment submitted
                const { doc: docRef, updateDoc: updDoc } =
                    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
                await updDoc(docRef(db, ORDERS_COLL, orderId), {
                    paymentConfirmationSubmitted: true,
                    paymentStatus: 'Confirmation Submitted',
                    updatedAt: sTs(),
                }).catch(() => {});

                panel.innerHTML = `
                <div style="background:#fff;border-radius:24px;padding:40px;text-align:center;max-width:480px;width:100%;">
                    <div style="font-size:3rem;margin-bottom:12px;">✅</div>
                    <h2 style="font-size:1.25rem;font-weight:900;color:#16a34a;margin:0 0 8px;">${isSp ? '¡Confirmación enviada!' : 'Confirmation submitted!'}</h2>
                    <p style="font-size:.875rem;color:#6b7280;margin:0 0 20px;">${isSp ? 'Revisaremos tu pago y actualizaremos el estado de tu pedido.' : 'We will review your payment and update your order status.'}</p>
                    <button onclick="document.getElementById('payConfirmPanel').remove()"
                            style="padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;">
                        ${isSp ? 'Ver mis pedidos' : 'View my orders'}
                    </button>
                </div>`;
                panel.style.alignItems = 'center';

            } catch (err) {
                console.error('Payment confirmation error:', err);
                errEl.textContent = isSp ? 'Error al enviar. Intenta de nuevo.' : 'Submission failed. Please try again.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = isSp ? '✅ Enviar Confirmación' : '✅ Submit Confirmation';
            }
        };
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    boot();
</script>
</body>
</html>
