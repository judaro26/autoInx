<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - autoInx</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/AutoInx logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    animation: { float: 'float 6s ease-in-out infinite' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(to bottom, #f8fafc, #e2e8f0); min-height: 100vh; }
        .input-error { @apply border-red-500 bg-red-50 ring-4 ring-red-100 !important; }
        .input-success { @apply border-green-500 bg-green-50 !important; }
        .phone-input-group { @apply flex rounded-xl shadow-md border-2 border-gray-300 focus-within:ring-4 focus-within:ring-indigo-100 focus-within:border-indigo-600 overflow-hidden transition-all duration-300 bg-white; }
        .country-select { @apply bg-gray-100 text-indigo-800 font-bold px-3 py-4 border-0 cursor-pointer text-sm; }
        .phone-input { @apply flex-1 px-4 py-4 text-base font-medium focus:ring-0 focus:outline-none bg-transparent; }
        .address-highlight-container { @apply p-5 sm:p-7 bg-indigo-50/50 rounded-3xl border-2 border-indigo-100 mb-4 shadow-inner; }
        .address-input { @apply w-full p-5 sm:p-6 border-4 border-indigo-500 rounded-2xl text-lg sm:text-xl font-bold transition-all duration-300 shadow-xl focus:ring-8 focus:ring-indigo-100 focus:outline-none bg-white; }
        #map-container { height: 300px; width: 100%; border-radius: 1.5rem; margin-top: 1.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 4px solid white; }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-8 min-h-screen">
        <div class="flex items-center justify-center min-h-[60vh]">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-indigo-600"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let db, auth, userId, cartData = {}, cartTotalCents = 0;
    let currentLang = localStorage.getItem('checkoutLang') || (navigator.language.startsWith('en') ? 'en' : 'es');
    let map, marker, autocomplete;

    const TEXT = {
        es: {
            title: 'Finalizar Compra', return: 'Volver', email: 'Correo Electrónico', name: 'Nombre Completo',
            phone: 'Teléfono (WhatsApp)', phoneHelp: 'Te enviaremos actualizaciones por WhatsApp',
            whatsappOpt: 'Sí, deseo recibir notificaciones por WhatsApp.',
            address: 'DIRECCIÓN DE ENTREGA', addressHelp: 'Busca tu dirección y selecciónala de la lista.',
            statusDefault: 'Escribe para buscar...', valid: '✅ UBICACIÓN VERIFICADA',
            complete: 'COMPLETAR PEDIDO', summary: 'Resumen', total: 'Total',
            errorEmail: 'Correo inválido', errorPhone: 'Número inválido', errorAddress: 'Selecciona una dirección'
        },
        en: {
            title: 'Checkout', return: 'Back', email: 'Email Address', name: 'Full Name',
            phone: 'Phone (WhatsApp)', phoneHelp: 'We will send updates via WhatsApp',
            whatsappOpt: 'Yes, I want to receive WhatsApp notifications.',
            address: 'DELIVERY ADDRESS', addressHelp: 'Search for your address and select it from the list.',
            statusDefault: 'Type to search...', valid: '✅ LOCATION VERIFIED',
            complete: 'COMPLETE ORDER', summary: 'Summary', total: 'Total',
            errorEmail: 'Invalid email', errorPhone: 'Invalid phone', errorAddress: 'Select an address'
        }
    };

    const $ = id => document.getElementById(id);
    const t = key => TEXT[currentLang][key];
    const formatPrice = c => `$${(c/100).toFixed(2)}`;

    window.setLang = (lang) => {
        localStorage.setItem('checkoutLang', lang);
        currentLang = lang;
        render();
    };

    function renderHeader() {
        return `
            <header class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-lg mb-8 border-t-4 border-indigo-600">
                <div class="flex items-center gap-3">
                    <img src="/images/AutoInx logo.png" class="h-8">
                    <h1 class="text-xl font-black text-indigo-700 uppercase tracking-tight">${t('title')}</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="setLang('${currentLang === 'es' ? 'en' : 'es'}')" class="text-xs font-bold px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        ${currentLang === 'es' ? 'Switch to English' : 'Cambiar a Español'}
                    </button>
                    <a href="/" class="text-sm font-bold text-gray-500 hover:text-indigo-600 underline">${t('return')}</a>
                </div>
            </header>
        `;
    }

    function render() {
        const stored = sessionStorage.getItem('autoInxCart');
        cartData = stored ? JSON.parse(stored) : {};
        cartTotalCents = Object.values(cartData).reduce((s, e) => s + (e.item.price * e.quantity), 0);

        if (Object.keys(cartData).length === 0) {
            $('app').innerHTML = `<div class="text-center py-20">${renderHeader()}<p class="mt-10 text-xl font-bold">Tu carrito está vacío</p></div>`;
            return;
        }

        $('app').innerHTML = `
            ${renderHeader()}
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl">
                        <form id="checkoutForm" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block font-bold mb-2">${t('email')} *</label>
                                    <input type="email" id="buyer-email" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block font-bold mb-2">${t('name')} *</label>
                                    <input type="text" id="buyer-name" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block font-bold mb-1">${t('phone')} *</label>
                                <p class="text-xs text-gray-500 mb-2">${t('phoneHelp')}</p>
                                <div class="phone-input-group">
                                    <select id="country-code" class="country-select">
                                        <option value="+1">US +1</option>
                                        <option value="+57">CO +57</option>
                                    </select>
                                    <input type="tel" id="buyer-phone" required class="phone-input" placeholder="300 000 0000">
                                </div>
                            </div>

                            <div class="bg-gradient-to-r from-green-50 to-blue-50 p-5 rounded-xl border-2 border-green-200">
                                <p class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <span>📱</span> ${currentLang === 'es' ? 'Preferencias de Notificaciones' : 'Notification Preferences'}
                                </p>
                                <p class="text-xs text-gray-600 mb-4">
                                    ${currentLang === 'es' 
                                        ? 'Selecciona cómo deseas recibir actualizaciones sobre tu pedido:' 
                                        : 'Choose how you want to receive order updates:'}
                                </p>
                                
                                <div class="space-y-3">
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-green-100">
                                        <input type="checkbox" id="whatsapp-opt" checked class="w-5 h-5 text-green-600 rounded">
                                        <label for="whatsapp-opt" class="text-sm font-semibold text-green-800 cursor-pointer">
                                            <span class="mr-1">💬</span>
                                            ${currentLang === 'es' 
                                                ? 'Sí, deseo recibir notificaciones por WhatsApp' 
                                                : 'Yes, I want WhatsApp notifications'}
                                        </label>
                                    </div>
                                    
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-blue-100">
                                        <input type="checkbox" id="sms-opt" class="w-5 h-5 text-blue-600 rounded">
                                        <label for="sms-opt" class="text-sm font-semibold text-blue-800 cursor-pointer">
                                            <span class="mr-1">💬</span>
                                            ${currentLang === 'es' 
                                                ? 'Sí, deseo recibir notificaciones por SMS/Texto' 
                                                : 'Yes, I want SMS/Text notifications'}
                                        </label>
                                    </div>
                                </div>
                                
                                <p class="text-[10px] text-gray-500 mt-3 italic">
                                    ${currentLang === 'es' 
                                        ? '* Recibirás confirmación del pedido y actualizaciones de entrega' 
                                        : '* You will receive order confirmation and delivery updates'}
                                </p>
                            </div>

                            <div class="address-highlight-container">
                                <label class="flex items-center gap-3 text-xl font-black text-indigo-900 mb-4">📍 ${t('address')}</label>
                                <input type="text" id="delivery-address" required class="address-input" data-validated="false" placeholder="${t('addressHelp')}">
                                <div id="addressStatus" class="mt-3 font-bold text-orange-600">${t('statusDefault')}</div>
                                <div id="map-container"></div>
                            </div>

                            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-2xl shadow-xl hover:bg-indigo-700 transition transform hover:scale-[1.01]">
                                ${t('complete')} — ${formatPrice(cartTotalCents)}
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-3xl shadow-xl sticky top-6 border-t-8 border-pink-500">
                        <h3 class="text-xl font-black mb-6 uppercase tracking-wider text-gray-400">${t('summary')}</h3>
                        <div class="space-y-4 mb-6">
                            ${Object.values(cartData).map(e => `
                                <div class="flex justify-between text-sm border-b pb-2">
                                    <span class="font-medium">${e.quantity}x ${e.item.name}</span>
                                    <span class="font-bold">${formatPrice(e.item.price * e.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between items-center text-2xl font-black">
                            <span>${t('total')}</span>
                            <span class="text-pink-600">${formatPrice(cartTotalCents)}</span>
                        </div>
                    </div>
                </div>
            </div>`;

        initLiveValidation();
        initMaps();
        $('checkoutForm').onsubmit = handleSubmit;
    }

    function initLiveValidation() {
        const e = $('buyer-email'), p = $('buyer-phone'), g = p.closest('.phone-input-group');
        e.oninput = () => {
            const v = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value);
            e.classList.toggle('input-success', v); e.classList.toggle('input-error', !v && e.value !== "");
        };
        p.oninput = () => {
            const v = p.value.length >= 7 && /^\d+$/.test(p.value);
            g.classList.toggle('input-success', v); g.classList.toggle('input-error', !v && p.value !== "");
        };
    }

    async function initMaps() {
        try {
            const res = await fetch('/.netlify/functions/getGoogleMapsKey');
            const { apiKey } = await res.json();
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places`;
            s.onload = () => {
                const inp = $('delivery-address');
                autocomplete = new google.maps.places.Autocomplete(inp, { types: ['address'] });
                map = new google.maps.Map($('map-container'), { center: { lat: 4.711, lng: -74.072 }, zoom: 12, disableDefaultUI: true });
                marker = new google.maps.Marker({ position: { lat: 4.711, lng: -74.072 }, map, draggable: true });

                autocomplete.addListener('place_changed', () => {
                    const place = autocomplete.getPlace();
                    if (!place.geometry) return;
                    map.setCenter(place.geometry.location); map.setZoom(17); marker.setPosition(place.geometry.location);
                    inp.dataset.validated = 'true';
                    $('addressStatus').innerHTML = `<span class="text-green-600">${t('valid')}</span>`;
                });
            };
            document.head.appendChild(s);
        } catch (err) {}
    }

    // 1. Add more robust error logging in your init
    async function init() {
        try {
            const res = await fetch('/.netlify/functions/getClientFirebaseConfig');
            if (!res.ok) throw new Error("Could not fetch Firebase Config");
            const cfg = await res.json();
            const app = initializeApp(cfg);
            auth = getAuth(app); 
            db = getFirestore(app);
            onAuthStateChanged(auth, u => { 
                userId = u ? u.uid : 'anonymous'; // Ensure userId isn't undefined
                render(); 
            });
        } catch (e) { 
            console.error("Firebase Init Error:", e);
            render(); 
        }
    }
    
    // 2. FIXED: handleSubmit now creates orders with flat item structure
    async function handleSubmit(event) {
        event.preventDefault();
        
        // Check if Firestore is actually ready
        if (!db) {
            alert("System not ready. Please refresh the page.");
            return;
        }
    
        const email = $('buyer-email').value;
        const phone = $('buyer-phone').value;
        const validAddr = $('delivery-address').dataset.validated === 'true';
    
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert(t('errorEmail'));
        if (phone.length < 7) return alert(t('errorPhone'));
        if (!validAddr) return alert(t('errorAddress'));
    
        $('btnSubmit').disabled = true;
        $('btnSubmit').innerText = "...";
    
        // ✅ FIXED: Flatten the items structure to match admin order format
        const order = {
            userId: userId || 'guest',
            buyerEmail: email,
            buyerName: $('buyer-name').value,
            buyerPhone: $('country-code').value + phone,
            whatsappConsent: $('whatsapp-opt').checked,
            smsConsent: $('sms-opt').checked,  // ✅ NEW: SMS notification preference
            notificationPreferences: {  // ✅ NEW: Structured preferences object
                whatsapp: $('whatsapp-opt').checked,
                sms: $('sms-opt').checked,
                email: true  // Email is always enabled for order confirmation
            },
            deliveryAddress: $('delivery-address').value,
            // ✅ NEW: Extract only essential fields in flat structure (no nested "item" object)
            items: Object.values(cartData).map(cartItem => ({
                id: cartItem.item.id,
                name: cartItem.item.name,
                price: cartItem.item.price,
                sku: cartItem.item.sku,
                quantity: cartItem.quantity
            })),
            totalCents: cartTotalCents,
            status: "Pending",  // ✅ Added default status
            createdAt: serverTimestamp(),
            timestamp: new Date().toISOString()  // ✅ Added backup timestamp
        };
    
        // 🔍 DEBUG: Log the order object before submission
        console.log("=== ORDER BEING SUBMITTED ===");
        console.log("Full order object:", order);
        console.log("buyerName:", order.buyerName);
        console.log("buyerEmail:", order.buyerEmail);
        console.log("totalCents:", order.totalCents);
        console.log("items:", order.items);
        console.log("userId:", order.userId);
        console.log("=============================");
    
        try {
            const docRef = await addDoc(collection(db, "artifacts", "default-app-id", "public", "data", "orders"), order);
            console.log("✅ Order created successfully with ID:", docRef.id);
            
            sessionStorage.removeItem('autoInxCart');
            $('app').innerHTML = `<div class="text-center py-20">${renderHeader()}<h2 class="text-4xl font-black text-green-600">¡Pedido Recibido!</h2><p class="mt-4">Gracias por tu compra.</p></div>`;
        } catch (e) { 
            console.error("Firestore Error:", e);
            alert("Error al guardar: " + e.message); 
            $('btnSubmit').disabled = false; 
            $('btnSubmit').innerText = t('complete');
        }
    }
    init();
</script>
</body>
</html>
