/**

function toggleDiscountInput() {

    if (!area) return;

    const isHidden = area.classList.contains('hidden');
    area.classList.toggle('hidden', !isHidden);
    if (icon) icon.style.transform = isHidden ? 'rotate(180deg)' : '';

    // Focus the input when opening
    if (isHidden) {
        setTimeout(() => {
            document.getElementById('checkout-discount-code')?.focus();
        }, 100);
    }
}


/**
 * Validates and applies a discount code.
 * Queries Firestore directly for the discount document.
 */
async function applyCheckoutDiscount() {
    if (discountValidating) return;

    const codeInput = document.getElementById('checkout-discount-code');
    const msgEl = document.getElementById('discount-message');
    const applyBtn = document.getElementById('discount-apply-btn');
    const code = codeInput?.value?.trim().toUpperCase();

    if (!code) {
        if (msgEl) msgEl.innerHTML = `<p class="text-red-600 text-sm font-semibold">❌ ${t('discountPlaceholder')}</p>`;
        return;
    }

    // Show loading state
    discountValidating = true;
    if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.innerHTML = `<span class="calculating-spinner"></span>`;
    }
    if (msgEl) msgEl.innerHTML = `<p class="text-gray-500 text-sm">${t('discountValidating')}</p>`;

    try {
        // Query Firestore for the discount code
        const discountsPath = 'artifacts/default-app-id/public/data/discounts';
        const q = query(
            collection(db, discountsPath),
            where('code', '==', code),
            where('enabled', '==', true)
        );

        const snap = await getDocs(q);

        if (snap.empty) {
            showDiscountError(msgEl, t('discountInvalid'));
            return;
        }

        const discountDoc = snap.docs[0];
        const discount = { id: discountDoc.id, ...discountDoc.data() };

        // --- Validation checks ---

        // Expiration
        if (discount.expiresAt && new Date(discount.expiresAt) < new Date()) {
            showDiscountError(msgEl, t('discountExpired'));
            return;
        }

        // Usage limit
        if (discount.maxUses > 0 && (discount.currentUses || 0) >= discount.maxUses) {
            showDiscountError(msgEl, t('discountMaxUsed'));
            return;
        }

        // Minimum order
        if (discount.minOrderCents > 0 && cartTotalCents < discount.minOrderCents) {
            const minDollars = (discount.minOrderCents / 100).toFixed(2);
            const msg = currentLang === 'es'
                ? `${t('discountMinOrder')}: $${minDollars}`
                : `${t('discountMinOrder')}: $${minDollars}`;
            showDiscountError(msgEl, msg);
            return;
        }

        // Category restriction
        if (discount.appliesToCategory && discount.appliesToCategory !== 'all') {
            const cartItems = Object.values(cartData);
            const hasMatch = cartItems.some(entry => entry.item.catalogId === discount.appliesToCategory);
            if (!hasMatch) {
                showDiscountError(msgEl, t('discountNotApplicable'));
                return;
            }
        }

        // Product restriction
        if (discount.appliesToProduct && discount.appliesToProduct !== 'all') {
            const cartItems = Object.values(cartData);
            const hasProduct = cartItems.some(entry => entry.item.id === discount.appliesToProduct);
            if (!hasProduct) {
                showDiscountError(msgEl, t('discountNotApplicable'));
                return;
            }
        }

        // --- Calculate savings ---
        let savedCents = 0;

        if (discount.type === 'percentage') {
            savedCents = Math.round(cartTotalCents * (discount.value / 100));
            if (discount.maxDiscountCents > 0 && savedCents > discount.maxDiscountCents) {
                savedCents = discount.maxDiscountCents;
            }
        } else if (discount.type === 'fixed') {
            savedCents = discount.valueCents || Math.round(discount.value * 100);
            if (savedCents > cartTotalCents) savedCents = cartTotalCents;
        } else if (discount.type === 'freeShipping') {
            // Free shipping — savings calculated at shipping time
            savedCents = shippingCents; // Remove current shipping cost
        }

        // --- Apply the discount ---
        appliedDiscount = { ...discount, savedCents };
        discountCents = savedCents;

        // Re-render just the discount section and cart summary (no full re-render)
        const discountSection = document.getElementById('discount-section')?.parentElement;
        if (discountSection) {
            // Replace the discount section container
            const wrapper = document.createElement('div');
            wrapper.id = 'discount-wrapper';
            wrapper.innerHTML = renderDiscountInput();

            const existingWrapper = document.getElementById('discount-wrapper');
            if (existingWrapper) {
                existingWrapper.replaceWith(wrapper);
            } else {
                // Find and replace the discount-section's parent
                const section = document.getElementById('discount-section');
                if (section) {
                    wrapper.innerHTML = renderDiscountInput();
                    section.replaceWith(wrapper);
                }
            }
        }

        updateCartSummary();

        console.log(`✅ Discount applied: ${discount.code} — saves ${formatPrice(savedCents)}`);

    } catch (error) {
        console.error('❌ Discount validation error:', error);
        showDiscountError(msgEl, t('discountInvalid'));
    } finally {
        discountValidating = false;
        if (applyBtn) {
            applyBtn.disabled = false;
            applyBtn.innerHTML = t('discountApply');
        }
    }
}


/**
 * Removes the currently applied discount.
 */
function removeCheckoutDiscount() {
    appliedDiscount = null;
    discountCents = 0;

    // Replace the applied discount display with the input form
    const wrapper = document.getElementById('discount-wrapper');
    if (wrapper) {
        const newWrapper = document.createElement('div');
        newWrapper.id = 'discount-wrapper';
        newWrapper.innerHTML = renderDiscountInput();
        wrapper.replaceWith(newWrapper);
    }

    updateCartSummary();
    console.log('🏷️ Discount removed');
}


/**
 * Shows an error message in the discount input area.
 */
function showDiscountError(msgEl, message) {
    if (msgEl) {
        msgEl.innerHTML = `
            <div class="flex items-center gap-2 mt-1 p-2 bg-red-50 rounded-lg border border-red-200">
                <span class="text-red-500">❌</span>
                <p class="text-red-700 text-sm font-semibold">${message}</p>
            </div>
        `;
    }
    // Clear error after 5 seconds
    setTimeout(() => {
        if (msgEl) msgEl.innerHTML = '';
    }, 5000);
}


/**
 * Returns a human-readable summary of the applied discount.
 */
function getCheckoutDiscountSummary() {
    if (!appliedDiscount) return '';

    if (appliedDiscount.type === 'percentage') {
        let text = `${appliedDiscount.value}% ${currentLang === 'es' ? 'de descuento' : 'off'}`;
        text += ` — ${currentLang === 'es' ? 'Ahorras' : 'You save'} ${formatPrice(discountCents)}`;
        return text;
    } else if (appliedDiscount.type === 'fixed') {
        return `${formatPrice(discountCents)} ${currentLang === 'es' ? 'de descuento' : 'off'}`;
    } else if (appliedDiscount.type === 'freeShipping') {
        return currentLang === 'es' ? '¡Envío gratis!' : 'Free shipping!';
    }
    return '';
}


/**
 * Records discount usage in Firestore after successful order.
 * Call this inside handleSubmit() after the order is created.
 */
async function recordCheckoutDiscountUsage(discount, orderId, orderData) {
    if (!discount || !discount.id) return;

    try {
        const discountRef = doc(db, 'artifacts/default-app-id/public/data/discounts', discount.id);

        const usageEntry = {
            orderId: orderId,
            orderNumber: orderId.substring(0, 8),
            date: new Date().toISOString(),
            savedCents: discountCents,
            customerEmail: orderData.buyerEmail || 'Unknown',
            source: 'checkout'  // Distinguishes from admin-applied discounts
        };

        await updateDoc(discountRef, {
            currentUses: increment(1),
            usageLog: arrayUnion(usageEntry),
            updatedAt: new Date().toISOString()
        });

        console.log(`✅ Discount usage recorded: ${discount.code} for order ${orderId}`);
    } catch (error) {
        console.error('❌ Error recording discount usage:', error);
        // Don't fail the order if this fails
    }
}

    // ✅ NEW: Helper function to extract address components from Google Place
    function extractAddressComponents(place) {
        const components = {
            street: '',
            city: '',
            state: '',
            zipCode: '',
            country: 'US'
        };
        
        if (!place.address_components) {
            console.warn('⚠️ No address_components in place object');
            return components;
        }
        
        place.address_components.forEach(component => {
            const types = component.types;
            
            if (types.includes('street_number')) {
                components.street = component.long_name + ' ';
            }
            if (types.includes('route')) {
                components.street += component.long_name;
            }
            if (types.includes('locality')) {
                components.city = component.long_name;
            }
            if (types.includes('sublocality_level_1') && !components.city) {
                components.city = component.long_name;
            }
            if (types.includes('administrative_area_level_1')) {
                components.state = component.short_name;
            }
            if (types.includes('postal_code')) {
                components.zipCode = component.long_name;
            }
            if (types.includes('country')) {
                components.country = component.short_name;
            }
        });
        
        // Trim and validate
        components.street = components.street.trim();
        components.city = components.city.trim();
        components.state = components.state.trim();
        components.zipCode = components.zipCode.trim();
        
        // Log for debugging
        console.log('📍 Extracted components:', components);
        
        return components;
    }
    
    // ── Distance helper — checks if a Google Place is within 50 miles of 94541 ──
    const STORE_LAT  = 37.6688;   // Hayward, CA 94541
    const STORE_LNG  = -122.0808;
    const PICKUP_RADIUS_MILES = 50;

    function haversineDistance(lat1, lng1, lat2, lng2) {
        const R    = 3958.8; // Earth radius in miles
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a    = Math.sin(dLat/2) * Math.sin(dLat/2)
                   + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180)
                   * Math.sin(dLng/2) * Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function isWithinPickupRange(place) {
        if (!place?.geometry?.location) return false;
        const lat  = typeof place.geometry.location.lat === 'function'
            ? place.geometry.location.lat()
            : place.geometry.location.lat;
        const lng  = typeof place.geometry.location.lng === 'function'
            ? place.geometry.location.lng()
            : place.geometry.location.lng;
        const dist = haversineDistance(STORE_LAT, STORE_LNG, lat, lng);
        console.log(`📍 Distance from store: ${dist.toFixed(1)} miles`);
        return dist <= PICKUP_RADIUS_MILES;
    }

    // ✅ Calculate shipping and tax - NOW UPDATES WITHOUT FULL RE-RENDER
    // Builds parcel data by calling the AI-powered packItems function.
    // Falls back to a local algorithm if the function is unavailable.
    async function buildParcelsFromCart() {
        const cart = Object.values(cartData);

        if (cart.length === 0) {
            console.warn('Cart is empty');
            return null;
        }

        const totalItems = cart.reduce((sum, e) => sum + e.quantity, 0);

        // Check for missing dimensions
        const missingDimensions = cart.filter(entry =>
            !entry.item.dimensions ||
            !entry.item.dimensions.length ||
            !entry.item.dimensions.width  ||
            !entry.item.dimensions.height ||
            !entry.item.dimensions.weight
        );

        if (missingDimensions.length > 0) {
            console.warn('Some items missing dimensions — using default box');
            const totalWeight = cart.reduce((s, e) => s + e.quantity * (e.item.dimensions?.weight || 1), 0);
            return [{
                length: "12", width: "9", height: "6",
                distance_unit: "in",
                weight: Math.max(1, totalWeight).toFixed(1),
                mass_unit: "lb"
            }];
        }

        // Build item payload for AI packer
        const itemPayload = cart.map(entry => ({
            name:     entry.item.name,
            length:   entry.item.dimensions.length,
            width:    entry.item.dimensions.width,
            height:   entry.item.dimensions.height,
            weight:   entry.item.dimensions.weight,
            quantity: entry.quantity,
        }));

        const totalWeight = itemPayload.reduce((s, i) => s + i.weight * i.quantity, 0);

        // ── Try AI-powered optimal packing ────────────────────────────────────
        try {
            const res = await fetch('/.netlify/functions/packItems', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: itemPayload }),
            });

            if (res.ok) {
                const pack = await res.json();
                console.log(`📦 Pack result (${pack.source}): ${pack.length}"×${pack.width}"×${pack.height}" | ${pack.weight.toFixed(1)} lbs | ${pack.reasoning}`);
                return [{
                    length:        String(pack.length),
                    width:         String(pack.width),
                    height:        String(pack.height),
                    distance_unit: "in",
                    weight:        Math.max(0.5, pack.weight).toFixed(1),
                    mass_unit:     "lb",
                }];
            }
        } catch (err) {
            console.warn('⚠️ packItems function unavailable, using local algorithm:', err.message);
        }

        // ── Local algorithmic fallback ─────────────────────────────────────────
        // Expand items by quantity, sort by volume desc, stack greedily
        const units = [];
        for (const item of itemPayload) {
            const dims = [item.length, item.width, item.height].sort((a, b) => b - a);
            for (let q = 0; q < item.quantity; q++) {
                units.push({ l: dims[0], w: dims[1], h: dims[2], wt: item.weight });
            }
        }
        units.sort((a, b) => (b.l * b.w * b.h) - (a.l * a.w * a.h));

        let boxL = units[0].l, boxW = units[0].w, boxH = units[0].h;
        for (let i = 1; i < units.length; i++) {
            const u = units[i];
            if (u.l <= boxL && u.w <= boxW && u.h <= boxH) continue; // fits inside
            const volA = boxL * (boxW + u.w) * Math.max(boxH, u.h);
            const volB = boxL * Math.max(boxW, u.w) * (boxH + u.h);
            if (volA <= volB) { boxW += u.w; boxH = Math.max(boxH, u.h); }
            else              { boxW = Math.max(boxW, u.w); boxH += u.h; }
            boxL = Math.max(boxL, u.l);
        }

        const pL = Math.ceil(boxL) + 2;
        const pW = Math.ceil(boxW) + 2;
        const pH = Math.ceil(boxH) + 2;
        console.log(`📦 Local algorithm: ${pL}"×${pW}"×${pH}" | ${totalWeight.toFixed(1)} lbs | dim wt ${(pL*pW*pH/139).toFixed(1)} lbs`);

        return [{
            length: String(pL), width: String(pW), height: String(pH),
            distance_unit: "in",
            weight: Math.max(0.5, totalWeight).toFixed(1),
            mass_unit: "lb",
        }];
    }

    async function calculateShippingAndTax() {
        const addressInput = $('delivery-address');
        const address = addressInput?.value?.trim();
        
        if (!address || addressInput.dataset.validated !== 'true') {
            shippingCents = 0;
            taxCents = 0;
            shippingDetails = null;
            taxDetails = null;
            updateCartSummary();
            return;
        }
    
        // ✅ THIS LINE SHOULD USE THE GLOBAL VARIABLE
        if (!selectedAddressComponents.zipCode || selectedAddressComponents.zipCode === '00000') {
            console.error('❌ No valid ZIP code stored in selectedAddressComponents');
            console.log('selectedAddressComponents:', selectedAddressComponents);
            alert('Please select a complete address from the Google dropdown (not just type it).');
            return;
        }
        
        // ✅ DESTRUCTURE FROM THE GLOBAL VARIABLE
        const { street, city, state, zipCode, country } = selectedAddressComponents;
        
        console.log('✅ Using stored address:', { street, city, state, zipCode, country });
    
        $('btnSubmit').disabled = true;
        $('btnSubmit').innerHTML = `${t('calculatingShipping')} <span class="calculating-spinner"></span>`;
    
        try {
            // Calculate total weight from cart
            const totalItems = Object.values(cartData).reduce((sum, e) => sum + e.quantity, 0);
            const totalWeight = Math.max(1, totalItems);
    
            // 1. Calculate Shipping
            try {
                console.log('📦 Calculating shipping...');
                
                const shippingPayload = {
                    addressTo: {
                        name: $('buyer-name')?.value || 'Customer',
                        street1: street,
                        city: city,
                        state: state,
                        zip: zipCode,
                        country: country
                    },
                    parcels: (await buildParcelsFromCart()) || [{
                        length: "12",
                        width: "8",
                        height: "6",
                        distance_unit: "in",
                        weight: totalWeight.toString(),
                        mass_unit: "lb"
                    }]
                };
                
                console.log('📦 Shipping payload:', shippingPayload);
                
                const shippingRes = await fetch('/.netlify/functions/calculateShipping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(shippingPayload)
                });
    
                // Check if customer is within local pickup range before showing rates
                const nearStore = isWithinPickupRange(selectedPlace);

                if (shippingRes.ok) {
                    const shippingData = await shippingRes.json();
                    console.log('📦 Shipping response:', shippingData);

                    if (shippingData.allRates && shippingData.allRates.length > 0) {
                        // Prepend local pickup option for nearby customers
                        await displayShippingOptions(shippingData.allRates, nearStore);
                        return; // Wait for customer selection
                    }

                    if (shippingData.displayRate) {
                        shippingCents = Math.round(shippingData.displayRate.amount * 100);
                        shippingDetails = {
                            provider: shippingData.displayRate.provider,
                            servicelevel: shippingData.displayRate.servicelevel,
                            amount: shippingData.displayRate.amount,
                            estimated_days: shippingData.displayRate.estimated_days
                        };
                    } else if (shippingData.bestRate) {
                        shippingCents = Math.round(shippingData.bestRate.amount * 100);
                        shippingDetails = {
                            provider: shippingData.bestRate.provider,
                            amount: shippingData.bestRate.amount
                        };
                    }

                    // If near store and no rate modal shown, still offer pickup
                    if (nearStore) {
                        await displayShippingOptions([], true);
                        return;
                    }

                    console.log('✅ Shipping calculated:', formatPrice(shippingCents));
                } else {
                    const errorData = await shippingRes.json().catch(() => ({}));
                    console.warn('⚠️ Shipping API failed:', errorData);
                    if (nearStore) {
                        // Near store + API failed → offer pickup only, no blocking
                        await displayShippingOptions([], true);
                        return;
                    }
                    // Not near store → contact-us fallback (never block the order)
                    shippingCents = 0;
                    shippingDetails = { provider: 'Contact for quote', amount: 0, needsQuote: true };
                    await displayContactShippingNotice();
                    return;
                }
            } catch (shippingError) {
                console.error('❌ Shipping error:', shippingError);
                const nearStore = isWithinPickupRange(selectedPlace);
                if (nearStore) {
                    await displayShippingOptions([], true);
                    return;
                }
                shippingCents = 0;
                shippingDetails = { provider: 'Contact for quote', amount: 0, needsQuote: true };
                await displayContactShippingNotice();
                return;
            }
    
            // 2. Calculate Tax
            $('btnSubmit').innerHTML = `${t('calculatingTax')} <span class="calculating-spinner"></span>`;
    
            try {
                const { street, city, state, zipCode, country } = selectedAddressComponents;
                const taxPayload = {
                    state: state,
                    zipCode: zipCode,
                    subtotalCents: cartTotalCents,
                    shippingCents: shippingCents,   // included so Stripe Tax can apply shipping tax code
                    street: street,
                    city: city,
                    country: country
                };
                
                console.log('📋 Tax payload:', taxPayload);
                
                const taxRes = await fetch('/.netlify/functions/calculateTax', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taxPayload)
                });
    
                if (taxRes.ok) {
                    const taxData = await taxRes.json();
                    console.log('✅ Tax response:', taxData);
                    taxCents = taxData.taxCents || 0;
                    taxCalculationId = taxData.calculationId || null;
                    taxDetails = {
                        rate: taxData.taxRate,

    // Zelle/Cash contact info — update these to match your details
    // ── HMAC signing for email endpoint calls ──────────────────────────────────
    async function _signOrderId(orderId) {
        try {
            const secret = 'autoinx-email-secret'; // same as ORDER_EMAIL_SECRET env var
            const enc    = new TextEncoder();
            const key    = await crypto.subtle.importKey(
                'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            const sig = await crypto.subtle.sign('HMAC', key, enc.encode(orderId));
            return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch { return null; }
    }

                                    <div class="flex justify-between py-2 border-b border-gray-200">
                                        <span>${item.quantity}x ${item.name}</span>
                                        <span class="font-semibold">${formatPrice(item.price * item.quantity)}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="space-y-2 text-sm border-t-2 border-gray-300 pt-3">
                                <div class="flex justify-between">
                                    <span>Subtotal:</span>
                                    <span class="font-semibold">${formatPrice(order.subtotalCents)}</span>
                                </div>
                                     ${order.discountCents > 0 ? `
                                         <div class="flex justify-between text-green-700">
                                             <span>🏷️ ${order.discount?.code || 'Discount'}:</span>
                                             <span class="font-semibold">-${formatPrice(order.discountCents)}</span>
                                         </div>
                                     ` : ''}
                                <div class="flex justify-between">
                                    <span>Shipping:</span>
                                    <span class="font-semibold">${formatPrice(order.shippingCents)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Tax:</span>
                                    <span class="font-semibold">${formatPrice(order.taxCents)}</span>
                                </div>
                                <div class="flex justify-between font-bold text-lg border-t-2 pt-2 text-indigo-700">
                                    <span>Total:</span>
                                    <span>${formatPrice(order.totalCents)}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-green-50 border-2 border-green-200 rounded-xl p-5 mb-6">
                            <p class="font-bold text-green-900 mb-2 flex items-center gap-2">
                                <span>🚚</span> Delivery Address
                            </p>
                            <p class="text-sm text-green-800">${order.deliveryAddress}</p>
                        </div>
                        
                        <div class="mt-8 space-y-3">
                            <a href="/" class="block w-full bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow-lg">
                                ← Return to Store
                            </a>
                            ${paymentUrl ? `
                            <a href="${paymentUrl}" class="block w-full bg-blue-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg">
                                💳 Pay Now
                            </a>
                            ` : ''}
                        </div>
                    </div>
                </div>`;
            
            $('app').innerHTML = successMessage;
            
        } catch (error) { 
            console.error("❌ Order submission error:", error);
            // Remove processing overlay so the user can interact again
            document.getElementById('processingOverlay')?.remove();
            alert(`Error creating order: ${error.message}\n\nPlease try again or contact support.`); 
            $('btnSubmit').disabled = false; 
            const grandTotal = Math.max(0, cartTotalCents - discountCents) + shippingCents + taxCents;
            $('btnSubmit').innerHTML = `${t('complete')} — ${formatPrice(grandTotal)}`;
            orderCompleted = false; // Allow retry
        }
    }

    // ── Cart management ──────────────────────────────────────────────────────
    function renderCartItems() {
        return Object.values(cartData).map(e => {
            const itemTotal = e.item.price * e.quantity;
            const stock = e.item.stock ?? 99;
            const imgSrc = e.item.imageUrls?.[0] || e.item.imageUrl || '';
            return `
            <div class="flex items-start gap-3 py-3 border-b border-gray-100 last:border-0">
                ${imgSrc
                    ? `<img src="${imgSrc}" class="w-14 h-14 object-contain rounded-lg bg-gray-50 border border-gray-200 flex-shrink-0">`
                    : `<div class="w-14 h-14 bg-gray-100 rounded-lg flex-shrink-0 flex items-center justify-center text-gray-300 text-xl">📦</div>`
                }
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-gray-800 leading-tight">${e.item.name}</p>
                    <p class="text-xs text-gray-400 mt-0.5">${formatPrice(e.item.price)} each</p>
                    <div class="flex items-center justify-between mt-2">
                        <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                            <button type="button" onclick="updateCartQty('${e.item.id}',-1)"
                                    class="w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-100 transition font-bold text-lg leading-none">−</button>
                            <span class="w-8 text-center text-sm font-bold text-gray-800">${e.quantity}</span>
                            <button type="button" onclick="updateCartQty('${e.item.id}',1)"
                                    ${e.quantity >= stock ? 'disabled' : ''}
                                    class="w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-100 transition font-bold text-lg leading-none ${e.quantity >= stock ? 'opacity-30 cursor-not-allowed' : ''}">+</button>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-indigo-700">${formatPrice(itemTotal)}</span>
                            <button type="button" onclick="removeCartItem('${e.item.id}')"
                                    class="text-gray-300 hover:text-red-400 transition text-sm" title="Remove">✕</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    window.updateCartQty = function(itemId, delta) {
        if (!cartData[itemId]) return;
        const newQty = cartData[itemId].quantity + delta;
        if (newQty <= 0) { removeCartItem(itemId); return; }
        const stock = cartData[itemId].item.stock ?? 99;
        if (newQty > stock) return;
        cartData[itemId].quantity = newQty;
        _persistAndRefreshCart();
    };

    window.removeCartItem = function(itemId) {
        delete cartData[itemId];
        _persistAndRefreshCart();
    };

    function _persistAndRefreshCart() {
        sessionStorage.setItem('autoInxCart', JSON.stringify(cartData));
        cartTotalCents = Object.values(cartData).reduce((s, e) => s + (e.item.price * e.quantity), 0);

        if (appliedDiscount) {
            if (appliedDiscount.type === 'percentage') {
                discountCents = Math.round(cartTotalCents * (appliedDiscount.value / 100));
                if (appliedDiscount.maxDiscountCents > 0 && discountCents > appliedDiscount.maxDiscountCents)
                    discountCents = appliedDiscount.maxDiscountCents;
            } else if (appliedDiscount.type === 'fixed') {
                discountCents = Math.min(
                    appliedDiscount.valueCents || Math.round(appliedDiscount.value * 100),
                    cartTotalCents
                );
            } else if (appliedDiscount.type === 'freeShipping') {
                discountCents = shippingCents;
            }
            appliedDiscount.savedCents = discountCents;
        }

        if (Object.keys(cartData).length === 0) { window.location.href = '/'; return; }

        const itemsEl = document.getElementById('cart-items-container');
        if (itemsEl) itemsEl.innerHTML = renderCartItems();
        updateCartSummary();

        const addrInput = document.getElementById('delivery-address');
        if (addrInput?.dataset.validated === 'true') calculateShippingAndTax();
    }


    // ── Add products from checkout ────────────────────────────────────────────
    let _allProducts = null;          // cached once from Firestore
    let _searchTimer = null;

    window.toggleAddProducts = function() {
        const panel   = document.getElementById('add-products-panel');
        const chevron = document.getElementById('add-products-chevron');
        if (!panel) return;
        const opening = panel.classList.toggle('hidden');  // toggle returns true when class was added (i.e. now hidden)
        chevron.style.transform = opening ? '' : 'rotate(180deg)';
        if (!opening) {
            // Just opened — pre-load products & focus
            _loadProducts();
            setTimeout(() => document.getElementById('product-search-input')?.focus(), 80);
        }
    };

    async function _loadProducts() {
        if (_allProducts) return;   // already cached
        try {
            const snap = await getDocs(collection(db, 'artifacts/default-app-id/public/data/items'));
            _allProducts = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(p => !p.disabled && !p.hidden);
        } catch (e) {
            console.warn('Product load failed:', e.message);
            _allProducts = [];
        }
    }

    window.searchProducts = function(query) {
        clearTimeout(_searchTimer);
        _searchTimer = setTimeout(() => _runSearch(query.trim().toLowerCase()), 220);
    };

    function _runSearch(q) {
        const el = document.getElementById('product-search-results');
        if (!el) return;

        if (!q) { el.innerHTML = ''; return; }

        if (!_allProducts) {
            el.innerHTML = `<p class="text-xs text-gray-400 px-1">${t('searchLoading')}</p>`;
            _loadProducts().then(() => _runSearch(q));
            return;
        }

        const hits = _allProducts.filter(p =>
            (p.name  || '').toLowerCase().includes(q) ||
            (p.sku   || '').toLowerCase().includes(q) ||
            (p.description || '').toLowerCase().includes(q)
        ).slice(0, 12);

        if (!hits.length) {
            el.innerHTML = `<p class="text-xs text-gray-400 px-1 py-2">${t('searchNoResults')}</p>`;
            return;
        }

        el.innerHTML = hits.map(p => {
            const inCart  = !!cartData[p.id];
            const noStock = (p.stock ?? 0) <= 0;
            const imgSrc  = p.imageUrls?.[0] || p.imageUrl || '';
            const price   = formatPrice(p.price || 0);
            const badge   = inCart  ? `<span class="text-xs font-bold text-green-600">${t('added')}</span>`
                          : noStock ? `<span class="text-xs text-gray-400">${t('outOfStock')}</span>`
                          : `<button type="button" onclick="addProductToCart('${p.id}')"
                                    class="text-xs font-bold px-3 py-1 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                                 ${t('addToCart')}
                             </button>`;
            return `
            <div class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 border border-transparent hover:border-gray-100 transition" id="search-row-${p.id}">
                ${imgSrc
                    ? `<img src="${imgSrc}" class="w-10 h-10 object-contain rounded bg-gray-50 border border-gray-100 flex-shrink-0">`
                    : `<div class="w-10 h-10 bg-gray-100 rounded flex-shrink-0 flex items-center justify-center text-gray-300 text-base">📦</div>`
                }
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-gray-800 truncate">${p.name || ''}</p>
                    <p class="text-xs text-indigo-600 font-bold">${price}</p>
                </div>
                <div class="flex-shrink-0">${badge}</div>
            </div>`;
        }).join('');
    }

    window.addProductToCart = function(productId) {
        const product = _allProducts?.find(p => p.id === productId);
        if (!product) return;

        if (cartData[productId]) {
            // Already in cart — just increment
            cartData[productId].quantity += 1;
        } else {
            cartData[productId] = { item: product, quantity: 1 };
        }

        _persistAndRefreshCart();

        // Re-render the search row so the button becomes "✓ Added"
        const row = document.getElementById(`search-row-${productId}`);
        if (row) {
            const btn = row.querySelector('button');
            if (btn) {
                btn.outerHTML = `<span class="text-xs font-bold text-green-600">${t('added')}</span>`;
            }
        }
    };

    init();
</script>
</body>
</html>
