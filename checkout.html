<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - autoInx</title>
    <meta name="description" content="Finaliza tu compra de forma rápida y segura">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/AutoInx logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    animation: { float: 'float 6s ease-in-out infinite', 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
    <style>
        body { background: linear-gradient(to bottom, #f8fafc, #e2e8f0); min-height: 100vh; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #a78bfa, #6366f1); border-radius: 4px; }
        
        /* Validation Colors */
        .input-error { @apply border-red-500 bg-red-50 ring-4 ring-red-100 !important; }
        .input-success { @apply border-green-500 bg-green-50 !important; }

        .phone-input-group {
            @apply flex rounded-xl shadow-md border-2 border-gray-300 focus-within:ring-4 focus-within:ring-indigo-100 focus-within:border-indigo-600 overflow-hidden transition-all duration-300 bg-white;
        }
        .country-select { @apply bg-gray-50 text-indigo-800 font-bold px-3 py-4 border-0 cursor-pointer text-sm; }
        .phone-input { @apply flex-1 px-4 py-4 text-base font-medium focus:ring-0 focus:outline-none bg-transparent; }

        /* Address Standout */
        .address-highlight-container {
            @apply p-5 sm:p-7 bg-indigo-50/50 rounded-3xl border-2 border-indigo-100 mb-4 shadow-inner;
        }
        .address-input {
            @apply w-full p-5 sm:p-6 border-4 border-indigo-500 rounded-2xl text-lg sm:text-xl font-bold transition-all duration-300 shadow-xl focus:ring-8 focus:ring-indigo-100 focus:outline-none bg-white;
        }
        .address-valid { @apply border-green-500 bg-green-50 ring-4 ring-green-100; }
        .address-invalid { @apply border-red-500 bg-red-50 ring-4 ring-red-100; }
        
        #map-container {
            height: 250px; width: 100%; border-radius: 1.5rem; margin-top: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 4px solid white;
        }
        @media (min-width: 768px) { #map-container { height: 350px; } }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-8 min-h-screen">
        <div class="flex items-center justify-center min-h-[60vh]">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-indigo-600"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- STATE & CONFIG ---
    let db, auth, userId, cartData = {}, cartTotalCents = 0;
    let currentLang = localStorage.getItem('checkoutLang') || (navigator.language.startsWith('en') ? 'en' : 'es');
    let map, marker, autocomplete, geocoder;
    let isMaintenanceMode = false;

    const APP_ID = 'autoInx-checkout';
    const ORDERS_COLLECTION = (uid) => `artifacts/${APP_ID}/public/data/orders`;
    const MAPS_KEY_URL = '/.netlify/functions/getGoogleMapsKey';
    const FIREBASE_CONFIG_URL = '/.netlify/functions/getClientFirebaseConfig';

    const TEXT = {
        es: {
            title: 'Finalizar Compra',
            formHeader: 'Información de Entrega',
            emailLabel: 'Correo Electrónico',
            emailError: 'Ingresa un correo válido.',
            nameLabel: 'Nombre Completo',
            phoneLabel: 'Teléfono (WhatsApp)',
            phoneError: 'Número inválido (mínimo 7 dígitos).',
            addressLabel: 'DIRECCIÓN DE ENTREGA',
            addressHelp: 'Busca tu dirección y selecciónala de la lista desplegable.',
            addressStatusDefault: 'Escribe para buscar...',
            addressValid: '✅ UBICACIÓN VERIFICADA',
            addressError: 'Selecciona una dirección válida de la lista.',
            btnComplete: 'COMPLETAR PEDIDO',
            total: 'Total',
            summary: 'Resumen'
        },
        en: {
            title: 'Checkout',
            formHeader: 'Delivery Information',
            emailLabel: 'Email Address',
            emailError: 'Enter a valid email.',
            nameLabel: 'Full Name',
            phoneLabel: 'Phone (WhatsApp)',
            phoneError: 'Invalid number (min 7 digits).',
            addressLabel: 'DELIVERY ADDRESS',
            addressHelp: 'Search for your address and select it from the dropdown list.',
            addressStatusDefault: 'Type to search...',
            addressValid: '✅ LOCATION VERIFIED',
            addressError: 'Please select a valid address from the list.',
            btnComplete: 'COMPLETE ORDER',
            total: 'Total',
            summary: 'Summary'
        }
    };

    const $ = id => document.getElementById(id);
    const t = key => TEXT[currentLang][key] || TEXT.es[key];
    const formatPrice = c => `$${(c/100).toFixed(2)}`;

    // --- VALIDATION HELPERS ---
    const isEmailValid = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const isPhoneValid = phone => phone.length >= 7 && /^\d+$/.test(phone);

    function setupValidation() {
        const email = $('buyer-email');
        const phone = $('buyer-phone');
        const phoneGroup = phone.closest('.phone-input-group');

        email.addEventListener('input', () => {
            email.classList.toggle('input-error', !isEmailValid(email.value) && email.value !== "");
            email.classList.toggle('input-success', isEmailValid(email.value));
        });

        phone.addEventListener('input', () => {
            const valid = isPhoneValid(phone.value);
            phoneGroup.classList.toggle('input-error', !valid && phone.value !== "");
            phoneGroup.classList.toggle('input-success', valid);
        });
    }

    // --- MAPS LOGIC ---
    async function initGoogleMaps() {
        try {
            const res = await fetch(MAPS_KEY_URL);
            const { apiKey } = await res.json();
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places`;
            script.onload = () => {
                geocoder = new google.maps.Geocoder();
                const input = $('delivery-address');
                autocomplete = new google.maps.places.Autocomplete(input, { types: ['address'], componentRestrictions: { country: ['co', 'us'] } });
                
                const initialPos = { lat: 4.7110, lng: -74.0721 };
                map = new google.maps.Map($('map-container'), { center: initialPos, zoom: 12, disableDefaultUI: true });
                marker = new google.maps.Marker({ position: initialPos, map, draggable: true });

                autocomplete.addListener('place_changed', () => {
                    const place = autocomplete.getPlace();
                    if (place.geometry) {
                        map.setCenter(place.geometry.location);
                        map.setZoom(17);
                        marker.setPosition(place.geometry.location);
                        input.dataset.validated = 'true';
                        input.classList.add('address-valid');
                        $('addressStatus').innerHTML = `<span class="text-green-600 font-bold">${t('addressValid')}</span>`;
                    }
                });
            };
            document.head.appendChild(script);
        } catch (e) { console.error("Maps failed", e); }
    }

    // --- MAIN RENDER ---
    function render() {
        const stored = sessionStorage.getItem('autoInxCart');
        cartData = stored ? JSON.parse(stored) : {};
        cartTotalCents = Object.values(cartData).reduce((s, e) => s + (e.item.price * e.quantity), 0);

        if (Object.keys(cartData).length === 0) {
            $('app').innerHTML = `<div class="text-center py-20"><h1 class="text-2xl font-bold">Carrito Vacío</h1><a href="/" class="text-indigo-600 underline">Volver</a></div>`;
            return;
        }

        $('app').innerHTML = `
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-10">
                <div class="lg:col-span-2 space-y-8">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-indigo-600">
                        <h2 class="text-3xl font-black text-indigo-700 mb-8">${t('formHeader')}</h2>
                        <form id="checkoutForm" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block font-bold mb-2">${t('emailLabel')} *</label>
                                    <input type="email" id="buyer-email" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block font-bold mb-2">${t('nameLabel')} *</label>
                                    <input type="text" id="buyer-name" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block font-bold mb-2">${t('phoneLabel')} *</label>
                                <div class="phone-input-group">
                                    <select id="country-code" class="country-select">
                                        <option value="+57">CO +57</option>
                                        <option value="+1">US +1</option>
                                    </select>
                                    <input type="tel" id="buyer-phone" required class="phone-input" placeholder="321 000 0000">
                                </div>
                            </div>

                            <div class="address-highlight-container">
                                <label class="flex items-center gap-3 text-xl font-black text-indigo-900 mb-4">📍 ${t('addressLabel')}</label>
                                <p class="text-indigo-600 text-sm mb-4 font-medium">${t('addressHelp')}</p>
                                <input type="text" id="delivery-address" required class="address-input" data-validated="false" placeholder="Calle 123 #45-67...">
                                <div id="addressStatus" class="mt-3 font-bold text-orange-600">${t('addressStatusDefault')}</div>
                                <div id="map-container"></div>
                            </div>

                            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-2xl shadow-xl hover:bg-indigo-700 transition transform hover:scale-[1.01]">
                                ${t('btnComplete')} — ${formatPrice(cartTotalCents)}
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-3xl shadow-xl sticky top-10 border-t-8 border-pink-500">
                        <h3 class="text-xl font-black mb-6">${t('summary')}</h3>
                        <div class="space-y-4 mb-6">
                            ${Object.values(cartData).map(e => `
                                <div class="flex justify-between text-sm border-b pb-2">
                                    <span>${e.quantity}x ${e.item.name}</span>
                                    <span class="font-bold">${formatPrice(e.item.price * e.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between items-center text-2xl font-black">
                            <span>${t('total')}</span>
                            <span class="text-pink-600">${formatPrice(cartTotalCents)}</span>
                        </div>
                    </div>
                </div>
            </div>`;

        setupValidation();
        initGoogleMaps();
        $('checkoutForm').onsubmit = handleSubmit;
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const btn = $('btnSubmit');
        const email = $('buyer-email').value;
        const phone = $('buyer-phone').value;
        const addressValidated = $('delivery-address').dataset.validated === 'true';

        if (!isEmailValid(email)) return alert(t('emailError'));
        if (!isPhoneValid(phone)) return alert(t('phoneError'));
        if (!addressValidated) return alert(t('addressError'));

        btn.disabled = true;
        btn.innerText = "Procesando...";

        const orderData = {
            buyerEmail: email,
            buyerName: $('buyer-name').value,
            buyerPhone: $('country-code').value + phone,
            deliveryAddress: $('delivery-address').value,
            items: Object.values(cartData),
            totalCents: cartTotalCents,
            createdAt: serverTimestamp(),
            status: 'Pending'
        };

        try {
            await addDoc(collection(db, ORDERS_COLLECTION(userId || 'guest')), orderData);
            sessionStorage.removeItem('autoInxCart');
            $('app').innerHTML = `<div class="text-center py-20"><h2 class="text-5xl font-black text-green-600 mb-4">¡Gracias!</h2><p class="text-xl">Pedido recibido con éxito.</p><a href="/" class="mt-8 inline-block bg-indigo-600 text-white px-8 py-3 rounded-xl">Seguir Comprando</a></div>`;
        } catch (err) {
            alert("Error al guardar pedido");
            btn.disabled = false;
        }
    }

    // --- INIT APP ---
    async function init() {
        try {
            const res = await fetch(FIREBASE_CONFIG_URL);
            const config = await res.json();
            const app = initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);
            onAuthStateChanged(auth, u => { userId = u?.uid; render(); });
        } catch (e) { render(); } // Fallback for local testing
    }

    init();
</script>
</body>
</html>
