    const $ = id => document.getElementById(id);

    function renderHeader() {
        return `
            <header class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-lg mb-8 border-t-4 border-indigo-600">
                <div class="flex items-center gap-3">
                    <img src="/images/AutoInx logo.png" class="h-8">

                </div>
                <div class="flex items-center gap-4">
                    <button onclick="setLang('${currentLang === 'es' ? 'en' : 'es'}')" class="text-xs font-bold px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        ${currentLang === 'es' ? 'Switch to English' : 'Cambiar a Español'}

                </div>
            </header>
        `;
    }

    // ✅ NEW: Update only the cart summary without full re-render
    function updateCartSummary() {
        const summaryContainer = document.getElementById('cart-summary-breakdown');
        if (!summaryContainer) return;

        const grandTotal = cartTotalCents + shippingCents + taxCents;

        summaryContainer.innerHTML = `
            <div class="flex justify-between text-base font-semibold text-gray-700">
                <span>${t('subtotal')}</span>
                <span>${formatPrice(cartTotalCents)}</span>
            </div>
            
            ${shippingCents > 0 ? `
                <div class="flex justify-between text-base text-gray-600">
                    <span class="flex items-center gap-2">
                        📦 ${t('shipping')}
                        ${shippingDetails ? `
                            <span class="text-xs text-gray-400">
                                (${shippingDetails.provider}${shippingDetails.estimated_days ? ` - ${shippingDetails.estimated_days} days` : ''})
                            </span>
                        ` : ''}
                    </span>
                    <span class="font-semibold">${formatPrice(shippingCents)}</span>
                </div>
                ${shippingDetails ? `
                    <div class="text-xs text-blue-600 italic px-2">
                        💡 ${t('shippingNote')}
                    </div>
                ` : ''}
            ` : `
                <div class="flex justify-between text-sm text-gray-400 italic">
                    <span>📦 ${t('shipping')}</span>
                    <span>${t('calculatedAtCheckout')}</span>
                </div>
            `}
            
            ${taxCents > 0 ? `
                <div class="flex justify-between text-base text-gray-600">
                    <span class="flex items-center gap-2">
                        📋 ${t('tax')}
                        ${taxDetails ? `<span class="text-xs text-gray-400">(${taxDetails.ratePercent}%)</span>` : ''}
                    </span>
                    <span>${formatPrice(taxCents)}</span>
                </div>
            ` : `
                <div class="flex justify-between text-sm text-gray-400 italic">
                    <span>📋 ${t('tax')}</span>
                    <span>${t('calculatedAtCheckout')}</span>
                </div>
            `}
            
            <div class="border-t-2 pt-3 flex justify-between text-2xl font-black text-gray-900">
                <span>${t('total')}</span>
                <span class="text-indigo-700">${formatPrice(grandTotal)}</span>
            </div>
        `;

        // Update submit button text with new total
        const btnSubmit = $('btnSubmit');
        if (btnSubmit && !btnSubmit.disabled) {
            btnSubmit.innerHTML = `${t('complete')} — ${formatPrice(grandTotal)}`;
        }
    }

    function render() {
        // ✅ Don't re-render if order is complete
        if (orderCompleted) {
            console.log('Order completed - skipping render');
            return;
        }

        const stored = sessionStorage.getItem('autoInxCart');
        cartData = stored ? JSON.parse(stored) : {};
        cartTotalCents = Object.values(cartData).reduce((s, e) => s + (e.item.price * e.quantity), 0);

        if (Object.keys(cartData).length === 0) {
            $('app').innerHTML = `<div class="text-center py-20">${renderHeader()}<p class="mt-10 text-xl font-bold">Tu carrito está vacío</p></div>`;
            return;
        }

        const grandTotal = cartTotalCents + shippingCents + taxCents;

        $('app').innerHTML = `
            ${renderHeader()}
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl">
                        <form id="checkoutForm" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block font-bold mb-2">${t('email')} *</label>
                                    <input type="email" id="buyer-email" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block font-bold mb-2">${t('name')} *</label>
                                    <input type="text" id="buyer-name" required class="w-full p-4 border-2 border-gray-300 rounded-xl outline-none">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block font-bold mb-1">${t('phone')} *</label>
                                <p class="text-xs text-gray-500 mb-2">${t('phoneHelp')}</p>
                                <div class="phone-input-group">
                                    <select id="country-code" class="country-select">
                                        <option value="+1">US +1</option>
                                        <option value="+57">CO +57</option>
                                    </select>
                                    <input type="tel" id="buyer-phone" required class="phone-input" placeholder="300 000 0000">
                                </div>
                            </div>

                            <div class="bg-gradient-to-r from-green-50 to-blue-50 p-5 rounded-xl border-2 border-green-200">
                                <p class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <span>📱</span> ${currentLang === 'es' ? 'Preferencias de Notificaciones' : 'Notification Preferences'}
                                </p>
                                <p class="text-xs text-gray-600 mb-4">
                                    ${currentLang === 'es' 
                                        ? 'Selecciona cómo deseas recibir actualizaciones sobre tu pedido:' 
                                        : 'Choose how you want to receive order updates:'}
                                </p>
                                
                                <div class="space-y-3">
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-green-100">
                                        <input type="checkbox" id="whatsapp-opt" checked class="w-5 h-5 text-green-600 rounded">
                                        <label for="whatsapp-opt" class="text-sm font-semibold text-green-800 cursor-pointer">
                                            <span class="mr-1">💬</span>
                                            ${currentLang === 'es' 
                                                ? 'Sí, deseo recibir notificaciones por WhatsApp' 
                                                : 'Yes, I want WhatsApp notifications'}
                                        </label>
                                    </div>
                                    
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-blue-100">
                                        <input type="checkbox" id="sms-opt" class="w-5 h-5 text-blue-600 rounded">
                                        <label for="sms-opt" class="text-sm font-semibold text-blue-800 cursor-pointer">
                                            <span class="mr-1">💬</span>
                                            ${currentLang === 'es' 
                                                ? 'Sí, deseo recibir notificaciones por SMS/Texto' 
                                                : 'Yes, I want SMS/Text notifications'}
                                        </label>
                                    </div>
                                </div>
                                
                                <p class="text-[10px] text-gray-500 mt-3 italic">
                                    ${currentLang === 'es' 
                                        ? '* Recibirás confirmación del pedido y actualizaciones de entrega' 
                                        : '* You will receive order confirmation and delivery updates'}
                                </p>
                            </div>

                            <div class="address-highlight-container">
                                <label class="flex items-center gap-3 text-xl font-black text-indigo-900 mb-4">📍 ${t('address')}</label>
                                <input type="text" id="delivery-address" required class="address-input" data-validated="false" placeholder="${t('addressHelp')}">
                                <div id="addressStatus" class="mt-3 font-bold text-orange-600">${t('statusDefault')}</div>
                                <div id="map-container"></div>
                            </div>

                            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-2xl shadow-xl hover:bg-indigo-700 transition transform hover:scale-[1.01]">
                                ${t('complete')} — ${formatPrice(grandTotal)}
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-3xl shadow-xl sticky top-6 border-t-8 border-pink-500">
                        <h3 class="text-xl font-black mb-6 uppercase tracking-wider text-gray-400">${t('summary')}</h3>
                        <div class="space-y-4 mb-6">
                            ${Object.values(cartData).map(e => `
                                <div class="flex justify-between text-sm border-b pb-2">
                                    <span class="font-medium">${e.quantity}x ${e.item.name}</span>
                                    <span class="font-bold">${formatPrice(e.item.price * e.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div id="cart-summary-breakdown" class="mt-6 border-t-2 pt-6 space-y-3">
                            <div class="flex justify-between text-base font-semibold text-gray-700">
                                <span>${t('subtotal')}</span>
                                <span>${formatPrice(cartTotalCents)}</span>
                            </div>
                            
                            <div class="flex justify-between text-sm text-gray-400 italic">
                                <span>📦 ${t('shipping')}</span>
                                <span>${t('calculatedAtCheckout')}</span>
                            </div>
                            
                            <div class="flex justify-between text-sm text-gray-400 italic">
                                <span>📋 ${t('tax')}</span>
                                <span>${t('calculatedAtCheckout')}</span>
                            </div>
                            
                            <div class="border-t-2 pt-3 flex justify-between text-2xl font-black text-gray-900">
                                <span>${t('total')}</span>
                                <span class="text-indigo-700">${formatPrice(grandTotal)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;

        initLiveValidation();
        initMaps();
        
        // ✅ Only attach once to prevent multiple handlers
        const form = $('checkoutForm');
        if (form && !form.dataset.listenerAttached) {
            form.onsubmit = handleSubmit;
            form.dataset.listenerAttached = 'true';
        }
    }

    function initLiveValidation() {
        const e = $('buyer-email'), p = $('buyer-phone'), g = p.closest('.phone-input-group');
        e.oninput = () => {
            const v = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value);
            e.classList.toggle('input-success', v); e.classList.toggle('input-error', !v && e.value !== "");
        };
        p.oninput = () => {
            const v = p.value.length >= 7 && /^\d+$/.test(p.value);
            g.classList.toggle('input-success', v); g.classList.toggle('input-error', !v && p.value !== "");
        };
    }

    async function initMaps() {
        try {
            const res = await fetch('/.netlify/functions/getGoogleMapsKey');
            const { apiKey } = await res.json();
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places`;
            s.onload = () => {
                const inp = $('delivery-address');
                autocomplete = new google.maps.places.Autocomplete(inp, { types: ['address'] });
                map = new google.maps.Map($('map-container'), { center: { lat: 4.711, lng: -74.072 }, zoom: 12, disableDefaultUI: true });
                marker = new google.maps.Marker({ position: { lat: 4.711, lng: -74.072 }, map, draggable: true });

                autocomplete.addListener('place_changed', async () => {
                    const place = autocomplete.getPlace();
                    if (!place.geometry) return;
                    map.setCenter(place.geometry.location); map.setZoom(17); marker.setPosition(place.geometry.location);
                    inp.dataset.validated = 'true';
                    $('addressStatus').innerHTML = `<span class="text-green-600">${t('valid')}</span>`;
                    
                    // ✅ Calculate shipping & tax when address is selected
                    await calculateShippingAndTax();
                });
            };
            document.head.appendChild(s);
        } catch (err) {}
    }

    // ✅ Calculate shipping and tax - NOW UPDATES WITHOUT FULL RE-RENDER
    function buildParcelsFromCart() {
        const cart = Object.values(cartData);
        
        if (cart.length === 0) {
            console.warn('Cart is empty');
            return null;
        }
    
        // Check if all items have dimensions
        const missingDimensions = cart.filter(entry => 
            !entry.item.dimensions || 
            !entry.item.dimensions.length || 
            !entry.item.dimensions.width || 
            !entry.item.dimensions.height || 
            !entry.item.dimensions.weight
        );
    
        if (missingDimensions.length > 0) {
            console.warn('Some items missing dimensions:', missingDimensions.map(e => e.item.name));
            
            // Use default dimensions as fallback
            const totalItems = cart.reduce((sum, e) => sum + e.quantity, 0);
            return [{
                length: "12",
                width: "9",
                height: "6",
                distance_unit: "in",
                weight: Math.max(1, totalItems).toString(),
                mass_unit: "lb"
            }];
        }
    
        // Strategy: Single box approach (combine weights, use largest dimensions)
        const totalWeight = cart.reduce((sum, entry) => {
            const itemWeight = entry.item.dimensions.weight * entry.quantity;
            return sum + itemWeight;
        }, 0);
    
        // Find largest dimensions across all items
        const maxLength = Math.max(...cart.map(e => e.item.dimensions.length));
        const maxWidth = Math.max(...cart.map(e => e.item.dimensions.width));
        const maxHeight = Math.max(...cart.map(e => e.item.dimensions.height));
    
        // Add 2 inches padding for packaging material
        const paddedLength = maxLength + 2;
        const paddedWidth = maxWidth + 2;
        const paddedHeight = maxHeight + 2;
    
        console.log('📦 Parcel built from cart:', {
            dimensions: `${paddedLength}"×${paddedWidth}"×${paddedHeight}"`,
            weight: `${totalWeight.toFixed(1)} lbs`,
            items: cart.length
        });
    
        return [{
            length: paddedLength.toString(),
            width: paddedWidth.toString(),
            height: paddedHeight.toString(),
            distance_unit: "in",
            weight: totalWeight.toFixed(1),
            mass_unit: "lb"
        }];
    }

        async function calculateShippingAndTax() {
            const addressInput = $('delivery-address');
            const address = addressInput?.value?.trim();
            
            if (!address || addressInput.dataset.validated !== 'true') {
                shippingCents = 0;
                taxCents = 0;
                shippingDetails = null;
                taxDetails = null;
                updateCartSummary();
                return;
            }
        
            $('btnSubmit').disabled = true;
            $('btnSubmit').innerHTML = `${t('calculatingShipping')} <span class="calculating-spinner"></span>`;
        
            try {
                const addressParts = address.split(',');
                const stateZip = addressParts[addressParts.length - 2]?.trim().split(' ') || [];
                const orderState = stateZip[0] || 'CA';
                const zipCode = stateZip[1] || '00000';
        
                // ✅ Build parcels from actual product dimensions
                const parcels = buildParcelsFromCart();
                
                if (!parcels) {
                    throw new Error('Unable to build shipping parcels from cart');
                }
        
                // 1. Calculate Shipping with real dimensions
                try {
                    const shippingRes = await fetch('/.netlify/functions/calculateTax', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subtotalCents: cartTotalCents,
                            state: orderState,
                            zipCode: zipCode,
                            // ✅ NEW: Send full address for accurate calculation
                            street: addressParts[0]?.trim() || '',
                            city: addressParts[1]?.trim() || '',
                            country: 'US'
                        })
                    });
        
                    if (shippingRes.ok) {
                        const shippingData = await shippingRes.json();
                        
                        // ✅ Show customer shipping options
                        if (shippingData.allRates && shippingData.allRates.length > 0) {
                            await displayShippingOptions(shippingData.allRates);
                            return; // Wait for customer selection
                        }
                        
                        // Fallback to displayRate if no options UI
                        if (shippingData.displayRate) {
                            shippingCents = Math.round(shippingData.displayRate.amount * 100);
                            shippingDetails = {
                                provider: shippingData.displayRate.provider,
                                servicelevel: shippingData.displayRate.servicelevel,
                                amount: shippingData.displayRate.amount,
                                estimated_days: shippingData.displayRate.estimated_days
                            };
                        }
                    } else {
                        console.warn('Shipping API failed, using default');
                        shippingCents = 1000;
                        shippingDetails = { provider: 'Standard', amount: 10 };
                    }
                } catch (shippingError) {
                    console.error('Shipping calculation error:', shippingError);
                    shippingCents = 1000;
                    shippingDetails = { provider: 'Standard', amount: 10 };
                }
        
                // 2. Calculate Tax
                $('btnSubmit').innerHTML = `${t('calculatingTax')} <span class="calculating-spinner"></span>`;
        
                try {
                    const taxRes = await fetch('/.netlify/functions/calculateTax', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            subtotalCents: cartTotalCents,
                            state: orderState,
                            zipCode: zipCode
                        })
                    });
        
                    if (taxRes.ok) {
                        const taxData = await taxRes.json();
                        taxCents = taxData.taxCents || 0;
                        taxDetails = {
                            rate: taxData.taxRate,
                            ratePercent: taxData.taxRatePercent
                        };
                    }
                } catch (taxError) {
                    console.error('Tax calculation error:', taxError);
                    taxCents = 0;
                }
        
                updateCartSummary();
        
            } catch (error) {
                console.error('Calculation error:', error);
                alert(t('shippingError'));
            } finally {
                $('btnSubmit').disabled = false;
                const grandTotal = cartTotalCents + shippingCents + taxCents;
                $('btnSubmit').innerHTML = `${t('complete')} — ${formatPrice(grandTotal)}`;
            }
        }
        // ✅ NEW: Display shipping options for customer to choose
        async function displayShippingOptions(rates) {
            if (!rates || rates.length === 0) return;
        
            // Sort by price
            rates.sort((a, b) => a.amount - b.amount);
        
            const modalHtml = `
                <div id="shipping-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
                        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 rounded-t-2xl">
                            <h3 class="text-2xl font-black">${currentLang === 'es' ? '📦 Selecciona Método de Envío' : '📦 Choose Shipping Method'}</h3>
                            <p class="text-sm opacity-90 mt-1">
                                ${currentLang === 'es' 
                                    ? 'Selecciona la opción que mejor se ajuste a tus necesidades' 
                                    : 'Select the option that best fits your needs'}
                            </p>
                        </div>
                        
                        <div class="p-6 space-y-4">
                            ${rates.map((rate, index) => {
                                const isCheapest = index === 0;
                                const isFastest = rate.estimated_days === Math.min(...rates.map(r => r.estimated_days || 999));
                                
                                return `
                                    <div class="relative border-2 rounded-xl p-5 cursor-pointer hover:border-indigo-500 hover:shadow-lg transition ${isCheapest ? 'border-green-500 bg-green-50' : 'border-gray-200'}"
                                         onclick="selectShipping(${index})">
                                        
                                        ${isCheapest ? '<div class="absolute -top-3 -right-3 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">💰 BEST VALUE</div>' : ''}
                                        ${isFastest && !isCheapest ? '<div class="absolute -top-3 -right-3 bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">⚡ FASTEST</div>' : ''}
                                        
                                        <div class="flex justify-between items-center">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-3 mb-2">
                                                    <span class="font-black text-xl">${rate.provider.toUpperCase()}</span>
                                                    <span class="text-sm text-gray-600">${rate.servicelevel}</span>
                                                </div>
                                                <div class="flex items-center gap-4 text-sm text-gray-600">
                                                    <span>📦 ${rate.estimated_days} ${currentLang === 'es' ? 'días' : 'days'}</span>
                                                    ${rate.duration_terms ? `<span class="text-xs">• ${rate.duration_terms}</span>` : ''}
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <div class="text-3xl font-black text-indigo-700">$${rate.amount.toFixed(2)}</div>
                                                <div class="text-xs text-gray-500">${rate.currency}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        
                        <div class="bg-gray-100 p-6 rounded-b-2xl">
                            <button onclick="closeShippingModal()" class="w-full py-3 bg-gray-500 text-white rounded-lg font-bold hover:bg-gray-600 transition">
                                ${currentLang === 'es' ? 'Cancelar' : 'Cancel'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        
            // Store rates for selection
            window.availableRates = rates;
        
            // Add to page
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
        
        window.selectShipping = async function(index) {
            const rate = window.availableRates[index];
            
            shippingCents = Math.round(rate.amount * 100);
            shippingDetails = {
                provider: rate.provider,
                servicelevel: rate.servicelevel,
                amount: rate.amount,
                estimated_days: rate.estimated_days,
                rateId: rate.object_id // ✅ Store for final order
            };
        
            console.log('✅ Customer selected shipping:', shippingDetails);
        
            closeShippingModal();
        
            // Now calculate tax with selected shipping
            $('btnSubmit').innerHTML = `${t('calculatingTax')} <span class="calculating-spinner"></span>`;
            
            try {
                const addressInput = $('delivery-address');
                const address = addressInput.value.split(',');
                const stateZip = address[address.length - 2]?.trim().split(' ') || [];
                
                const taxRes = await fetch('/.netlify/functions/calculateTax', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subtotalCents: cartTotalCents,
                        state: stateZip[0] || 'CA',
                        zipCode: stateZip[1] || '00000'
                    })
                });
        
                if (taxRes.ok) {
                    const taxData = await taxRes.json();
                    taxCents = taxData.taxCents || 0;
                    taxDetails = { rate: taxData.taxRate, ratePercent: taxData.taxRatePercent };
                }
            } catch (error) {
                console.error('Tax error:', error);
                taxCents = 0;
            }
        
            updateCartSummary();
            
            $('btnSubmit').disabled = false;
            const grandTotal = cartTotalCents + shippingCents + taxCents;
            $('btnSubmit').innerHTML = `${t('complete')} — ${formatPrice(grandTotal)}`;
        };
        
        window.closeShippingModal = function() {
            document.getElementById('shipping-modal')?.remove();
        };
    

    async function init() {
        try {
            const res = await fetch('/.netlify/functions/getClientFirebaseConfig');
            if (!res.ok) throw new Error("Could not fetch Firebase Config");
            const cfg = await res.json();
            const app = initializeApp(cfg);
            auth = getAuth(app); 
            db = getFirestore(app);
            onAuthStateChanged(auth, u => { 
                userId = u ? u.uid : 'anonymous';
                render(); 
            });
        } catch (e) { 
            console.error("Firebase Init Error:", e);
            render(); 
        }
    }
    
     // Replace the existing handleSubmit function with this version:
    
    async function handleSubmit(event) {
        event.preventDefault();
        
        if (!db) {
            alert("System not ready. Please refresh the page.");
            return;
        }
    
        const email = $('buyer-email').value;
        const phone = $('buyer-phone').value;
        const validAddr = $('delivery-address').dataset.validated === 'true';
    
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert(t('errorEmail'));
        if (phone.length < 7) return alert(t('errorPhone'));
        if (!validAddr) return alert(t('errorAddress'));
    
        $('btnSubmit').disabled = true;
        $('btnSubmit').innerText = "...";
    
        const order = {
            userId: userId || 'guest',
            buyerEmail: email,
            buyerName: $('buyer-name').value,
            buyerPhone: $('country-code').value + phone,
            whatsappConsent: $('whatsapp-opt').checked,
            smsConsent: $('sms-opt').checked,
            notificationPreferences: {
                whatsapp: $('whatsapp-opt').checked,
                sms: $('sms-opt').checked,
                email: true
            },
            deliveryAddress: $('delivery-address').value,
            items: Object.values(cartData).map(cartItem => ({
                id: cartItem.item.id,
                name: cartItem.item.name,
                price: cartItem.item.price,
                sku: cartItem.item.sku,
                quantity: cartItem.quantity
            })),
            subtotalCents: cartTotalCents,
            shippingCents: shippingCents,
            taxCents: taxCents,
            totalCents: cartTotalCents + shippingCents + taxCents,
            shippingDetails: shippingDetails,
            taxDetails: taxDetails,
            status: "Pending",
            paymentStatus: "Unpaid", // ✅ NEW
            createdAt: serverTimestamp(),
            timestamp: new Date().toISOString()
        };
    
        console.log("=== ORDER BEING SUBMITTED ===");
        console.log("subtotalCents:", order.subtotalCents);
        console.log("shippingCents:", order.shippingCents);
        console.log("taxCents:", order.taxCents);
        console.log("totalCents:", order.totalCents);
        console.log("=============================");
    
        try {
            const docRef = await addDoc(collection(db, "artifacts", "default-app-id", "public", "data", "orders"), order);
            console.log("✅ Order created successfully with ID:", docRef.id);
            
            // ✅ STEP 1: Generate Stripe Payment Link
            let paymentUrl = null;
            try {
                const paymentResponse = await fetch('/.netlify/functions/createStripePaymentLink', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: docRef.id,
                        buyerEmail: order.buyerEmail,
                        buyerName: order.buyerName,
                        items: order.items,
                        totalCents: order.totalCents,
                        subtotalCents: order.subtotalCents,
                        shippingCents: order.shippingCents,
                        taxCents: order.taxCents,
                        language: currentLang
                    })
                });
    
                if (paymentResponse.ok) {
                    const paymentData = await paymentResponse.json();
                    paymentUrl = paymentData.paymentUrl;
                    
                    // Save payment link to order
                    await updateDoc(docRef, {
                        stripePaymentUrl: paymentUrl,
                        stripePaymentLinkId: paymentData.paymentLinkId
                    });
                    
                    console.log('✅ Payment link created:', paymentUrl);
                } else {
                    console.error('❌ Payment link creation failed');
                }
            } catch (paymentError) {
                console.error('Payment link error:', paymentError);
                // Continue anyway - we can send payment link later from admin
            }
            
            // Adjust inventory
            try {
                for (const item of order.items) {
                    const itemRef = doc(db, "artifacts/default-app-id/public/data/items", item.id);
                    const itemSnap = await getDoc(itemRef);
                    
                    if (itemSnap.exists()) {
                        const currentStock = itemSnap.data().stock || 0;
                        const newStock = Math.max(0, currentStock - item.quantity);
                        await updateDoc(itemRef, { stock: newStock, updatedAt: serverTimestamp() });
                        console.log(`✅ ${item.name}: ${currentStock} → ${newStock}`);
                    }
                }
            } catch (inventoryError) {
                console.error("❌ Inventory adjustment failed:", inventoryError);
            }
            
            // ✅ STEP 2: Send email with payment link
            try {
                await fetch('/.netlify/functions/sendOrderConfirmation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: docRef.id,
                        buyerEmail: order.buyerEmail,
                        buyerName: order.buyerName,
                        buyerPhone: order.buyerPhone,
                        deliveryAddress: order.deliveryAddress,
                        items: order.items,
                        subtotalCents: order.subtotalCents,
                        shippingCents: order.shippingCents,
                        taxCents: order.taxCents,
                        totalCents: order.totalCents,
                        status: order.status,
                        paymentUrl: paymentUrl, // ✅ NEW: Include payment link
                        language: currentLang,
                        communicationLang: currentLang,
                        whatsappConsent: order.whatsappConsent,
                        smsConsent: order.smsConsent
                    })
                });
            } catch (emailError) {
                console.error("Email Error:", emailError);
            }
            
            // ✅ Lock rendering to prevent page refresh
            orderCompleted = true;
            sessionStorage.removeItem('autoInxCart');
            
            const successMessage = currentLang === 'es' 
                ? `<div class="text-center py-20">
                    ${renderHeader()}
                    <div class="max-w-2xl mx-auto">
                        <div class="mb-6">
                            <div class="text-6xl mb-4">✅</div>
                            <h2 class="text-4xl font-black text-green-600 mb-2">¡Pedido Recibido!</h2>
                            <p class="text-lg text-gray-700 mb-1">Gracias por tu compra</p>
                            <p class="text-sm text-gray-500">Número de pedido: <span class="font-mono font-bold">#${docRef.id.substring(0, 8)}</span></p>
                        </div>
                        
                        ${paymentUrl ? `
                        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-300 rounded-xl p-6 mb-6">
                            <p class="font-bold text-blue-900 mb-3 flex items-center justify-center gap-2">
                                <span class="text-2xl">💳</span> Completa tu Pago
                            </p>
                            <p class="text-sm text-blue-800 mb-4">
                                Por favor completa el pago para procesar tu pedido
                            </p>
                            <a href="${paymentUrl}" target="_blank" class="inline-block bg-blue-600 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-blue-700 transition shadow-lg transform hover:scale-105">
                                🔒 Pagar Ahora - ${formatPrice(order.totalCents)}
                            </a>
                        </div>
                        ` : ''}
                        
                        <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 text-left mb-4">
                            <p class="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <span>📧</span> Confirmación Enviada
                            </p>
                            <p class="text-sm text-blue-800">
                                Hemos enviado una confirmación${paymentUrl ? ' con el enlace de pago' : ''} a <strong>${order.buyerEmail}</strong>
                            </p>
                            ${order.whatsappConsent ? '<p class="text-xs text-green-700 mt-2">💬 También te enviaremos actualizaciones por WhatsApp</p>' : ''}
                            ${order.smsConsent ? '<p class="text-xs text-blue-700 mt-2">💬 También te enviaremos actualizaciones por SMS</p>' : ''}
                        </div>
                        
                        <div class="bg-gray-50 rounded-xl p-6 mb-6">
                            <h3 class="font-bold text-gray-700 mb-3">Resumen del Pedido</h3>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between"><span>Subtotal:</span><span>${formatPrice(order.subtotalCents)}</span></div>
                                <div class="flex justify-between"><span>Envío:</span><span>${formatPrice(order.shippingCents)}</span></div>
                                <div class="flex justify-between"><span>Impuesto:</span><span>${formatPrice(order.taxCents)}</span></div>
                                <div class="flex justify-between font-bold text-lg border-t pt-2"><span>Total:</span><span>${formatPrice(order.totalCents)}</span></div>
                            </div>
                        </div>
                        
                        <div class="mt-8">
                            <a href="/" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                                Volver a la Tienda
                            </a>
                        </div>
                    </div>
                </div>`
                : `<div class="text-center py-20">
                    ${renderHeader()}
                    <div class="max-w-2xl mx-auto">
                        <div class="mb-6">
                            <div class="text-6xl mb-4">✅</div>
                            <h2 class="text-4xl font-black text-green-600 mb-2">Order Received!</h2>
                            <p class="text-lg text-gray-700 mb-1">Thank you for your purchase</p>
                            <p class="text-sm text-gray-500">Order number: <span class="font-mono font-bold">#${docRef.id.substring(0, 8)}</span></p>
                        </div>
                        
                        ${paymentUrl ? `
                        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-300 rounded-xl p-6 mb-6">
                            <p class="font-bold text-blue-900 mb-3 flex items-center justify-center gap-2">
                                <span class="text-2xl">💳</span> Complete Your Payment
                            </p>
                            <p class="text-sm text-blue-800 mb-4">
                                Please complete payment to process your order
                            </p>
                            <a href="${paymentUrl}" target="_blank" class="inline-block bg-blue-600 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-blue-700 transition shadow-lg transform hover:scale-105">
                                🔒 Pay Now - ${formatPrice(order.totalCents)}
                            </a>
                        </div>
                        ` : ''}
                        
                        <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 text-left mb-4">
                            <p class="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <span>📧</span> Confirmation Sent
                            </p>
                            <p class="text-sm text-blue-800">
                                We've sent a confirmation${paymentUrl ? ' with payment link' : ''} to <strong>${order.buyerEmail}</strong>
                            </p>
                            ${order.whatsappConsent ? '<p class="text-xs text-green-700 mt-2">💬 We\'ll also send you updates via WhatsApp</p>' : ''}
                            ${order.smsConsent ? '<p class="text-xs text-blue-700 mt-2">💬 We\'ll also send you updates via SMS</p>' : ''}
                        </div>
                        
                        <div class="bg-gray-50 rounded-xl p-6 mb-6">
                            <h3 class="font-bold text-gray-700 mb-3">Order Summary</h3>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between"><span>Subtotal:</span><span>${formatPrice(order.subtotalCents)}</span></div>
                                <div class="flex justify-between"><span>Shipping:</span><span>${formatPrice(order.shippingCents)}</span></div>
                                <div class="flex justify-between"><span>Tax:</span><span>${formatPrice(order.taxCents)}</span></div>
                                <div class="flex justify-between font-bold text-lg border-t pt-2"><span>Total:</span><span>${formatPrice(order.totalCents)}</span></div>
                            </div>
                        </div>
                        
                        <div class="mt-8">
                            <a href="/" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                                Return to Store
                            </a>
                        </div>
                    </div>
                </div>`;
            
            $('app').innerHTML = successMessage;
        } catch (e) { 
            console.error("Firestore Error:", e);
            alert("Error al guardar: " + e.message); 
            $('btnSubmit').disabled = false; 
            const grandTotal = cartTotalCents + shippingCents + taxCents;
            $('btnSubmit').innerHTML = `${t('complete')} — ${formatPrice(grandTotal)}`;
        }
    }
    init();
</script>
