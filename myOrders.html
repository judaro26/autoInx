<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">My Orders - autoInx</title>
    <meta id="pageDescription" name="description" content="Check the history and status of your orders at autoInx.">
    <link rel="icon" type="image/x-icon" href="/images/AutoInx logo.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/AutoInx logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        accent: '#a78bfa'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); min-height: 100vh; }
        .glass-header {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #c4b5fd, #818cf8);
            border-radius: 3px;
        }
        .order-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .order-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.15); }
        
        .progress-bar-fill { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            body * { visibility: hidden; }
            .printable-order, .printable-order * { visibility: visible; }
            .printable-order {
                position: absolute; left: 0; top: 0; width: 100%;
                border: none !important; box-shadow: none !important;
            }
            .no-print { display: none !important; }
            .bg-gradient-to-r { background-color: #6366f1 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div class="flex flex-col min-h-screen">
        <div id="app" class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-10 py-8 flex-grow w-full">
            
            <div class="flex justify-end mb-4 no-print">
                <div id="user-status-container" class="text-sm font-medium text-gray-600 flex items-center space-x-4"></div>
            </div>

            <header class="glass-header rounded-3xl shadow-2xl p-8 mb-12 border-t-8 border-indigo-600 sticky top-4 z-50 no-print">
                <div class="flex flex-col lg:flex-row justify-between items-center gap-6">
                    <div class="flex items-center space-x-6">
                        <a href="/"><img src="images/AutoInx logo.png" alt="AutoInx" class="h-14 drop-shadow-lg"></a>
                        <h1 data-i18n="headerTitle" class="text-4xl lg:text-5xl font-extrabold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                            My Orders
                        </h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <select id="language-switcher" class="px-3 py-2 border rounded-full text-gray-700 font-semibold shadow-inner focus:ring-indigo-500 transition">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                        </select>
                        <a href="index.html" class="group flex items-center gap-3 px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-full hover:shadow-2xl transform hover:scale-105 transition-all duration-300">
                            <svg class="w-5 h-5 group-hover:-translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                            <span data-i18n="backToStoreLink">Return to Store</span>
                        </a>
                    </div>
                </div>
            </header>

            <div id="manualSearchSection" class="max-w-2xl mx-auto mb-12 p-6 glass-header rounded-3xl shadow-lg border-2 border-indigo-100 no-print">
                <h3 class="text-xl font-bold text-indigo-700 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <span data-i18n="findOrderTitle">Find a Specific Order</span>
                </h3>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="searchOrderId" placeholder="Order ID (e.g. #abc123...)" class="flex-1 px-4 py-3 rounded-xl border border-indigo-200 outline-none">
                    <input type="email" id="searchEmail" placeholder="Email Address" class="flex-1 px-4 py-3 rounded-xl border border-indigo-200 outline-none">
                    <button onclick="window.manualSearch()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition">Search</button>
                </div>
                <p id="searchError" class="text-red-500 text-sm mt-3 hidden"></p>
            </div>

            <div id="loadingState" class="min-h-[40vh] flex items-center justify-center">
                <div class="text-center">
                    <div class="w-16 h-16 mx-auto mb-6 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                    <p data-i18n="loadingText" class="text-2xl font-bold text-indigo-700">Loading your orders...</p>
                </div>
            </div>

            <div id="ordersContainer" class="hidden space-y-8">
                <div class="text-center mb-10 no-print">
                    <h2 data-i18n="historyTitle" class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Purchase History</h2>
                    <p data-i18n="historySubtitle" class="text-gray-600 mt-3 text-lg">Here are all your orders placed at autoInx</p>
                </div>
                <div id="ordersList" class="grid gap-8"></div>
            </div>

            <div id="messageContainer" class="mt-12"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const translations = {
            en: {
                pageTitle: 'My Orders - autoInx',
                pageDescription: 'Check the history and status of your orders at autoInx.',
                headerTitle: 'My Orders',
                backToStoreLink: 'Return to Store',
                loadingText: 'Loading your orders...',
                historyTitle: 'Purchase History',
                historySubtitle: 'Here are all your orders placed at autoInx',
                findOrderTitle: 'Find a Specific Order',
                notLoggedIn: 'Please log in to view your orders.',
                noOrdersTitle: "You don't have any orders yet",
                noOrdersSubtext: 'When you make your first purchase, it will appear here',
                goToStore: 'Go to the Store',
                order: 'Order',
                paid: 'PAID',
                pending: 'PENDING',
                totalPaid: 'Total Paid',
                shippingAddress: 'Shipping Address',
                notSpecified: 'Not Specified',
                items: 'Items',
                productsBought: 'Products bought:',
                statusDelivered: 'Delivered',
                statusShipped: 'Shipped',
                statusProcessing: 'Processing',
                statusCancelled: 'Cancelled',
                statusPending: 'Pending',
                loggedInAs: 'Logged in as',
                logout: 'Logout',
                notLoggedInStatus: 'Not Logged In'
            },
            es: {
                pageTitle: 'Mis Pedidos - autoInx',
                pageDescription: 'Revisa el historial y estado de tus pedidos en autoInx.',
                headerTitle: 'Mis Pedidos',
                backToStoreLink: 'Volver a la Tienda',
                loadingText: 'Cargando tus pedidos...',
                historyTitle: 'Historial de Compras',
                historySubtitle: 'Aquí tienes todos tus pedidos realizados en autoInx',
                findOrderTitle: 'Buscar un Pedido Específico',
                notLoggedIn: 'Inicia sesión para ver tus pedidos.',
                noOrdersTitle: 'Aún no tienes pedidos',
                noOrdersSubtext: 'Cuando hagas tu primera compra, aparecerá aquí',
                goToStore: 'Ir a la Tienda',
                order: 'Pedido',
                paid: 'PAGADO',
                pending: 'PENDIENTE',
                totalPaid: 'Total Pagado',
                shippingAddress: 'Dirección de Envío',
                notSpecified: 'No especificada',
                items: 'Artículos',
                productsBought: 'Productos comprados:',
                statusDelivered: 'Entregado',
                statusShipped: 'Enviado',
                statusProcessing: 'Procesando',
                statusCancelled: 'Cancelado',
                statusPending: 'Pendiente',
                loggedInAs: 'Sesión iniciada como',
                logout: 'Cerrar Sesión',
                notLoggedInStatus: 'Sesión no Iniciada'
            }
        };

        let db, auth, currentLang = localStorage.getItem('lang') || 'en';
        const appId = window.__app_id || 'default-app-id';
        const CENTRAL_ORDERS_PATH = `artifacts/${appId}/public/data/orders`;

        function applyTranslations(lang) {
            const dict = translations[lang];
            document.documentElement.lang = lang;
            document.getElementById('pageTitle').textContent = dict.pageTitle;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            updateUserStatusDisplay(auth?.currentUser);
        }

        function updateUserStatusDisplay(user) {
            const container = document.getElementById('user-status-container');
            const dict = translations[currentLang];
            if (!container) return;
            if (user && !user.isAnonymous) {
                container.innerHTML = `
                    <span class="text-gray-500">${dict.loggedInAs}:</span>
                    <span class="font-bold text-indigo-600">${user.email}</span>
                    <button onclick="window.handleLogout()" class="px-4 py-1 border border-red-400 text-red-600 rounded-full hover:bg-red-50 transition shadow-sm">${dict.logout}</button>
                `;
            } else {
                container.innerHTML = `<span class="font-bold text-red-500">${dict.notLoggedInStatus}</span>`;
            }
        }

        window.handleLogout = () => {
            signOut(auth).then(() => window.location.href = '/index.html');
        };

        const formatPrice = c => `$${(c/100).toFixed(2)}`;
        const formatTime = (ts) => {
            if (!ts) return translations[currentLang].notSpecified;
            const date = ts.toDate ? ts.toDate() : new Date(ts);
            return date.toLocaleDateString() + ' • ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        };

        function getStatusStep(status) {
            const steps = { 'Pending': 1, 'Processing': 2, 'Shipped': 3, 'Delivered': 4, 'Cancelled': 0 };
            return steps[status] || 1;
        }

        async function manualSearch() {
            const orderId = document.getElementById('searchOrderId').value.trim().replace('#', '');
            const email = document.getElementById('searchEmail').value.trim().toLowerCase();
            const errorEl = document.getElementById('searchError');
            if (!orderId || !email) { errorEl.textContent = "Required fields missing."; errorEl.classList.remove('hidden'); return; }
            
            try {
                const docSnap = await getDoc(doc(db, CENTRAL_ORDERS_PATH, orderId));
                if (docSnap.exists() && (docSnap.data().customerEmail?.toLowerCase() === email || docSnap.data().email?.toLowerCase() === email)) {
                    renderOrders([{ id: docSnap.id, ...docSnap.data() }]);
                } else { throw new Error("Order not found or email mismatch."); }
            } catch (e) { errorEl.textContent = e.message; errorEl.classList.remove('hidden'); }
        }

        window.reorderItems = (items) => {
            let cart = JSON.parse(sessionStorage.getItem('autoInxCart') || '{}');
            items.forEach(i => {
                const id = i.id || i.productId;
                if (cart[id]) cart[id].quantity += (i.quantity || 1);
                else cart[id] = { item: { id, name: i.name, price: i.price }, quantity: i.quantity || 1 };
            });
            sessionStorage.setItem('autoInxCart', JSON.stringify(cart));
            window.location.href = '/checkout.html';
        };

        window.printOrder = (id) => {
            const card = Array.from(document.querySelectorAll('.order-card')).find(c => c.innerHTML.includes(id.slice(0,10)));
            if (card) { card.classList.add('printable-order'); window.print(); card.classList.remove('printable-order'); }
        };

        window.reportOrderIssue = (id, status) => {
            const msg = `Help with order #${id.slice(0,10)} (Status: ${status})`;
            window.open(`https://wa.me/573217040789?text=${encodeURIComponent(msg)}`, '_blank');
        };

        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            const dict = translations[currentLang];
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('ordersContainer').classList.remove('hidden');

            if (!orders.length) {
                container.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl shadow-lg">
                    <h3 class="text-2xl font-bold text-gray-700">${dict.noOrdersTitle}</h3>
                    <a href="index.html" class="mt-6 inline-block px-8 py-4 bg-indigo-600 text-white font-bold rounded-full">${dict.goToStore}</a>
                </div>`;
                return;
            }

            container.innerHTML = orders.map((order, idx) => {
                const step = getStatusStep(order.status);
                const items = order.items || [];
                return `
                <div class="order-card bg-white rounded-3xl shadow-xl overflow-hidden border-t-8 border-indigo-600 mb-8" style="animation: slideUp 0.6s ease-out forwards; animation-delay: ${idx*0.1}s">
                    <div class="p-8">
                        <div class="flex justify-between mb-6">
                            <div>
                                <h3 class="text-2xl font-black">${dict.order} <span class="text-indigo-600">#${(order.id||'').slice(0,10)}</span></h3>
                                <p class="text-sm text-gray-500">${formatTime(order.createdAt)}</p>
                            </div>
                            <span class="px-4 py-2 rounded-full text-xs font-bold ${order.isPaid ? 'bg-green-500' : 'bg-yellow-500'} text-white">${order.isPaid ? dict.paid : dict.pending}</span>
                        </div>

                        ${order.status !== 'Cancelled' ? `
                        <div class="mb-10">
                            <div class="flex justify-between text-[10px] font-bold uppercase mb-2">
                                <span class="${step>=1?'text-indigo-600':'text-gray-300'}">${dict.statusPending}</span>
                                <span class="${step>=2?'text-indigo-600':'text-gray-300'}">${dict.statusProcessing}</span>
                                <span class="${step>=3?'text-indigo-600':'text-gray-300'}">${dict.statusShipped}</span>
                                <span class="${step>=4?'text-indigo-600':'text-gray-300'}">${dict.statusDelivered}</span>
                            </div>
                            <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-600 progress-bar-fill" style="width: ${(step/4)*100}%"></div>
                            </div>
                        </div>` : `<div class="bg-red-50 text-red-600 p-4 rounded-xl font-bold text-center mb-10">${dict.statusCancelled}</div>`}

                        <div class="grid md:grid-cols-3 gap-6 border-b pb-6">
                            <div><p class="text-xs text-gray-400 font-bold uppercase">${dict.totalPaid}</p><p class="text-xl font-black text-indigo-600">${formatPrice(order.totalCents||0)}</p></div>
                            <div><p class="text-xs text-gray-400 font-bold uppercase">${dict.shippingAddress}</p><p class="text-sm font-medium">${order.deliveryAddress||dict.notSpecified}</p></div>
                            <div><p class="text-xs text-gray-400 font-bold uppercase">${dict.items}</p><p class="text-xl font-black">${items.length}</p></div>
                        </div>

                        <ul class="py-6 space-y-2">
                            ${items.map(i => `<li class="flex justify-between text-sm"><span>${i.quantity}x ${i.name}</span><b>${formatPrice(i.price * i.quantity)}</b></li>`).join('')}
                        </ul>

                        <div class="flex flex-wrap justify-end gap-3 no-print border-t pt-6">
                            <button onclick='window.reportOrderIssue("${order.id}", "${order.status}")' class="px-4 py-2 border-2 border-red-500 text-red-500 font-bold rounded-xl text-sm">Report Issue</button>
                            <button onclick='window.printOrder("${order.id}")' class="px-4 py-2 bg-gray-800 text-white font-bold rounded-xl text-sm">Print</button>
                            <button onclick='window.reorderItems(${JSON.stringify(items).replace(/'/g, "&apos;")})' class="px-4 py-2 bg-pink-500 text-white font-bold rounded-xl text-sm">Re-order</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function init() {
            const res = await fetch('/.netlify/functions/getClientFirebaseConfig');
            const cfg = await res.json();
            const app = initializeApp(cfg);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, user => {
                updateUserStatusDisplay(user);
                if (user && !user.isAnonymous) {
                    const q = query(collection(db, CENTRAL_ORDERS_PATH), where("userId", "==", user.uid), orderBy('createdAt', 'desc'));
                    onSnapshot(q, snap => renderOrders(snap.docs.map(d => ({id: d.id, ...d.data()}))), err => {
                        console.error(err);
                        document.getElementById('messageContainer').innerHTML = `<p class="text-center p-4 bg-red-100 rounded-xl">Index building. Please try again in 5 mins.</p>`;
                    });                
                } else {
                // User is NOT logged in - simply hide the loader and let them use the Manual Search
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('ordersContainer').classList.remove('hidden');
                // Ensure the manual search section is visible
                document.getElementById('manualSearchSection').classList.remove('hidden');
                }
            });

            document.getElementById('language-switcher').addEventListener('change', e => {
                currentLang = e.target.value;
                localStorage.setItem('lang', currentLang);
                applyTranslations(currentLang);
            });
            applyTranslations(currentLang);
        }

        window.manualSearch = manualSearch;
        init();
    </script>
</body>
</html>
